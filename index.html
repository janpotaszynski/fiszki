niu hipertensyjnym – tyraminę, fenyloetyloaminę (sery żółte, wina czerwone, owoce cytrusowe, soja) mogły wywołać gwałtowny wzrost ciśnienia z niebezpiecznymi następstwami krążeniowymi i mózgowymi", "inne DN: senność, niedociśnienie ortostatyczne, niewyraźne widzenie, suchość w ustach i zaparcia (Lippincott)", "**INT: SSRI nie powinny być podawane jednocześnie z IMAO ze względu na ryzyko wystąpienia zespołu serotoninowego**; zarówno SSRI, jak i IMAO wymagają co najmniej **2-tygodniowego okresu karencji** przed podaniem drugiego typu leku, **z wyjątkiem fluoksetyny, którą należy odstawić co najmniej 6 tyg. przed rozpoczęciem stosowania IMAO** (Lippincott)", "jednoczesne stosowanie IMAO i bezpośrednich lub pośrednich sympatykomimetyków, takich jak **pseudoefedryna**, może wywołać wysokie nadciśnienie (Lippincott)", "Lippincott (ryc. 17.10): wysokie ryzyko hipotensji ortostatycznej – fenelzyna#, tranylcypromina#; bezsenność – selegilina, tranylcypromina#"], "y": true}, {"t": "cell", "name": "Moklobemid", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalny, selektywny inhibitor MAO-A**", "y": false}, {"t": "cell", "name": "Moklobemid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wzrost NA, 5-HT i D → działanie p/depresyjne", "wykład (slajd 42): lek o słabszym działaniu p/lękowym i umiarkowanym wpływie na napęd psychoruchowy"], "y": false}, {"t": "cell", "name": "Moklobemid", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, **fobia społeczna**", "zahamowanie, apatia, brak motywacji, wycofanie społeczne; zaburzenia lękowe; depresja atypowa (hipersomnia, hiperfagia) (wykład, slajd 67)"], "y": false}, {"t": "cell", "name": "Moklobemid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**przewaga selektywnych IMAO nad nieselektywnymi (wykład, slajd 60):** odwracalne blokowanie MAO (efekt krótkotrwały) · blokowanie jednego izoenzymu (rozkładanie tyraminy możliwe) · mniejsza hepatotoksyczność · słabsze interakcje z tyraminą · **nie ma wymogu ograniczenia diety** (sery, wina czerwone) · słabsze zaburzenia snu i mniejsza utrata masy ciała · mniejsze ryzyko interakcji z lekami"], "y": false}, {"t": "cell", "name": "Fenelzyna, Tranylcypromina #", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**nieodwracalne, nieselektywne inhibitory MAO** (MAO-A i MAO-B)", "y": false}, {"t": "cell", "name": "Fenelzyna, Tranylcypromina #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wzrost NA, 5-HT i D → działanie p/depresyjne", "tranylcypromina# – działanie pobudzające podobne do amfetaminy (Lippincott)"], "y": false}, {"t": "cell", "name": "Fenelzyna, Tranylcypromina #", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia depresyjne (atypowa depresja, depresja oporna na leczenie)**, oporne na leczenie zaburzenia paniczne i fobia społeczna (konspekt)"], "y": false}, {"t": "cell", "name": "Fenelzyna, Tranylcypromina #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["pełny efekt tyraminowy – **bezwzględna konieczność ograniczeń dietetycznych**", "Lippincott (ryc. 17.10): wysokie ryzyko hipotensji ortostatycznej (obie); bezsenność (tranylcypromina#)"], "y": false}, {"t": "cell", "name": "Izokarboksazyd #", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**nieselektywny i nieodwracalny inhibitor MAO**", "y": false}, {"t": "cell", "name": "Izokarboksazyd #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "wzrost NA, 5-HT i D → działanie p/depresyjne", "y": false}, {"t": "cell", "name": "Izokarboksazyd #", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia depresyjne oporne na leczenie", "y": false}, {"t": "cell", "name": "Izokarboksazyd #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa – efekt tyraminowy, konieczność ograniczeń dietetycznych", "y": false}, {"t": "cell", "name": "Selegilina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**selektywny inhibitor MAO-B** (w małych dawkach); **w dużych dawkach nieselektywna**"], "y": false}, {"t": "cell", "name": "Selegilina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wzrost przekaźnictwa dopaminergicznego (MAO-B metabolizuje głównie DA)", "**jedyny lek p/depresyjny dostępny w systemie transdermalnym** (Lippincott)", "podawana w postaci plastra transdermalnego może powodować **mniejsze hamowanie jelitowego i wątrobowego MAO w małych dawkach**, ponieważ unika efektu pierwszego przejścia (Lippincott)", "działanie pobudzające podobne do amfetaminy (Lippincott)"], "y": false}, {"t": "cell", "name": "Selegilina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne", "[stosowana również w leczeniu **choroby Parkinsona**] (Lippincott)"], "y": false}, {"t": "cell", "name": "Selegilina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["może powodować pobudzenie lub bezsenność", "Lippincott (ryc. 17.10): bezsenność"], "y": false}]}, {"title": "LEKI O ATYPOWYM MECHANIZMIE DZIAŁANIA", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI O ATYPOWYM MECHANIZMIE DZIAŁANIA", "blocks": [{"h": null, "items": ["Tianeptyna", "Breksanolon", "Esketamina", "Leki roślinne (wykład)"]}], "n": 4}, {"t": "cell", "name": "Tianeptyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**zwiększa wychwyt zwrotny 5-HT** w neuronach kory mózgowej i hipokampa (mechanizm odwrotny niż SSRI)", "**modulator glutaminianergiczny** → wzmocnienie funkcji receptora **AMPA**", "**pełny AGO receptorów opioidowych μ**"], "y": false}, {"t": "cell", "name": "Tianeptyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["mechanizm nie do końca jasny (wykład)", "zmniejsza reaktywność osi podwzgórzowo-przysadkowo-nadnerczowej → przeciwdziała zanikowi dendrytów → **zwiększa plastyczność neuronów** (wykład)", "**działanie cholinolityczne znikome**; wywiera efekt sedatywny i p/lękowy (wykład)", "α1-adrenergiczna „up”-regulacja (zmiany adaptacyjne, wykład)"], "y": false}, {"t": "cell", "name": "Tianeptyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**depresje o łagodnym i umiarkowanym nasileniu** (wykład)", "zaburzenia depresyjne i zaburzenia lękowe (konspekt)", "zaburzenia lękowe (lęk uogólniony, napadowy, mieszane stany lękowe) (wykład, slajd 67)", "dawkowanie: 12,5–37,5 mg/d"], "y": false}, {"t": "cell", "name": "Tianeptyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**niskie ryzyko działań niepożądanych** (konspekt)", "suchość w jamie ustnej, zaparcia, poczucie oszołomienia, pobudzenie seksualne, zawroty głowy, wzmożona potliwość, uderzenia gorąca do głowy", "**u części chorych wywiera działanie stymulujące** – może nasilać lęk, niepokój, zaburzenia snu (wykład)"], "y": false}, {"t": "cell", "name": "Breksanolon", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**allosteryczny modulator aktywności receptorów GABA-A** – nasilenie działania GABA", "y": false}, {"t": "cell", "name": "Breksanolon", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**analog neurosteroidu allopregnanolonu** (metabolitu progesteronu); po porodzie poziom allopregnanolonu spada, co może być związane z etiologią depresji poporodowej (Lippincott)", "podawany **dożylnie przez 60 godzin** w warunkach szpitalnych"], "y": false}, {"t": "cell", "name": "Breksanolon", "col": "NA CO", "sub": "(wskazania)", "a": "**depresja poporodowa**", "y": false}, {"t": "cell", "name": "Breksanolon", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**ryzyko nadmiernej sedacji, nagłej utraty przytomności i niedotlenienia** → potencjalne zdarzenia niepożądane wymagające nadzoru i monitorowania podczas terapii", "interakcja pacjentki z dzieckiem (lub dziećmi) powinna być monitorowana w trakcie leczenia (Lippincott)"], "y": false}, {"t": "cell", "name": "Esketamina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**nieselektywny, niekompetencyjny ANT receptora NMDA** (N-metylo-D-asparaginianowego)", "S-enancjomer racemicznej ketaminy (środka znieczulającego) (Lippincott)"], "y": false}, {"t": "cell", "name": "Esketamina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**działa szybciej niż standardowe leki p/depresyjne** (Lippincott)", "podaje się **donosowo** w terapii wspomagającej"], "y": false}, {"t": "cell", "name": "Esketamina", "col": "NA CO", "sub": "(wskazania)", "a": ["**lekooporna depresja** (konspekt)", "terapia poważnych zaburzeń depresyjnych z **myślami lub zachowaniami samobójczymi** (Lippincott)", "**jedyny z wymienionych zatwierdzony do wspomagania leków p/depresyjnych w leczeniu depresji lekoopornej** (Lippincott, pyt. 17.8)"], "y": false}, {"t": "cell", "name": "Esketamina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**ze względu na ryzyko sedacji i uczucia dysocjacji** esketamina jest podawana w kontrolowanym środowisku, w którym pacjenci muszą być ściśle monitorowani **przez 2 godziny po podaniu**", "**substancja kontrolowana** ze względu na wspomniane zagrożenia, a także ryzyko przedawkowania i niewłaściwego stosowania (Lippincott)", "poważne zdarzenia niepożądane: sedacja, mdłości i wymioty, dysocjacja i halucynacje oraz podwyższone ciśnienie krwi (Lippincott)"], "y": false}, {"t": "cell", "name": "Leki roślinne (wykład)", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**ziele dziurawca** – hiperycyna, pseudohiperycyna, hiperforyna", "**miłorząb japoński** – hamowanie MAO i powinowactwo do rec. 5-HT1A"], "y": false}, {"t": "cell", "name": "Leki roślinne (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["dziurawiec hamuje: wychwyt 5-HT, dopaminy, noradrenaliny oraz aktywność MAO", "wielokrotne zażywanie → spadek wrażliwości receptorów β i up-regulacja receptorów 5-HT2"], "y": false}, {"t": "cell", "name": "Leki roślinne (wykład)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**INT:** dziurawiec jest silnym induktorem enzymatycznym – liczne interakcje", "y": false}]}, {"title": "ANTAGONIŚCI SEROTONINY I DOPAMINY – LEKI WSPOMAGAJĄCE", "level": "section", "parent": null, "cards": [{"t": "cell", "name": "Atypowe leki p/psychotyczne (SGA) jako leki wspomagające", "col": "RECEPTOR", "sub": "(na co działa)", "a": "blokują receptory 5-HT i D (patrz tabelka – neuroleptyki)", "y": true}, {"t": "cell", "name": "Atypowe leki p/psychotyczne (SGA) jako leki wspomagające", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**od 60 do 80% pacjentów pozytywnie reaguje na leki p/depresyjne, niemniej jednak od 20 do 40% wykazuje częściową lub słabą odpowiedź na monoterapię** (Lippincott)", "SGA są stosowane **jako leczenie wspomagające** u pacjentów, którzy nie w pełni odpowiedzieli na leczenie p/depresyjne"], "y": true}, {"t": "cell", "name": "Atypowe leki p/psychotyczne (SGA) jako leki wspomagające", "col": "NA CO", "sub": "(wskazania)", "a": ["**arypiprazol, brekspiprazol i kwetiapina** są zatwierdzone do stosowania jako leki wspomagające w dużych zaburzeniach depresyjnych (MDD) (Lippincott)", "**terapia skojarzona fluoksetyną i olanzapiną** jest zatwierdzona do terapii depresji lekoopornej (Lippincott)", "**arypiprazol** – jedyny z wymienionych zatwierdzony jako leczenie wspomagające u pacjentów z częściową odpowiedzią na leki p/depresyjne (Lippincott, pyt. 17.9)", "konspekt: neuroleptyki jako leki normotymiczne – klozapina, kwetiapina, olanzapina, risperidon, arypiprazol"], "y": true}, {"t": "cell", "name": "Atypowe leki p/psychotyczne (SGA) jako leki wspomagające", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "patrz tabelka – neuroleptyki", "y": true}]}, {"title": "LEKI NORMOTYMICZNE – LECZENIE MANII I ChAD", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI NORMOTYMICZNE – LECZENIE MANII I ChAD", "blocks": [{"h": null, "items": ["Sole litu (węglan litu)", "Leki p/padaczkowe jako normotymiczne"]}], "n": 2}, {"t": "cell", "name": "Sole litu (węglan litu)", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**kation monowalentny** – mechanizm nie w pełni poznany", "wpływ na drugi przekaźnik i wewnątrzkomórkową transdukcję sygnału; może mieć również działanie neuroprotekcyjne (Lippincott)"], "y": false}, {"t": "cell", "name": "Sole litu (węglan litu)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**konspekt:** wpływ na transport i dystrybucję jonów sodowych i wapniowych; mechanizm p/depresyjnego działania → nasilenie przekaźnictwa 5-HT w hipokampie przez nasilenie funkcji neuronów serotoninergicznych i uwalnianie 5-HT oraz nasilenie przekaźnictwa NA; mechanizm p/maniakalnego działania → hamowanie przekaźnictwa NA, przez zahamowanie powstawania trifosforanu inozytolu i przekaźnictwa DA przez hamowanie rozwoju nadwrażliwości rec. dopaminergicznych", "**wykład:** zapobiega nawrotom zaburzeń afektywnych; lit wpływa na układy wtórnych przekaźników przez hamowanie aktywności monofosfatazy inozytolu, który odgrywa rolę w modulacji białek G", "**lit jest skuteczny w leczeniu 60–80% pacjentów cierpiących na manię i hipomanię** (Lippincott)"], "y": false}, {"t": "cell", "name": "Sole litu (węglan litu)", "col": "NA CO", "sub": "(wskazania)", "a": ["**sole litu są stosowane doraźnie i profilaktycznie w leczeniu ChAD** (Lippincott)", "stosowany w zapobieganiu nawracających zaburzeń afektywnych dwubiegunowych, leczeniu stanów manii, umiarkowanej depresji i **jako lek potencjalizujący działanie leków p/depresyjnych i p/psychotycznych** (wykład)", "**lit może być najlepszym wyborem do stabilizacji nastroju u pacjentów z zaburzeniami czynności wątroby** – jest jedynym lekiem na ChAD, który nie jest metabolizowany w wątrobie (Lippincott, pyt. 17.5)"], "y": false}, {"t": "cell", "name": "Sole litu (węglan litu)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**indeks terapeutyczny litu jest bardzo mały, a stężenie litu w surowicy powinno być monitorowane podczas leczenia** (Lippincott)", "**częste DN:** bóle głowy, suchość w ustach, polidypsja, wielomocz, polifagia, zaburzenia żołądkowo-jelitowe, niewielkie drżenie rąk, zawroty głowy, zmęczenie, reakcje dermatologiczne i sedacja", "**DN wskazujące na wyższe stężenie litu w osoczu i potencjalną toksyczność: ataksja, niewyraźna mowa, drżenie szorstkie, dezorientacja i drgawki** (Lippincott)", "stosowanie litu może powodować wystąpienie **moczówki prostej nefrogennej**, szczególnie w przypadku długotrwałego leczenia; **czynność tarczycy może być obniżona i powinna być monitorowana**", "**lit jest eliminowany przez nerki** i należy zachować ostrożność podczas dawkowania u pacjentów z zaburzeniami czynności nerek (Lippincott)"], "y": false}, {"t": "cell", "name": "Leki p/padaczkowe jako normotymiczne", "col": "RECEPTOR", "sub": "(na co działa)", "a": "patrz rozdz. 19 Lippincott", "y": false}, {"t": "cell", "name": "Leki p/padaczkowe jako normotymiczne", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["kilka leków p/padaczkowych jest zatwierdzonych jako **stabilizatory nastroju** w ChAD (Lippincott)", "**diwalproeks** – prolek, który po spożyciu staje się kwasem walproinowym i walproinianem"], "y": false}, {"t": "cell", "name": "Leki p/padaczkowe jako normotymiczne", "col": "NA CO", "sub": "(wskazania)", "a": ["**karbamazepina, diwalproeks (kwas walproinowy, walproinian) i lamotrygina** – zatwierdzone jako stabilizatory nastroju w ChAD (Lippincott)", "konspekt: karbamazepina, kwas walproinowy, lamotrygina", "wykład: karbamazepina, kwas walproinowy, lamotrygina, gabapentyna, topiramat", "**leki stabilizujące nastrój, takie jak lit, walproinian sodu, karbamazepina i lamotrygina, są lekami z wyboru w leczeniu ChAD** (Lippincott, podsumowanie rozdziału)"], "y": false}, {"t": "cell", "name": "Ogólne postępowanie w zespołach maniakalnych (wykład, slajd 70)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["dotyczy zespołu hipomaniakalnego lub maniakalnego o umiarkowanym nasileniu"], "y": true}, {"t": "cell", "name": "Ogólne postępowanie w zespołach maniakalnych (wykład, slajd 70)", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie początkowe – monoterapia:** LIT, KARBAMAZEPINA, WALPROINIAN, OLANZAPINA, KWETIAPINA, ARIPIPRAZOL, RISPERIDON", "**brak poprawy po 4–8 tyg. – leczenie skojarzone:** lek normotymiczny (LIT/WALPROINIAN) + atypowy lek p/psychotyczny (OLANZAPINA, KWETIAPINA, RISPERIDON, ARIPIPRAZOL)", "**postępowanie długoterminowe:** leczenie profilaktyczne za pomocą 1 lub 2 leków normotymicznych", "leczenie epizodu maniakalnego **8–12 tyg.** → potem należy kontynuować farmakologiczną profilaktykę", "Lippincott: **kwetiapina, lurazydon, kariprazyna oraz terapia skojarzona olanzapiną i fluoksetyną** zostały zatwierdzone do stosowania w leczeniu **depresji dwubiegunowej**"], "y": true}]}, {"title": "PODAJ LEK — CECHA CHARAKTERYSTYCZNA", "level": "section", "parent": null, "quiz": true, "cards": [{"t": "rev", "q": "Który lek p/depresyjny jest jedynym dostępnym w systemie transdermalnym (w plastrze)?", "a": "Selegilina", "src": "INHIBITORY MONOAMINOOKSYDAZY (IMAO) · MECHANIZM"}, {"t": "rev", "q": "Który SSRI jest jedynym zatwierdzonym w leczeniu bulimii?", "a": "Fluoksetyna", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY SEROTONINY (SSRI) · NA CO"}, {"t": "rev", "q": "Który TLPD ma wyraźne działanie „antyobsesyjne” i jest stosowany w zaburzeniach obsesyjno-kompulsyjnych?", "a": "Klomipramina", "src": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE) · MECHANIZM"}, {"t": "rev", "q": "Który TLPD ma działanie cholinolityczne opisane w konspekcie jako bardzo silne (!!!), przy silnej sedacji i silnej kardiotoksyczności?", "a": "Amitryptylina", "src": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który TLPD stosuje się w moczeniu nocnym u dzieci – jako alternatywę dla desmopresyny?", "a": "Imipramina", "src": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE) · NA CO"}, {"t": "rev", "q": "Który TLPD, ze względu na antagonizm D₂, może powodować objawy parkinsonowskie i akatyzję?", "a": "Amoksapina #", "src": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek p/depresyjny hamuje wychwyt NA i dopaminy (bez wpływu na 5-HT), jest stosowany w uzależnieniu od nikotyny i jest bezwzględnie przeciwwskazany w padaczce?", "a": "Bupropion", "src": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I DOPAMINY · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Przy którym leku p/depresyjnym występuje priapizm jako charakterystyczne działanie niepożądane?", "a": "Trazodon", "src": "LEKI HAMUJĄCE WYCHWYT SEROTONINY I BLOKUJĄCE RECEPTORY SEROTONINERGICZNE (5-HT2) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który SSRI częściej niż pozostałe powoduje zależne od dawki wydłużenie odstępu QT?", "a": "Citalopram", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY SEROTONINY (SSRI) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek p/depresyjny jest najbardziej selektywny dla noradrenaliny (NA/5-HT = 0,007)?", "a": "Reboksetyna", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NORADRENALINY (NRI) · MECHANIZM"}, {"t": "rev", "q": "Który lek p/depresyjny jest agonistą receptorów melatoninowych MT1 i MT2 (i antagonistą 5-HT2C)?", "a": "Agomelatyna", "src": "LEKI O DZIAŁANIU RECEPTOROWYM · RECEPTOR"}, {"t": "rev", "q": "Który lek p/depresyjny zwiększa wychwyt zwrotny serotoniny – czyli działa odwrotnie niż SSRI?", "a": "Tianeptyna", "src": "LEKI O ATYPOWYM MECHANIZMIE DZIAŁANIA · RECEPTOR"}, {"t": "rev", "q": "Który lek p/depresyjny jest antagonistą receptora NMDA podawanym donosowo w depresji lekoopornej?", "a": "Esketamina", "src": "LEKI O ATYPOWYM MECHANIZMIE DZIAŁANIA · MECHANIZM"}, {"t": "rev", "q": "Który lek stosowany w depresji poporodowej podaje się dożylnie przez 60 godzin w warunkach szpitalnych?", "a": "Breksanolon", "src": "LEKI O ATYPOWYM MECHANIZMIE DZIAŁANIA · MECHANIZM"}, {"t": "rev", "q": "Który lek stosowany w chorobie afektywnej dwubiegunowej ma bardzo mały indeks terapeutyczny, przez co jego stężenie w surowicy trzeba monitorować w trakcie leczenia?", "a": "Sole litu (węglan litu)", "src": "LEKI NORMOTYMICZNE – LECZENIE MANII I ChAD · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek p/depresyjny jest pełnym agonistą 5-HT1A (i antagonistą 5-HT3 oraz 5-HT7), o działaniu prokognitywnym?", "a": "Wortioksetyna", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT SEROTONINY I MODULUJĄCE RECEPTORY SEROTONINERGICZNE · RECEPTOR"}, {"t": "rev", "q": "Przy których lekach p/depresyjnych występuje pełny efekt tyraminowy, czyli bezwzględna konieczność ograniczeń dietetycznych?", "a": "Fenelzyna, Tranylcypromina #", "src": "INHIBITORY MONOAMINOOKSYDAZY (IMAO) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który IMAO nie wymaga ograniczeń dietetycznych (serów, czerwonego wina), bo odwracalnie i wybiórczo hamuje MAO-A?", "a": "Moklobemid", "src": "INHIBITORY MONOAMINOOKSYDAZY (IMAO) · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek p/depresyjny ma wskazanie w wysiłkowym nietrzymaniu moczu – obok bólu neuropatycznego i fibromialgii?", "a": "Duloksetyna", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT (SNRI) – BEZ DZIAŁANIA RECEPTOROWEGO · NA CO"}, {"t": "rev", "q": "Który SSRI jest silnym inhibitorem CYP1A2 i działa raczej uspokajająco (może pomóc przy trudnościach w zasypianiu)?", "a": "Fluwoksamina", "src": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY SEROTONINY (SSRI) · DZIAŁANIA NIEPOŻĄDANE"}]}]}, {"label": "Leki w chorobach neurodegeneracyjnych", "title": "LEKI W CHOROBACH NEURODEGENERACYJNYCH I NEUROLOGICZNYCH", "source": "Źródła: Lippincott Whalen Farmakologia 2024 (rozdz. 15 „Leki stosowane w leczeniu chorób neurodegeneracyjnych”, s. 229–245) + wykład „Leki w chorobach neurodegeneracyjnych” i konspekt „Leki w chorobach neurodegeneracyjnych i neurologicznych 26/27” (prof. J. Sapa).", "groups": [{"title": "PATOFIZJOLOGIA I PUNKTY UCHWYTU – ŚCIĄGA", "level": "section", "parent": null, "cards": [{"t": "cell", "name": "Choroby neurodegeneracyjne – ogólnie", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["do chorób neurodegeneracyjnych OUN zaliczają się **PD, AD, SM i ALS**; te wyniszczające jednostki cechują się postępującą utratą wybranych neuronów w odrębnych obszarach mózgu, prowadzącą do charakterystycznych zaburzeń w zakresie ruchu, funkcji poznawczych, lub obu powyższych (Lippincott)", "**obecnie nie posiadają skutecznego leczenia przyczynowego** – farmakoterapia ukierunkowana jest na spowolnienie postępu choroby i kontrolę objawów, aby uzyskać optymalną jakość życia (Lippincott)", "wykład obejmuje: choroba Parkinsona (PD) i Huntingtona (HD) · choroba Alzheimera (AD) · stwardnienie zanikowe boczne (ALS) · rdzeniowy zanik mięśni (SMA) · stwardnienie rozsiane (SM)"], "y": true}, {"t": "cell", "name": "Choroba Parkinsona – patofizjologia", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**szlak nigrostriatalny** (istota czarna → prążkowie)", "rodziny receptorów **D1** i **D2**"], "y": true}, {"t": "cell", "name": "Choroba Parkinsona – patofizjologia", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**przyczyny (wykład):** zwyrodnienie neuronów dopaminergicznych układu nigrostriatalnego (**deficyt DA**) → prowadzące do przewagi czynnościowej układu cholinergicznego i glutamatergicznego; zmiany zwyrodnieniowe w neuronach NA i 5-HT oraz ↓ stężenia GABA i enkefalin", "**Lippincott:** przyczyna PD u większości pacjentów pozostaje nieznana; wystąpienie choroby powiązane jest z destrukcją neuronów dopaminergicznych istoty czarnej śródmózgowia, z wtórną redukcją aktywności dopaminergicznej w prążkowiu", "**neostriatum:** w PD uszkodzenie komórek istoty czarnej skutkuje degeneracją zakończeń nerwowych wydzielających dopaminę w prążkowiu → prawidłowa aktywność hamująca dopaminy na neurony cholinergiczne jest istotnie zmniejszona, co prowadzi do nadprodukcji lub względnej nadaktywności acetylocholiny w neuronach pobudzających (Lippincott)", "**strategia leczenia:** leczenie skupia się na odtworzeniu dopaminy w jądrach podstawy i ograniczaniu pobudzającego działania cholinergicznych neuronów, co ma przywracać właściwą równowagę pomiędzy wpływem dopaminy i acetylocholiny (Lippincott)"], "y": true}, {"t": "cell", "name": "Choroba Parkinsona – patofizjologia", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**parkinsonizm wtórny (polekowy):** niektóre leki, takie jak pochodne fenotiazyny czy haloperydol, których podstawowym mechanizmem działania jest blokowanie receptorów dopaminowych w mózgu, mogą wywoływać objawy parkinsonowskie (znane również jako pseudoparkinsonizm) (Lippincott)", "leki p/parkinsonowskie powinny być używane ze szczególną ostrożnością u pacjentów z PD, a w niektórych przypadkach są wręcz p/wskazane (Lippincott)"], "y": true}, {"t": "cell", "name": "Etiopatogeneza PD (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**nie jest znana dokładnie przyczyna zaniku komórek istoty czarnej!!!**", "**teorie:** przedwczesne starzenie się · rola czynników genetycznych · **neurotoksyny** – MPTP (1-metylo-4-fenylo-1,2,5,6-tetrahydropirydyna → nieodwracalne uszkodzenie neuronów DA ukł. nigrostriatalnego), **rotenon** (herbicyd) → hamuje mitochondrialny łańcuch oddechowy i wywołuje ch. Parkinsona · ekscytotoksyczność i stres oksydacyjny · mutacje w genie α-synukleiny"], "y": true}, {"t": "cell", "name": "Objawy choroby Parkinsona (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["choroba układu pozapiramidowego określana jako **zespół hipertoniczno-akinetyczny**", "**sztywność mięśniowa** · **zubożenie ruchowe, bradykinezja** – spowolnienie ruchowe, **akinezja** – bezruch · **drżenia (tremor)** – spoczynkowe", "objawy wtórne: niestabilność postawy, zaburzenia chodu, spowolnienie przełykania, maskowata twarz, objawy obwodowe", "Lippincott: charakterystyczne są drżenia mięśniowe, sztywność mięśniowa, bradykinezja oraz zaburzenia chodu i postawy człowieka; **większość przypadków dotyczy pacjentów powyżej 65 roku życia**"], "y": true}, {"t": "cell", "name": "Ekscytotoksyczność (wykład)", "col": "RECEPTOR", "sub": "(na co działa)", "a": "receptory **NMDA**", "y": true}, {"t": "cell", "name": "Ekscytotoksyczność (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["aminokwasy pobudzające, zwłaszcza **glutaminian**, mogą powodować śmierć neuronów", "ekscytotoksyczność związana jest głównie z pobudzeniem receptorów NMDA, co powoduje wzrost jonów Ca²⁺ wewnątrz komórki", "→ **śmierć komórki** w wyniku działania różnych mechanizmów: pobudzenie aktywności proteaz, zwiększenie produkcji wolnych rodników, wzrostu peroksydacji lipidów i metabolizmu kwasu arachidonowego"], "y": true}, {"t": "cell", "name": "Ekscytotoksyczność (wykład)", "col": "NA CO", "sub": "(wskazania)", "a": "punkt uchwytu dla **memantyny** (AD) i **amantadyny** (PD)", "y": true}, {"t": "cell", "name": "Receptory dopaminergiczne (wykład)", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**rodzina D1:** D1, D5", "**rodzina D2:** D2, D3, D4"], "y": true}, {"t": "cell", "name": "Receptory dopaminergiczne (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**rodzina D1** → ↑ cAMP, ↑ hydrolizy PIP₂ (uwolnienie Ca²⁺ i aktywacja PKC); **D1** – prążkowie, kora nowa · **D5** – hipokamp, podwzgórze", "**rodzina D2** → ↓ cAMP, ↑ prądu K⁺, ↓ prądu Ca²⁺; **D2** – prążkowie, istota czarna, część zbita, przysadka · **D3** – guzek węchowy, jądro półleżące, podwzgórze · **D4** – kora czołowa, rdzeń, śródmózgowie"], "y": true}, {"t": "cell", "name": "Receptory dopaminergiczne (wykład)", "col": "NA CO", "sub": "(wskazania)", "a": ["agoniści D1: apomorfina · **D2:** apomorfina, bromokryptyna, lizuryd, pergolid, kabergolina, pirybedyl, pramipeksol, ropinirol, rotygotyna · **D3:** pramipeksol, ropinirol, rotygotyna, pirybedyl"], "y": true}, {"t": "cell", "name": "Choroba Alzheimera – patogeneza", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["otępienie w AD charakteryzuje się trzema wyróżniającymi się cechami: **(1) gromadzeniem się złogów beta-amyloidu w mózgu, (2) tworzeniem się licznych skupisk neurofibryli (złogów białka Tau) i (3) spadkiem liczby neuronów kory mózgu, a zwłaszcza tych cholinergicznych** (Lippincott)", "**wykład:** zanik neuronów cholinergicznych (zab. uwagi, pamięci), glutamatergicznych (zab. pamięci, percepcji, apatia) w obrębie hipokampa, kory mózgowej i struktur podkorowych; w obrazie mikroskopowym pozakomórkowe **blaszki starcze** i wewnątrzkomórkowe **splątki neurofibrylarne** (przyczyny śmierci neuronów); uszkodzenie neuronów serotoninergicznych (urojenia, agresja, drażliwość), adrenergicznych (agresja) i gabaergicznych; obecność cech procesu zapalnego w mózgu", "**bezpośrednią przyczyną zaburzeń poznawczych (otępienia) jest uszkodzenie neuronów cholinergicznych** (wykład)", "obecnie stosowane metody terapeutyczne mają na celu poprawę transmisji cholinergicznej w OUN, zapobieganie ekscytotoksycznym działaniom powodowanym przez nadmierną stymulację receptorów NMDA lub zmniejszenie akumulacji złogów beta-amyloidu (Lippincott)", "**interwencje farmakologiczne w AD mają charakter paliatywny** i zapewniają umiarkowane, krótkotrwałe korzyści poprzez zmniejszenie nasilenia lub stabilizację objawów (Lippincott)"], "y": true}, {"t": "cell", "name": "Objawy AD wg okresów (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**okres wczesny:** początek choroby trudny do uchwycenia; nieznaczne pogorszenie pamięci, niemożność przyswojenia i zapamiętania nowych informacji; mniejsza efektywność w pracy; niemożność koncentracji; problemy językowe (szukanie słów); labilność nastroju, zmiana osobowości; trudności w wykonywaniu rutynowych czynności; afazja, trudności w orientacji wzrokowo-przestrzennej", "**okres pośredni:** poważne luki w pamięci; utrata zdolności zapamiętywania i odtwarzania nowych informacji; zaburzona orientacja w czasie i przestrzeni; bezcelowe wędrowanie; nieprzyjazne zachowania, niekooperatywność, fizyczna agresja", "**stadium ciężkie:** utrata zdolności chodzenia i wykonywania czynności codziennych; utrata kontroli zwieraczy; całkowity zanik pamięci świeżej i długotrwałej; utrata zdolności połykania, jedzenia; nawracające zapalenia płuc i odleżyny; utrata mowy; spadek liczby neuronów o 80%; **śmierć po 5 latach od wystąpienia pierwszych objawów**"], "y": true}]}, {"title": "LEKI W CHOROBIE PARKINSONA", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI W CHOROBIE PARKINSONA", "blocks": [{"h": "leki pobudzające przekaźnictwo dopaminergiczne – prekursory dopaminy", "items": ["Lewodopa + Benserazyd/Karbidopa"]}, {"h": "inhibitory COMT", "items": ["Entakapon, Tolkapon, Opikapon"]}, {"h": "inhibitory MAO-B", "items": ["Selegilina, Rasagilina", "Safinamid"]}, {"h": "agoniści receptorów dopaminergicznych", "items": ["Bromokryptyna", "Lizuryd", "Pergolid", "Apomorfina", "Pirybedyl", "Pramipeksol", "Ropinirol", "Rotygotyna", "Kabergolina"]}, {"h": "leki o innym mechanizmie – amantadyna", "items": ["Amantadyna"]}, {"h": "leki cholinolityczne", "items": ["Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna"]}, {"h": "antagoniści receptora adenozynowego", "items": ["Istradefilina, Preladenant"]}], "n": 16}, {"t": "cell", "name": "Cechy wspólne – strategia farmakoterapii", "col": "RECEPTOR", "sub": "(na co działa)", "a": "układ dopaminergiczny (D1, D2) i cholinergiczny (M) w prążkowiu", "y": true}, {"t": "cell", "name": "Cechy wspólne – strategia farmakoterapii", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**nasilanie przekaźnictwa dopaminergicznego → leki dopaminergiczne** (wykład): prekursory dopaminy · leki zwiększające uwalnianie endogennej dopaminy · agoniści receptorów dopaminowych · inhibitory rozkładu dopaminy (inhibitory MAO, inhibitory COMT)", "**hamowanie przekaźnictwa cholinergicznego → leki cholinolityczne** (wykład)", "wiele obecnie stosowanych leków ma na celu utrzymanie w OUN stężenia dopaminy, lub sygnalizacji z jej pomocą, na jak najbardziej stałym poziomie (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne – strategia farmakoterapii", "col": "NA CO", "sub": "(wskazania)", "a": "choroba Parkinsona", "y": true}, {"t": "cell", "name": "Cechy wspólne – strategia farmakoterapii", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**substancje te zapewniają jedynie tymczasowe zniesienie objawów PD i nie ograniczają, ani nie odwracają degeneracji neuronalnej wywołanej przez chorobę** (Lippincott)", "wraz z postępem choroby leczenie PD może prowadzić do **polifarmakoterapii** przy użyciu substancji o odmiennych mechanizmach działania (Lippincott)"], "y": true}]}, {"title": "leki pobudzające przekaźnictwo dopaminergiczne – prekursory dopaminy", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "leki pobudzające przekaźnictwo dopaminergiczne – prekursory dopaminy", "blocks": [{"h": null, "items": ["Lewodopa + Benserazyd/Karbidopa"]}], "n": 1}, {"t": "cell", "name": "Lewodopa + Benserazyd/Karbidopa", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**lewodopa** – prekursor dopaminy", "**benserazyd / karbidopa** – inhibitory obwodowej dekarboksylazy DOPA (DAA)"], "y": false}, {"t": "cell", "name": "Lewodopa + Benserazyd/Karbidopa", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["prekursor dopaminy + inhibitor obwodowej dekarboksylazy DOPA (**hamowanie rozkładu dopaminy poza OUN**) ⇒ wzrost stężenia dopaminy w OUN ⇒ przywrócenie prawidłowego przekaźnictwa dopaminergicznego ⇒ zmniejszenie sztywności i wzmożonego napięcia mięśniowego, bradykinezji, drżeń (konspekt)", "dopamina nie przekracza bariery krew–mózg, ale jej bezpośredni prekursor, jakim jest lewodopa, jest aktywnie transportowany do OUN i przekształcany do dopaminy; **lewodopa musi być podawana razem z karbidopą** – bez niej znaczna część lewodopy ulega dekarboksylacji do dopaminy w tkankach obwodowych, prowadząc do mniejszej skuteczności terapeutycznej, nudności, wymiotów, zaburzeń rytmu serca i niedociśnienia (Lippincott)", "**dodatek karbidopy zmniejsza wymaganą dawkę lewodopy około cztero-, pięciokrotnie** (Lippincott)", "**wykład:** stosowana od lat 60-tych, uznawana za „złoty standard” leczenia; **proporcje – lewodopa + benserazyd (1:4) = MADOPAR, MADOPAR HBS; lewodopa + karbidopa (1:10) = SINEMET CR**", "**PK:** intensywnie wchłaniana w jelicie cienkim (szczególnie na czczo); bardzo krótki czas półtrwania (1–2 godziny), co prowadzi do wahań stężenia w osoczu; **przyjmowanie z posiłkami, zwłaszcza bogatymi w białko, zaburza jej wchłanianie** → zalecane przyjmowanie na czczo, zwykle około 30 minut przed posiłkiem (Lippincott)", "preparaty standardowe powodują pulsacyjną stymulację receptorów; **preparaty o przedłużonym działaniu** – stała, toniczna stymulacja receptorów → rzadziej dyskinezy i fluktuacje (wykład)"], "y": false}, {"t": "cell", "name": "Lewodopa + Benserazyd/Karbidopa", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona** – skuteczna w opanowywaniu objawów bradykinetycznych, może również zmniejszać sztywność i drżenia mięśniowe; **często uważana za pierwszy wybór leczenia** (Lippincott)", "zespół niespokojnych nóg (konspekt)", "rozpoczęcie leczenia L-DOPĄ w momencie rozpoznania choroby → największe możliwości poprawy w początkowym okresie choroby; początek leczenia → małe dawki (wykład)", "**u około dwóch trzecich pacjentów lewodopa z karbidopą znacząco zmniejsza nasilenie objawów w pierwszych latach leczenia; pogorszenie skuteczności terapeutycznej pojawia się typowo między trzecim a piątym rokiem leczenia. Odstawianie leku powinno następować stopniowo** (Lippincott)"], "y": false}, {"t": "cell", "name": "Lewodopa + Benserazyd/Karbidopa", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** skuteczność lewodopy spada z czasem stosowania → spadek skuteczności i pojawienie się fluktuacji ruchowych (objawy końca dawki, zespół przełączeń (on-off), napady akinezji), pobudzenie, lęki, omamy, urojenia, zaburzenia snu, bóle głowy, zaburzenia rytmu serca, ortostatyczne spadki ciśnienia, brak łaknienia, jadłowstręt, nudności, wymioty", "**INT:** witamina B₆ (pirydoksyna) → zwiększa obwodowy rozkład lewodopy → spadek skuteczności terapii (konspekt, Lippincott ryc. 15.7)", "**INT (Lippincott):** równoległe przyjmowanie lewodopy i nieselektywnych inhibitorów monoaminooksydazy, takich jak fenelzyna#, może prowadzić do wystąpienia **kryzy nadciśnieniowej** wywołanej przez nadprodukcję katecholamin → łączenie leków jest przeciwwskazane", "**INT (wykład):** pirydoksyna (wit. B6), inhibitory MAO, leki sympatykomimetyczne, leki hipotensyjne, parasympatykomimetyki, neuroleptyki", "**leki przeciwpsychotyczne są przeważnie przeciwwskazane w PD** ze względu na silne blokowanie receptorów dopaminowych i możliwość wzmocnienia objawów parkinsonowskich; jednakże małe dawki atypowych neuroleptyków, takich jak **kwetiapina czy klozapina**, bywają stosowane w leczeniu psychozy indukowanej lewodopą; **pimawanseryna#** jest odwrotnym agonistą i antagonistą receptorów serotoninowych 5-HT2A, dopuszczonym do leczenia zaburzeń psychotycznych w PD (Lippincott)"], "y": false}, {"t": "cell", "name": "Lewodopa – działania niepożądane wg podziału (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**obwodowe:** pobudzenie czynności serca – zaburzenie rytmu serca; ortostatyczne spadki ciśnienia; zwiększenie przesączania kłębuszkowego; pocenie się; zaburzenia ze strony przewodu pokarmowego", "**ośrodkowe:** wzrost aktywności ruchowej; bezsenność, podniecenie; dyskinezy i ruchy przymusowe o charakterze pląsawiczym, dotyczące głowy i kończyn; zaburzenia nastroju i reakcje euforyczne, zaostrzenie psychoz; nudności, wymioty; brak łaknienia; zaburzenia hormonalne (wzrost GH, spadek PRL)", "**Lippincott – obwodowe:** brak apetytu, nudności i wymioty (pobudzenie chemoreceptorów strefy wrażliwej), hipotonia ortostatyczna (zwłaszcza na początku leczenia), tachykardia, rozszerzenie źrenicy (mydriasis), zaburzenia obrazu krwi i dodatni odczyn w teście Coombsa, **ciemna barwa śliny i moczu** (produkcja melaniny w procesie oksydacji katecholamin)", "**Lippincott – ośrodkowe:** halucynacje wzrokowe i słuchowe, ruchy mimowolne (dyskinezy) odzwierciedlające nadaktywność dopaminową w zwojach podstawy, senność, zawroty głowy, wahania i obniżenie nastroju, objawy psychotyczne, lęk, utrata kontroli nad zachowaniami impulsywnymi"], "y": true}, {"t": "cell", "name": "Dyskinezy i fluktuacje (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["uzyskana w wyniku podawania lewodopy poprawa (**80% pacjentów**) może utrzymywać się przez wiele lat ⇒ **„miodowy miesiąc”** ⇒ po kilku latach dochodzi do pojawienia się objawów niepożądanych ⇒ **dyskinezy i fluktuacje**", "**dyskinezy pląsawicze** – spowodowane zmienioną wrażliwością receptora dopaminergicznego oraz zaburzoną równowagą między receptorami D₁ i D₂", "**dyskinezy dystoniczne** – pojawiają się najczęściej pod koniec działania dawki lewodopy, mają charakter przetrwałych, niekiedy bolesnych skurczów mięśni", "**dyskinezy miokloniczne** – mają charakter pojedynczych skurczy mięśni (np. drżenia głowy)", "**fluktuacje ruchowe** polegają na wahaniach stanu ruchowego pacjenta – „wyłączenia” („off”) poprzez stan prawie normalnego funkcjonowania „włączenie” („on”), aż do dyskinez", "**fluktuacje mogą być następstwem:** zaburzeń wchłaniania lewodopy z przewodu pokarmowego · zaburzeń przechodzenia przez barierę krew–mózg · zniesienia możliwości gromadzenia i przechowywania lewodopy i dopaminy w zakończeniach presynaptycznych"], "y": true}]}, {"title": "inhibitory COMT", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "inhibitory COMT", "blocks": [{"h": null, "items": ["Entakapon, Tolkapon, Opikapon"]}], "n": 1}, {"t": "cell", "name": "Entakapon, Tolkapon, Opikapon", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalne inhibitory COMT** (katecholo-O-metylotransferazy)", "y": false}, {"t": "cell", "name": "Entakapon, Tolkapon, Opikapon", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamują metabolizm lewodopy i dopaminy ⇒ zwiększenie przekaźnictwa dopaminergicznego ⇒ z lewodopą w chorobie Parkinsona (konspekt)", "zazwyczaj metylacja lewodopy przez COMT do **3-O-metyldopy** to szlak metabolizmu lewodopy o minimalnym znaczeniu; gdy jednak aktywność obwodowej dekarboksylazy dopaminy jest zahamowana, stężenie 3-O-metyldopy istotnie wzrasta, co powoduje **konkurowanie** ww. cząsteczki z lewodopą o aktywny transport do OUN → inhibitory COMT prowadzą do zmniejszenia stężenia 3-O-metyldopy w osoczu, zwiększonego wychwytu ośrodkowego lewodopy i w konsekwencji wyższych stężeń dopaminy w mózgu (Lippincott)", "**powyższe leki zmniejszają objawy zjawiska „wyczerpywania się” działania farmakoterapii**, obserwowanego u pacjentów przyjmujących połączenie lewodopa + karbidopa (Lippincott)", "**wykład:** COMT rozkłada L-DOPĘ i DA, także na obwodzie silne selektywne i odwracalne inhibitory COMT, nie wpływające znacząco na metabolizm NA i A; **tolkapon** – odwracalny, selektywny inhibitor COMT o działaniu obwodowym i ośrodkowym; **entakapon** – odwracalny inhibitor COMT o działaniu obwodowym, nie przechodzi przez barierę krew–mózg; w połączeniu z karbidopą i lewodopą w preparacie Stalevo", "**PK (Lippincott):** wchłanianie po podaniu doustnym entakaponu i tolkaponu# zachodzi łatwo i nie podlega zmianom pod wpływem przyjęcia posiłku; **opikapon natomiast powinien być przyjmowany na pusty żołądek** – pacjenci powinni wstrzymać się od przyjmowania posiłków przez godzinę zarówno przed podaniem leku, jak i po jego podaniu; tolkapon# ma relatywnie długi czas działania, jednak oba leki należy przyjmować kilka razy w ciągu doby; **opikapon podawany jest raz dziennie, przed snem**"], "y": false}, {"t": "cell", "name": "Entakapon, Tolkapon, Opikapon", "col": "NA CO", "sub": "(wskazania)", "a": ["choroba Parkinsona – **z lewodopą** (konspekt)", "lepsza kontrola objawów, redukcja częstości i czasu trwania epizodów zjawiska „off”"], "y": false}, {"t": "cell", "name": "Entakapon, Tolkapon, Opikapon", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** zaburzenia ze strony przewodu pokarmowego (nudności, wymioty, zaparcia, biegunka), nasilenie ośrodkowych działań niepożądanych lewodopy (dyskinezy, dystonia, hiperkineza), **hepatotoksyczność (tolkapon)**", "**Lippincott:** inhibitory COMT wywołują efekty uboczne podobne do tych obserwowanych u pacjentów przyjmujących połączenie lewodopa + karbidopa, w tym: biegunkę, hipotonię ortostatyczną, nudności, brak łaknienia, dyskinezy, halucynacje i zaburzenia snu", "**najpoważniejszym działaniem niepożądanym, związanym ze stosowaniem tolkaponu#, może być piorunująca martwica wątroby** → oprócz właściwego monitorowania funkcji wątroby, stosowanie ww. leku powinno być ograniczone do pacjentów, u których zawiodły inne formy leczenia; **entakapon i opikapon nie wykazują tego rodzaju toksyczności** i w znaczący sposób wyparły tolkapon# z użycia w praktyce klinicznej (Lippincott)", "wykład: **tolkapon wycofany ze względu na działanie hepatotoksyczne i nagłe zgony sercowe!!**", "dawkowanie może wymagać modyfikacji u pacjentów z umiarkowanym lub ciężkim uszkodzeniem wątroby (Lippincott)"], "y": false}]}, {"title": "inhibitory MAO-B", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "inhibitory MAO-B", "blocks": [{"h": null, "items": ["Selegilina, Rasagilina", "Safinamid"]}], "n": 2}, {"t": "cell", "name": "Selegilina, Rasagilina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**nieodwracalne inhibitory monoaminooksydazy typu B**", "y": false}, {"t": "cell", "name": "Selegilina, Rasagilina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamują MAO-B i blokują metabolizm dopaminy ⇒ zwiększenie przekaźnictwa dopaminergicznego (konspekt)", "**selegilina**, znana też pod nazwą **deprenyl**, selektywnie hamuje aktywność MAO typu B, enzymu metabolizującego dopaminę; nie wpływa natomiast na MAO typu A (metabolizującą noradrenalinę i serotoninę) **w dawkach nieprzekraczających tych zalecanych – wówczas traci swoją wybiórczość** (Lippincott)", "gdy selegilina podawana jest z lewodopą, nasila jej działanie i w ten sposób znacząco obniża wymaganą do skutecznego działania dawkę; **w przeciwieństwie do nieselektywnych inhibitorów MAO, selegilina w zalecanych dawkach ma niski potencjał wywołania przełomu nadciśnieniowego** – w większych dawkach lek traci jednak swoją selektywność i wówczas ryzyko wystąpienia tego działania niepożądanego wzrasta (Lippincott)", "**selegilina ulega biotransformacji do metamfetaminy i amfetaminy**, których właściwości psychostymulujące mogą spowodować bezsenność, jeśli lek przyjmowany jest później niż w porze popołudniowej (Lippincott)", "**rasagilina**, nieodwracalny i selektywny inhibitor mózgowej MAO typu B, **działa pięciokrotnie silniej od selegiliny**; w przeciwieństwie do niej, rasagilina nie ulega biotransformacji do pochodnych amfetaminy (Lippincott)", "**wykład – selegilina:** wybiórczy i nieodwracalny inhibitor MAO-B; stosowana w monoterapii i w połączeniu z lewodopą; nasila działanie L-DOPY, pozwala na redukcję dawki; stabilizuje poziom DA w prążkowiu, zmniejsza fluktuacje; **sugerowane działanie neuroprotekcyjne**"], "y": false}, {"t": "cell", "name": "Selegilina, Rasagilina", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona, w monoterapii w początkowym okresie choroby, w zaawansowanym stadium w połączeniu z lewodopą** (konspekt)", "terapia adjuwantowa (Lippincott)"], "y": false}, {"t": "cell", "name": "Selegilina, Rasagilina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** dyskinezy, bezsenność, omamy, halucynacje, zmiany nastroju, **działanie arytmogenne**, hipotensja, zaburzenia ze strony przewodu pokarmowego (nudności, wymioty)", "**wykład (selegilina):** suchość w jamie ustnej, nudności, wymioty, spadek ciśnienia tętniczego, rzadziej zaburzenia rytmu serca, zawroty głowy, niepokój, pobudzenie, przejściowe zaburzenia snu, zaburzenia orientacji, halucynacje, nasilenie dyskinez; **rasagilina – mniej działań niepożądanych**", "działania uboczne to m.in. nudności, bóle głowy, uczucie dezorientacji (Lippincott)", "**INT:** w związku z możliwością rozwoju **zespołu serotoninowego** powinno się unikać równoległego stosowania leków serotoninergicznych, takich jak selektywne inhibitory wychwytu zwrotnego serotoniny (Lippincott)"], "y": false}, {"t": "cell", "name": "Safinamid", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**odwracalny inhibitor MAO-B**", "hamuje również wychwyt zwrotny dopaminy", "wpływa na napięciowo-zależne kanały sodowe i wapniowe"], "y": false}, {"t": "cell", "name": "Safinamid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["inhibitor monoaminooksydazy typu B odwracalny, hamuje również wychwyt zwrotny dopaminy, również hamuje napięciowo-zależne kanały sodowe i wpływa na uwalnianie glutaminianu ⇒ **wzrost stężenia dopaminy w prążkowiu** (konspekt)", "safinamid również jest selektywnym inhibitorem MAO typu B, zalecanym do stosowania **jako uzupełnienie leczenia połączeniem lewodopa + karbidopa** (Lippincott)"], "y": false}, {"t": "cell", "name": "Safinamid", "col": "NA CO", "sub": "(wskazania)", "a": "**choroba Parkinsona, w monoterapii w początkowym okresie choroby, w zaawansowanym stadium w połączeniu z lewodopą** (konspekt)", "y": false}, {"t": "cell", "name": "Safinamid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN wynikające z pobudzenia przekaźnictwa dopaminergicznego** ⇒ dyskinezy, bezsenność, omamy, halucynacje, zmiany nastroju, działanie arytmogenne, hipotensja, zaburzenia ze strony przewodu pokarmowego (nudności, wymioty) (konspekt)"], "y": false}]}, {"title": "agoniści receptorów dopaminergicznych", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "agoniści receptorów dopaminergicznych", "blocks": [{"h": null, "items": ["Bromokryptyna", "Lizuryd", "Pergolid", "Apomorfina", "Pirybedyl", "Pramipeksol", "Ropinirol", "Rotygotyna", "Kabergolina"]}], "n": 9}, {"t": "cell", "name": "Cechy wspólne agonistów rec. dopaminergicznych", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO receptorów dopaminowych (głównie **D2**, część także D1, D3, D4)", "y": true}, {"t": "cell", "name": "Cechy wspólne agonistów rec. dopaminergicznych", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**bezpośrednia stymulacja rec. D, bez konieczności konwersji leku, działają z ominięciem odcinka presynaptycznego** (wykład)", "**słabsze działanie p/parkinsonowskie od L-DOPY**, ale mniejsze ryzyko dyskinez i fluktuacji, mogą nawet łagodzić dyskinezy po L-DOP-ie, można zmniejszyć jej dawkę (wykład)", "stosowane u chorych z dużym ryzykiem dyskinez (chorzy z wczesnym początkiem choroby, z przewagą sztywności); **dość szybko przestają być skuteczne, zwłaszcza w monoterapii**; mogą aktywizować autoreceptory D₂ presynaptyczne, co prowadzi do osłabienia uwalniania DA (wykład)", "**substancje te cechują się dłuższym czasem działania w porównaniu z lewodopą i wykazują się skutecznością u pacjentów ze zmienną odpowiedzią na lewodopę**; początek terapii agonistami dopaminowymi wiąże się z niższym ryzykiem wywołania dyskinez i fluktuacji kontroli ruchów w porównaniu z pacjentami rozpoczynającymi kurację lewodopą (Lippincott)", "**w przeciwieństwie do pochodnych ergotaminy, bromokryptyny, niebędące pochodnymi ergotaminy substancje nie pogarszają przebiegu chorób naczyń obwodowych czy nie wywołują włóknienia** (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne agonistów rec. dopaminergicznych", "col": "NA CO", "sub": "(wskazania)", "a": ["choroba Parkinsona; pramipeksol, ropinirol i rotygotyna mają również wskazanie do stosowania w leczeniu **zespołu niespokojnych nóg** (Lippincott)", "agoniści receptorów dopaminowych mogą opóźniać potrzebę wprowadzenia lewodopy we wstępnych fazach PD i mogą zmniejszać jej skuteczne dawki w zaawansowanym stadium choroby (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne agonistów rec. dopaminergicznych", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN agonistów rec. dopaminergicznych – wynikające głównie z pobudzenia rec. D₂** (konspekt): **przewód pokarmowy** – nudności, wymioty, utrata łaknienia; **układ krążenia** – hipotensja ortostatyczna; **OUN** – senność, omamy, halucynacje", "nudności, halucynacje, zachowania kompulsywne, bezsenność, zawroty głowy, zaparcia i ortostatyczne spadki ciśnienia należą do działań ubocznych omawianych leków, ale **dyskinezy występują rzadziej niż w trakcie stosowania lewodopy** (Lippincott)", "**leki te mogą wpływać na wystąpienie impulsywnych zachowań, takich jak niekontrolowane zakupy, zwiększone libido czy napady objadania się** (Lippincott)"], "y": true}, {"t": "cell", "name": "Bromokryptyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["AGO rec. dopaminergicznych (**głównie typu D₂**), wpływa również na rec. **D₁, 5-HT1A, 5-HT2**", "pochodna ergotaminy"], "y": false}, {"t": "cell", "name": "Bromokryptyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego → **hamowanie wytwarzania i wydzielanie prolaktyny z przedniego płata przysadki**, zmniejszenie wydzielania hormonu wzrostu, zmniejszenie drżeń i akinezji, działanie p/depresyjne (konspekt)", "**wykład:** agonista receptorów D₁, D₂ w układzie nigrostriatalnym, mezolimbicznym i podwzgórzu; wykazuje działanie antyoksydacyjne i neutralizujące wolne rodniki → **neuroprotekcyjne**; stosowana w monoterapii lub w połączeniu z lewodopą", "efekty działania bromokryptyny, będącej pochodną ergotaminy, są podobne do lewodopy, przy czym częściej występują halucynacje, dezorientacja, majaczenie, nudności i ortostatyczne spadki ciśnienia, z kolei dyskinezy są zwykle mniej widoczne (Lippincott)"], "y": false}, {"t": "cell", "name": "Bromokryptyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona, gruczolaki przysadki mózgowej, akromegalia, bezpłodność u kobiet, nadmierna laktacja (hiperprolaktynemia)** (konspekt)", "stosowana w leczeniu zaburzeń hormonalnych przebiegających z nadmiernym wydzielaniem prolaktyny (wykład)"], "y": false}, {"t": "cell", "name": "Bromokryptyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["u pacjentów z zaburzeniami psychicznymi bromokryptyna może spowodować pogorszenie ich przebiegu; **powinna być stosowana ostrożnie u pacjentów z zawałem mięśnia sercowego w wywiadzie lub chorobą naczyń obwodowych przez ryzyko wywołania skurczu naczyń krwionośnych** (Lippincott)", "ze względu na to, że bromokryptyna jest pochodną ergotaminy, jej przyjmowanie niesie ze sobą **ryzyko wywołania zwłóknienia przestrzeni zaotrzewnowej i płuc** (Lippincott)", "**w trakcie stosowania leku mogą wystąpić epizody nagłej senności lub snu (w ciągu dnia), co może znacznie ograniczać zdolność prowadzenia pojazdów i obsługi urządzeń mechanicznych** (wykład)", "może wywoływać skurcz naczyń krwionośnych – **p/wskazana u pacjentów z chorobą naczyń obwodowych** (Lippincott, pyt. 15.2)"], "y": false}, {"t": "cell", "name": "Lizuryd", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["AGO rec. **D₂**, w mniejszym stopniu **D₁**; AGO rec. **5-HT1A**, ANT rec. **5-HT2**", "w większych dawkach działa **α-adrenolitycznie**"], "y": false}, {"t": "cell", "name": "Lizuryd", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego (konspekt)", "**wykład:** może działać stabilizująco na receptor D₂ zależnie od stanu czynnościowego synapsy i neuronów — w stanie prawidłowym wykazuje małą aktywność, która wybitnie zwiększa się w „pustych” neuronach i synapsach przy braku dopaminy (w odróżnieniu od bromokryptyny, wyzwala aktywność ruchową w stanach całkowitego braku dopaminy); **100 × silniej od bromokryptyny pobudza rec. D₂**"], "y": false}, {"t": "cell", "name": "Lizuryd", "col": "NA CO", "sub": "(wskazania)", "a": "choroba Parkinsona, nadmierna laktacja (hiperprolaktynemia)", "y": false}, {"t": "cell", "name": "Lizuryd", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa – nudności, wymioty, hipotensja ortostatyczna, senność, omamy, halucynacje", "y": false}, {"t": "cell", "name": "Pergolid", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. **D₂**, w mniejszym stopniu **D₁**", "y": false}, {"t": "cell", "name": "Pergolid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego (konspekt)", "**bardziej skuteczny niż bromokryptyna w monoterapii, ma działanie neuroprotekcyjne** (wykład)"], "y": false}, {"t": "cell", "name": "Pergolid", "col": "NA CO", "sub": "(wskazania)", "a": "choroba Parkinsona, nadmierna laktacja (hiperprolaktynemia)", "y": false}, {"t": "cell", "name": "Pergolid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa", "y": false}, {"t": "cell", "name": "Apomorfina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**silny AGO rec. D₄**, umiarkowany **D₂, D₃, D₅, α1D, α2A, α2C**, słaby **D₁**"], "y": false}, {"t": "cell", "name": "Apomorfina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego (konspekt)", "**wykład:** pobudza receptory dopaminergiczne pre- i postsynaptyczne; wykazuje działanie kliniczne podobne do lewodopy w zakresie sztywności i bradykinezji; **lepiej działa na drżenia**; jest lekiem z wyboru w zespole „on-off”, redukuje fazy wyłączenia i towarzyszące bóle, zaburzenia pęcherzowe, żołądkowo-jelitowe i dystoniczne; wygodne strzykawki umożliwiają samodzielne zaaplikowanie sobie leku przez pacjenta; **lek działa krótko, do 1 godziny → traktowana jako pomoc doraźna**", "apomorfina jest dostępna w formie iniekcji i do przyjmowania podjęzykowego (Lippincott)"], "y": false}, {"t": "cell", "name": "Apomorfina", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona – podawana podskórnie w leczeniu fluktuacji ruchowych (on-off)** (konspekt)", "stosowana jest do doraźnego leczenia występującego nagle hipomotorycznego zjawiska „off” w zaawansowanym stadium PD (Lippincott)", "w nagłych przypadkach, w bezruchu oraz w ciężkich dyskinezach początku i końca dawki (kiedy poziom lewodopy w organizmie jest za niski) (wykład)"], "y": false}, {"t": "cell", "name": "Apomorfina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN ⇒ silne działanie wymiotne (emetogenne)** (konspekt)", "**dużym ograniczeniem są silne nudności i wymioty po apomorfinie** (wykład)"], "y": false}, {"t": "cell", "name": "Pirybedyl", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. **D₂, D₃**", "y": false}, {"t": "cell", "name": "Pirybedyl", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "stymuluje rec. dopaminowe i mózgowe drogi dopaminergiczne (konspekt)", "y": false}, {"t": "cell", "name": "Pirybedyl", "col": "NA CO", "sub": "(wskazania)", "a": "choroba Parkinsona", "y": false}, {"t": "cell", "name": "Pirybedyl", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa – nudności, wymioty, hipotensja ortostatyczna, senność, omamy, halucynacje", "y": false}, {"t": "cell", "name": "Pramipeksol", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. **D₂, D₃, D₄**", "y": false}, {"t": "cell", "name": "Pramipeksol", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["pobudzając receptory dopaminowe w prążkowiu, aktywuje przekaźnictwo dopaminergiczne w układzie pozapiramidowym → **łagodzi hipokinetyczne objawy choroby Parkinsona** (konspekt)", "**wykład:** ago-antagonista receptorów D₂, D₃ i D₄; łagodzi hipokinetyczne objawy choroby Parkinsona; po podaniu p.o. szybko i całkowicie wchłania się z przewodu pokarmowego; leczenie objawowe zaawansowanej, idiopatycznej choroby Parkinsona — stosowany w skojarzeniu z lewodopą w przypadkach zmniejszenia się jej skuteczności lub zespołu (on-off)", "**PK (Lippincott, ryc. 15.12):** biodostępność > 90%, Vd 7 l/kg, okres półtrwania 8 godz. (do 12 godz. u pacjentów powyżej 65 r.ż.), biotransformacja pomijalna, **wydalany przede wszystkim w formie niezmienionej z moczem – wymagana jest korekta dawki u pacjentów z zaburzeniami czynności nerek**"], "y": false}, {"t": "cell", "name": "Pramipeksol", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona, zespół niespokojnych nóg** (konspekt)", "skuteczny u pacjentów z PD powikłanym zmiennością kontroli ruchów i dyskinezami (Lippincott)"], "y": false}, {"t": "cell", "name": "Pramipeksol", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa", "y": false}, {"t": "cell", "name": "Ropinirol", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. **D₂, D₃**", "y": false}, {"t": "cell", "name": "Ropinirol", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["stymulacja rec. w prążkowiu aktywuje przekaźnictwo dopaminergiczne w układzie pozapiramidowym (konspekt)", "**wykład:** dobrze tolerowany, stosowany we wczesnych stadiach choroby; w leczeniu początkowym w monoterapii, w leczeniu skojarzonym lewodopą, kiedy działanie lewodopy staje się niewystarczające lub pojawia się fluktuacja efektu terapeutycznego (efekt końca dawki i efekt przełączenia); leczenie skojarzone umożliwia także zmniejszenie dobowej dawki lewodopy", "**PK (Lippincott):** biodostępność 55%, Vd 7,5 l/kg, okres półtrwania 6 godz., biotransformacja intensywna, wydalanie przez nerki (mniej niż 10% w postaci niezmienionej)"], "y": false}, {"t": "cell", "name": "Ropinirol", "col": "NA CO", "sub": "(wskazania)", "a": "**choroba Parkinsona, zespół niespokojnych nóg** (konspekt)", "y": false}, {"t": "cell", "name": "Ropinirol", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa", "**INT:** antybiotyki fluorochinolonowe i inne inhibitory izoenzymu **1A2** cytochromu P450 (np. fluwoksamina) mogą hamować biotransformację ropinirolu, co wymaga dostosowania jego dawki (Lippincott)"], "y": false}, {"t": "cell", "name": "Rotygotyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. **D₃, D₂, D₁**", "y": false}, {"t": "cell", "name": "Rotygotyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego (konspekt)", "**podawana raz dziennie w plastrze transdermalnym, który zapewnia stabilne stężenie leku we krwi przez ponad 24 godziny** (Lippincott); nowy preparat stosowany przezskórnie (wykład)", "**PK (Lippincott):** biodostępność 45%, Vd 84 l/kg, okres półtrwania 7 godz., biotransformacja intensywna, wydalanie przez nerki"], "y": false}, {"t": "cell", "name": "Rotygotyna", "col": "NA CO", "sub": "(wskazania)", "a": "**choroba Parkinsona, zespół niespokojnych nóg** (konspekt)", "y": false}, {"t": "cell", "name": "Rotygotyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa", "y": false}, {"t": "cell", "name": "Kabergolina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "AGO rec. dopaminowy **D₂** w komórkach przedniego płata przysadki", "y": false}, {"t": "cell", "name": "Kabergolina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["pobudza (agonista) rec. dopaminowy D₂ ⇒ **hamowanie uwalniania prolaktyny** → zahamowanie laktacji (konspekt)"], "y": false}, {"t": "cell", "name": "Kabergolina", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia związane z nadmiernym wydzielaniem prolaktyny → **hiperprolaktynemia, zaburzenia miesiączkowania, brak owulacji, mlekotok** (konspekt)", "y": false}, {"t": "cell", "name": "Kabergolina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak cała grupa", "y": false}]}, {"title": "leki o innym mechanizmie – amantadyna", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "leki o innym mechanizmie – amantadyna", "blocks": [{"h": null, "items": ["Amantadyna"]}], "n": 1}, {"t": "cell", "name": "Amantadyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**ANT rec. NMDA**", "nasila uwalnianie dopaminy i blokuje jej wychwyt zwrotny", "dodatkowo działa **cholinolitycznie** oraz **p/wirusowo** (hamuje replikację wirusów grypy A)"], "y": false}, {"t": "cell", "name": "Amantadyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["nasilenie uwalniania dopaminy i blokowanie wychwytu zwrotnego → wzrost przekaźnictwa dopaminergicznego; blokowanie (ANT) rec. NMDA ⇒ **hamowanie przekaźnictwa glutaminergicznego**; uwalnianie acetylocholiny → **efekt cholinolityczny**; dodatkowo hamuje replikację wirusów grypy A → działanie p/wirusowe (konspekt)", "**do odkrycia właściwości przeciwparkinsonowskich amantadyny, leku przeciwwirusowego, doszło przez przypadek** (Lippincott)", "**wykład:** ↑ uwalnianie DA z neuronów dopaminergicznych, antagonista rec. NMDA; **lek o zdecydowanie mniejszej skuteczności niż lewodopa**; łagodzi objawy sztywności, akinezji i zwiększa aktywność psychoruchową; **słabo wpływa na drżenie**; dobrze wchłania się po podaniu p.o.; wykazuje stosunkowo długie działanie", "**amantadyna cechuje się mniejszą skutecznością terapeutyczną i szybszym rozwojem tolerancji w porównaniu z lewodopą, jednak wykazuje przy tym mniej działań ubocznych** (Lippincott)"], "y": false}, {"t": "cell", "name": "Amantadyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona i zespoły parkinsonowskie, działania niepożądane po neuroleptykach, zakażenia wirusem grypy typu A** (konspekt)"], "y": false}, {"t": "cell", "name": "Amantadyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** pobudzenie psychoruchowe (oszołomienie, niepokój, bezsenność, koszmary senne, halucynacje), **wyższe dawki – ostra psychoza lekowa**, ze strony układu pokarmowego – nudności, wymioty, zaparcia lub biegunki", "lek ten może wywoływać niepokój, pobudzenie, zaburzenia orientacji i halucynacje; w większych dawkach może też wywołać ostrą psychozę polekową; ponadto mogą wystąpić: **hipotonia ortostatyczna, zatrzymanie moczu, obrzęki obwodowe czy suchość w ustach** (Lippincott)"], "y": false}]}, {"title": "leki cholinolityczne", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "leki cholinolityczne", "blocks": [{"h": null, "items": ["Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna"]}], "n": 1}, {"t": "cell", "name": "Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**ANT receptorów muskarynowych (M)**", "y": false}, {"t": "cell", "name": "Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamują przekaźnictwo cholinergiczne w prążkowiu ⇒ **przywrócenie funkcjonalnej równowagi między układem cholinergicznym i dopaminergicznym** → zmniejszenie sztywności i drżenia mięśniowych, ślinienia, ruchów mimowolnych (konspekt)", "**wykład:** DA za pośrednictwem rec. D₂ hamuje uwalnianie ACh w prążkowiu → blokada rec. M w prążkowiu ma przywrócić równowagę pomiędzy ukł. cholinergicznym a zniszczonym dopaminergicznym; **działają słabiej od L-DOPY, ale skuteczniej znoszą drżenia**", "**antagoniści muskarynowi są znacznie mniej skuteczni od lewodopy i pełnią rolę wyłącznie leczenia uzupełniającego w leczeniu objawów parkinsonowskich**; działanie benzatropiny# i triheksyfenidylu# jest podobne, jednak pacjenci mogą reagować odmiennie na poszczególne substancje (Lippincott)", "**wzmożone napięcie mięśniowe i ślinotok – prydynol** (konspekt)"], "y": false}, {"t": "cell", "name": "Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna", "col": "NA CO", "sub": "(wskazania)", "a": ["**choroba Parkinsona, polekowe zaburzenia pozapiramidowe** (konspekt)", "**SĄ TO LEKI Z WYBORU W LECZENIU PARKINSONIZMU POLEKOWEGO!!** (wykład)"], "y": false}, {"t": "cell", "name": "Biperyden, Prydynol, Triheksyfenidyl, Orfenadryna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN ⇒ głównie wynikające z działania cholinolitycznego** → zaburzenia widzenia, zatrzymanie moczu, nudności, zaparcia, suchość błon śluzowych, splątanie, **pogorszenie funkcji poznawczych (upośledzenie pamięci świeżej – szczególnie osoby starsze)** (konspekt)", "**wykład:** suchość w jamie ustnej, suchość skóry, rozszerzenie źrenic, zaburzenia akomodacji, częstoskurcz, zaparcia; objawy ośrodkowe: pobudzenie, zaburzenia orientacji i świadomości, splątanie, majaczenie, zaburzenia pamięci, **OTĘPIENIE**, wzrost temperatury ciała, zawroty głowy", "omawiane leki mogą wywoływać zmienność nastroju i zaburzenia orientacji; ponadto suchość w jamie ustnej, zaparcie i zaburzenia widzenia typowe dla blokerów receptorów muskarynowych; wpływają również na perystaltykę jelit i **są przeciwwskazane u pacjentów z jaskrą, rozrostem gruczołu krokowego i zwężeniem odźwiernika** (Lippincott)"], "y": false}]}, {"title": "antagoniści receptora adenozynowego", "level": "sub", "parent": "LEKI W CHOROBIE PARKINSONA", "cards": [{"t": "list", "q": "antagoniści receptora adenozynowego", "blocks": [{"h": null, "items": ["Istradefilina, Preladenant"]}], "n": 1}, {"t": "cell", "name": "Istradefilina, Preladenant", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie (selektywny ANT) rec. adenozynowego A2A**", "y": false}, {"t": "cell", "name": "Istradefilina, Preladenant", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększenie przekaźnictwa dopaminergicznego **poprzez rec. D₂** ⇒ poprawa przekaźnictwa dopaminergicznego w układzie pozapiramidowym (konspekt)", "prawdopodobnym mechanizmem działania leku jest blokowanie receptora adenozynowego A2A (Lippincott)"], "y": false}, {"t": "cell", "name": "Istradefilina, Preladenant", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie wspomagające choroby Parkinsona** (konspekt)", "istradefilina wskazana jest jako leczenie wspomagające dla połączenia lewodopa + karbidopa w ramach lepszej kontroli objawów PD; **jej celem jest redukcja częstości i czasu trwania epizodów zjawiska „off”** (Lippincott)"], "y": false}, {"t": "cell", "name": "Istradefilina, Preladenant", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**dyskinezy, nudności, zaparcia, halucynacje, bezsenność i utrata kontroli impulsów** to możliwe działania uboczne istradefiliny (Lippincott)", "y": false}, {"t": "cell", "name": "Leki nasilające objawy parkinsonowskie (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**neuroleptyki, szczególnie I gen.** (patrz tabelka – neuroleptyki)", "**cynaryzyna i flunaryzyna** – blok rec. D₂", "**metoklopramid** (stosowany w zaparciach, wymiotach)"], "y": true}, {"t": "cell", "name": "Leki nasilające objawy parkinsonowskie (wykład)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**nagłe odstawienie leków p/parkinsonowskich** ⇒ zespół podobny do złośliwego zespołu poneuroleptycznego ⇒ **wzrost temperatury, utrata przytomności, uszkodzenie mięśni, zagrożenie życia** (wykład)", "**po lekach dopaminergicznych możliwe jest wystąpienie objawów psychotycznych (halucynacje)!** ⇒ zmniejszyć dawkę leku!! ⇒ można podać neuroleptyk, **koniecznie atypowy** (olanzapina) (wykład)"], "y": true}]}, {"title": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA", "blocks": [{"h": "inhibitory acetylocholinoesterazy", "items": ["Donepezil, Galantamina", "Rywastygmina", "Takryna"]}, {"h": "inne leki", "items": ["Memantyna", "Adukanumab #", "Lekanemab, Donanemab"]}], "n": 6}]}, {"title": "inhibitory acetylocholinoesterazy", "level": "sub", "parent": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA", "cards": [{"t": "list", "q": "inhibitory acetylocholinoesterazy", "blocks": [{"h": null, "items": ["Donepezil, Galantamina", "Rywastygmina", "Takryna"]}], "n": 3}, {"t": "cell", "name": "Cechy wspólne inhibitorów AChE", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**acetylocholinoesteraza (AChE)**, rywastygmina także **butyrylocholinoesteraza (BuChE)**", "y": true}, {"t": "cell", "name": "Cechy wspólne inhibitorów AChE", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie rozkładu acetylocholiny ⇒ zwiększenie stężenia acetylocholiny w mózgu → **poprawa funkcji poznawczych i zaburzeń zachowania** (konspekt)", "liczne badania łączą stopniową utratę neuronów cholinergicznych i przekaźnictwa cholinergicznego w obrębie kory mózgu z pogorszeniem pamięci, które jest charakterystycznym objawem AD (Lippincott)", "substancje te wykazują się pewną wybiórczością dla AChE w OUN w porównaniu z tkankami obwodowymi; **galantamina może również wzmacniać działanie acetylocholiny w ośrodkowych receptorach nikotynowych** (Lippincott)", "**omawiane leki mogą jednak zapewnić co najwyżej spowolnienie tempa utraty funkcji poznawczych** u pacjentów z rozpoznaniem otępienia w przebiegu AD (Lippincott)", "**wykład:** leczenie należy rozpoczynać jak najwcześniej, stosować maksymalną skuteczną i dobrze tolerowaną dawkę leku; spowalniają przebieg choroby, wydłużają czas samodzielnego funkcjonowania", "**porównanie (wykład, slajdy 38–39):** selektywność wobec AChE – donepezil tylko AChE, rywastygmina AChE i BuChE (izoforma G1AChE w blaszkach starczych), galantamina tylko AChE · typ hamowania – donepezil szybko odwracalne, rywastygmina rzekomo nieodwracalne, galantamina szybko, słabo, odwracalne · wybiórczość wobec mózgu – tylko rywastygmina · T½ (godz.) – donepezil 70, rywastygmina 1–2 · metabolizm – donepezil wątrobowy CYP450, rywastygmina enzymy docelowe w synapsie, galantamina wątrobowy CYP450 · wiązanie z białkami – 96% / 40% / < 20% · eliminacja – wątroba / nerki / wątroba i nerki · możliwość akumulacji – duża / bardzo mała / mała · potencjał interakcji – duży / niewielki / umiarkowany · tolerancja – tak / nie / nie · dawki – 5 lub 10 mg/d, 6–12 mg/d, 16–24 mg/d · dawkowanie – 1 ×, 2 ×, 2 × dziennie"], "y": true}, {"t": "cell", "name": "Cechy wspólne inhibitorów AChE", "col": "NA CO", "sub": "(wskazania)", "a": "**leczenie otępienia w chorobie Alzheimera** (konspekt)", "y": true}, {"t": "cell", "name": "Cechy wspólne inhibitorów AChE", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN ⇒ działanie parasympatykomimetyczne** → nudności, wymioty, biegunka, bradykardia, nadmierne wydzielanie śliny i pocenie, pobudzenie, zachowania agresywne (konspekt)", "**P/W ⇒ wynikające z działania parasympatykomimetycznego** → astma oskrzelowa, zaburzenia rytmu serca (bradykardia, blok przedsionkowo-komorowy), zaawansowana niewydolność serca (konspekt)", "**P/W (wykład):** uszkodzenie wątroby · choroba wrzodowa · zaburzenia drożności przewodu pokarmowego · obturacyjne choroby płuc, astma · bradyarytmie · padaczka. **PRZEDAWKOWANIE GROZI ŚMIERCIĄ!! Przełom cholinergiczny, bradykardia, porażenie oddechu**", "**DN w OUN (wykład, slajd 40):** nudności i wymioty (podwzgórze, area postrema) ++ / +++ / ++ · objawy pozapiramidowe (jądro ogoniaste) ++ / +/− / +/− · zaburzenia snu (most) ++ / +/− / +/− · wpływ na krążenie i oddychanie (rdzeń przedłużony) + / +/− / + · pobudzenie psychoruchowe (płaty czołowy i skroniowy) ++ / + / ++  [kolejno: donepezil / rywastygmina / galantamina]", "**DN na obwodzie (wykład, slajd 41):** bradykardia (serce) + / +/− / + · skurcze i osłabienie mięśni (łącze nerwowo-mięśniowe) ++ / +/− / +/− · nietrzymanie moczu (pęcherz moczowy) + / +/− / +/−", "do częstych działań ubocznych należą nudności, biegunka, wymioty, brak łaknienia, drżenia i skurcze mięśniowe, oraz bradykardia (Lippincott, ryc. 15.13)", "**uwaga kliniczna (Lippincott 15.2):** częstymi lekami do ograniczania powyższych objawów ubocznych mogą być substancje, które w profilu działań terapeutycznych posiadają efekty antycholinergiczne – zapisując je należy jednak pamiętać, że **adresując obwodowe niepożądane działania cholinergiczne, pojawiające się wtórnie do działania inhibitorów AChE, można jednocześnie negatywnie wpłynąć na funkcje poznawcze**, ponieważ leki o działaniu antycholinergicznym mogą przekraczać barierę krew–mózg"], "y": true}, {"t": "cell", "name": "Donepezil, Galantamina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalne inhibitory acetylocholinoesterazy**", "y": false}, {"t": "cell", "name": "Donepezil, Galantamina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie rozkładu acetylocholiny ⇒ zwiększenie stężenia acetylocholiny w mózgu → poprawa funkcji poznawczych i zaburzeń zachowania (konspekt)", "**donepezil jest zwykle preferowany ze względu na możliwość przyjmowania raz dziennie** (Lippincott)", "**galantamina** może również wzmacniać działanie acetylocholiny w ośrodkowych receptorach nikotynowych; **modulator rec. N chroni przed zmniejszeniem wrażliwości, przedłuża czas aktywacji receptora** (wykład)", "donepezil i galantamina są substratami CYP450 i mogą ulegać ww. interakcjom (Lippincott)"], "y": false}, {"t": "cell", "name": "Donepezil, Galantamina", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie otępienia w chorobie Alzheimera** (konspekt)", "inhibitory AChE, takie jak galantamina, zwiększają transmisję cholinergiczną w OUN i mogą spowodować umiarkowane spowolnienie postępu otępienia w przebiegu AD (Lippincott, pyt. 15.3)"], "y": false}, {"t": "cell", "name": "Donepezil, Galantamina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa – działanie parasympatykomimetyczne", "**donepezil:** duża możliwość akumulacji, duży potencjał interakcji, możliwy rozwój tolerancji (wykład)"], "y": false}, {"t": "cell", "name": "Rywastygmina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalny inhibitor acetylo- i butyrylocholinoesterazy**", "y": false}, {"t": "cell", "name": "Rywastygmina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie rozkładu acetylocholiny ⇒ zwiększenie stężenia acetylocholiny w mózgu → poprawa funkcji poznawczych i zaburzeń zachowania (konspekt)", "**rywastygmina jest jedynym lekiem dopuszczonym do leczenia otępienia w PD, jak również jedynym dostępnym w postaci transdermalnej** (Lippincott)", "**rywastygmina ulega hydrolizie przez AChE do karbamylowanego metabolitu i nie wykazuje interakcji z lekami wpływającymi na aktywność enzymów CYP450** (Lippincott)", "większa wybiórczość wobec mózgu niż obwodu; rzekomo nieodwracalny typ hamowania AChE; T½ 1–2 godz. (wykład)"], "y": false}, {"t": "cell", "name": "Rywastygmina", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie otępienia w chorobie Alzheimera** (konspekt)", "otępienie w przebiegu choroby Parkinsona (Lippincott)"], "y": false}, {"t": "cell", "name": "Rywastygmina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa", "**rywastygmina może wywoływać drżenia mięśniowe jako działanie niepożądane** → jej zastosowanie nie jest wręcz przeciwwskazane w PD, ale powinna być stosowana z zachowaniem ostrożności, ponieważ może nasilać drżenia mięśniowe wynikające z choroby podstawowej (Lippincott, pyt. 15.7)", "bardzo mała możliwość akumulacji, niewielki potencjał interakcji, brak rozwoju tolerancji (wykład)"], "y": false}, {"t": "cell", "name": "Takryna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "inhibitor acetylocholinoesterazy", "y": false}, {"t": "cell", "name": "Takryna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "pierwszy inhibitor AChE stosowany w AD (wykład, slajd 37)", "y": false}, {"t": "cell", "name": "Takryna", "col": "NA CO", "sub": "(wskazania)", "a": "leczenie otępienia w chorobie Alzheimera", "y": false}, {"t": "cell", "name": "Takryna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "hepatotoksyczność – obecnie praktycznie niestosowana", "y": false}]}, {"title": "inne leki", "level": "sub", "parent": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA", "cards": [{"t": "list", "q": "inne leki", "blocks": [{"h": null, "items": ["Memantyna", "Adukanumab #", "Lekanemab, Donanemab"]}], "n": 3}, {"t": "cell", "name": "Memantyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**selektywny, niekompetycyjny ANT rec. NMDA**", "dodatkowo działa **ANT na rec. 5-HT3**, i w mniejszym stopniu blokuje **receptory nikotynowe**"], "y": false}, {"t": "cell", "name": "Memantyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie niekorzystnego działania aminokwasów pobudzających ⇒ **poprawa funkcji poznawczych, hamowanie procesu amyloidogenezy i spowolnienie postępu choroby** (konspekt)", "pobudzanie receptorów glutaminergicznych w OUN wydaje się być kluczowe w kształtowaniu niektórych śladów pamięciowych; **nadmierna stymulacja, zwłaszcza receptorów NMDA, może jednak prowadzić do działań ekscytotoksycznych wobec neuronów** i jest sugerowanym mechanizmem procesów neurodegeneracyjnych lub apoptotycznych (Lippincott)", "działanie memantyny polega na blokowaniu receptora NMDA i ograniczaniu napływu jonów Ca²⁺ do komórki nerwowej, co zapobiega osiąganiu toksycznych stężeń omawianych kationów wewnątrz komórki (Lippincott)", "**wykład:** zależny od potencjału błonowego niekompetycyjny antagonista rec. NMDA o średnim powinowactwie; hamuje neurotoksyczny wpływ patologicznie podwyższonego poziomu glutaminianu, przywraca fizjologiczną aktywność rec. NMDA"], "y": fa
