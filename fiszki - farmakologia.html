<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fiszki — farmakologia</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b16; --muted:#6d685c; --line:#ded7c7;
    --blue:#d9e2f3; --blue-ink:#1f3864; --yellow:#fff4cc; --yellow-line:#e6cf84;
    --grey:#d9d9d9; --accent:#1f3864; --green:#e3efe1; --green-ink:#2d5a2d;
    --bar:64px; --foot:0px;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.5 "Aptos Narrow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,Arial,sans-serif;
    padding-top:var(--bar);padding-bottom:calc(var(--foot) + 24px);
    overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;
  }
  #bar{
    position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:8px 12px;padding-top:calc(8px + var(--safeT));
    background:rgba(244,241,234,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none;
  }
  #back{
    flex:0 0 auto;width:46px;height:46px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--accent);font-size:24px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  #back:active:not(:disabled){background:var(--blue);border-color:var(--blue-ink)}
  #back:disabled{opacity:.28;cursor:default}
  #crumb{flex:1 1 auto;min-width:0;font-size:13px;color:var(--muted);
         display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;line-height:1.35}
  #crumb .c{cursor:pointer;color:var(--muted);padding:2px 0;touch-action:manipulation}
  #crumb .c:active{color:var(--accent)}
  #crumb .sep{color:#b9b2a2}
  #crumb .cur{color:var(--ink);font-weight:700}

  main{max-width:860px;margin:0 auto;padding:16px 14px 8px}
  h1{font-size:21px;line-height:1.25;margin:2px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0 0 18px}
  h2{font-size:16px;line-height:1.35;margin:2px 0 14px;color:var(--blue-ink)}
  .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
           margin:22px 0 8px;font-weight:700}

  .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
        border:1px solid var(--line);border-radius:13px;padding:14px;min-height:56px;margin-bottom:9px;
        cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;
        transition:background .12s,border-color .12s}
  .item:active{background:var(--blue);border-color:var(--blue-ink)}
  .item .nm{flex:1 1 auto;font-weight:600;font-size:15px;line-height:1.35}
  .item .meta{flex:0 0 auto;font-size:12px;color:var(--muted);white-space:nowrap}
  .item .arr{flex:0 0 auto;color:#bbb3a2;font-size:18px;line-height:1}
  .item.deck{padding:18px 16px}
  .item.deck .nm{font-weight:700;font-size:17px}
  .item.sub .nm{font-weight:600;padding-left:14px;border-left:3px solid var(--yellow-line)}
  .item.quiz .nm{font-weight:700;padding-left:14px;border-left:3px solid var(--blue-ink)}
  .legend .ybar{display:inline-block;width:3px;height:1em;vertical-align:-.15em;
                background:var(--yellow-line);margin-right:7px;border-radius:2px}
  .item.all{background:var(--blue);border-color:var(--blue-ink)}
  .item.all .nm{font-weight:700;color:var(--blue-ink)}
  .tag{display:inline-block;background:var(--blue);color:var(--blue-ink);font-size:11px;font-weight:700;
       padding:3px 8px;border-radius:20px;margin-right:8px;white-space:nowrap}

  /* ---------- flashcard ---------- */
  .prog{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .bar{flex:1 1 auto;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
  .cnt{flex:0 0 auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
      min-height:190px;cursor:pointer;user-select:text;-webkit-user-select:text;
      display:flex;flex-direction:column;justify-content:center}
  .fc.theory{background:var(--yellow);border-color:var(--yellow-line)}
  .fc.listq{background:var(--green);border-color:#bcd4b8}
  .fc.rev{background:#e9eef8;border-color:#b7c6e3}
  .fc.rev .q{font-size:18.5px;font-weight:600;line-height:1.38}
  .ans .revans{font-size:23px;font-weight:700;text-align:center;line-height:1.25;margin:0}
  .ans .revsrc{margin-top:11px;text-align:center;font-size:11.5px;color:var(--muted);
               letter-spacing:.03em;line-height:1.35}
  .kind{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
        font-weight:700;margin-bottom:10px;text-align:center}
  .q{font-size:20px;line-height:1.3;font-weight:700;text-align:center;margin:0}
  .q .col{display:block;margin-top:10px;font-size:14px;font-weight:700;color:var(--blue-ink);
          letter-spacing:.06em}
  .q .colsub{display:block;font-size:12px;font-style:italic;color:var(--muted);font-weight:400;margin-top:2px}
  .flip{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
  .ans{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
  .ans p{margin:0 0 9px;font-size:15.5px}
  .ans ul{margin:0;padding-left:19px}
  .ans li{margin:0 0 8px;font-size:15.5px}
  .ans li::marker{color:#b8923a}
  .ans p:last-child,.ans li:last-child{margin-bottom:0}
  .ans .blkh{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;
             text-transform:uppercase;letter-spacing:.05em}
  .ans .blkh:first-child{margin-top:0}
  .ans ol{margin:0;padding-left:22px}
  .ans ol li{margin:0 0 6px;font-weight:600}

  #foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;gap:7px;
        padding:9px 10px;padding-bottom:calc(9px + var(--safeB));
        background:rgba(244,241,234,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
  body.study #foot{display:flex}
  #foot button{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:10px 4px;min-height:56px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;
    color:var(--muted);touch-action:manipulation;transition:background .12s,border-color .12s,color .12s}
  #foot button.w1{flex:1 1 0}            /* one third  */
  #foot button.w2{flex:2 1 0}            /* two thirds */
  #foot button:active{background:var(--blue)}
  #foot button:disabled{opacity:.3}
  #foot button.main{background:var(--blue);border-color:var(--blue-ink);color:var(--blue-ink);font-size:16px}
  #foot button.good{background:var(--green);border-color:#9cc098;color:var(--green-ink)}
  #foot button.bad{background:#f7e0dd;border-color:#dba79f;color:#8c3a2e}
  #foot button.good:active{background:#cfe6cb}
  #foot button.bad:active{background:#efcac4}

  /* ---------- start screen ---------- */
  .startbox{padding:4px 0}
  .settitle{font-size:22px;line-height:1.25;margin:2px 0 4px}
  .opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;min-height:62px;
    margin-bottom:9px;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation;
    transition:background .12s,border-color .12s}
  .opt .o1{font-weight:700;font-size:16px}
  .opt .o2{font-size:12.5px;color:var(--muted)}
  .opt[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-ink)}
  .opt[aria-pressed="true"] .o1{color:var(--blue-ink)}
  .opt[aria-pressed="true"] .o1::after{content:" ✓"}
  .startbtn{width:100%;margin-top:16px;border:1px solid var(--blue-ink);border-radius:13px;
    background:var(--blue-ink);color:#fff;padding:16px;min-height:60px;cursor:pointer;
    font:inherit;font-size:18px;font-weight:700;touch-action:manipulation}
  .startbtn:active{background:#16294a}

  /* ---------- score ---------- */
  .tally{display:flex;gap:14px;justify-content:center;font-size:14px;font-weight:700}
  .tally.small{justify-content:flex-end;gap:12px;font-size:12.5px;margin:-6px 0 12px}
  .tally .good{color:var(--green-ink)}
  .tally .bad{color:#8c3a2e}
  .scorebig{font-size:46px;font-weight:700;line-height:1;margin:6px 0 4px}
  .scorebig .sg{color:var(--green-ink)}
  .scorebig .ss,.scorebig .st{color:var(--muted);font-size:26px}
  .pct{color:var(--muted);font-size:14px;margin:0 0 16px}
  .legend{font-size:12px;color:var(--muted);line-height:1.6;margin:20px 0 0;padding-top:12px;
          border-top:1px solid var(--line)}
  .done{text-align:center;padding:26px 10px}
  .done h3{font-size:19px;margin:0 0 8px}
  .done p{color:var(--muted);font-size:14px;margin:0 0 18px}
  @media (hover:hover) and (pointer:fine){
    .item:hover{border-color:var(--accent)}
    #back:hover:not(:disabled){background:var(--blue);border-color:var(--blue-ink)}
    #foot button:hover:not(:disabled){border-color:var(--accent)}
    .fc:hover{border-color:var(--accent)}
  }
  @media (max-width:430px){
    main{padding:14px 12px 8px} h1{font-size:19px} .q{font-size:18px}
    .item .nm{font-size:14px} #foot button{font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

, "name": "Szybkie kanały sodowe", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "blokada kanałów sodowych (i potasowych)", "y": true}, {"t": "cell", "name": "Szybkie kanały sodowe", "col": "NA CO", "sub": "(wskazania)", "a": "TLPD", "y": true}, {"t": "cell", "name": "Szybkie kanały sodowe", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["zaburzenia rytmu serca, drgawki – szczególnie przy przedawkowaniu (konspekt)", "TLPD wpływają na przewodnictwo serca podobnie jak chinidyna (Lippincott)"], "y": true}, {"t": "cell", "name": "MAO-A i MAO-B", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["oksydaza monoaminowa – enzym mitochondrialny w nerwach, jelitach i wątrobie", "**MAO-A** metabolizuje 5-HT, NA i DA · **MAO-B** metabolizuje głównie DA"], "y": true}, {"t": "cell", "name": "MAO-A i MAO-B", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["MAO działa jak „zawór bezpieczeństwa” – dezaminuje nadmiar neuroprzekaźników, gdy neuron jest w spoczynku (Lippincott)", "**hamowanie MAO** → ↑ zapasów NA, 5-HT i DA w neuronie → dyfuzja nadmiaru do przestrzeni synaptycznej → efekt p/depresyjny", "MAO hamowana jest nie tylko w mózgu, ale też w wątrobie i jelitach, które katalizują deaminację potencjalnie toksycznych substancji, np. **tyraminy**"], "y": true}, {"t": "cell", "name": "MAO-A i MAO-B", "col": "NA CO", "sub": "(wskazania)", "a": ["nieodwracalne i nieselektywne: fenelzyna#, tranylcypromina#, izokarboksazyd#, nialamid, pargilina", "odwracalny, selektywny MAO-A: moklobemid", "selektywny MAO-B: selegilina (w małych dawkach; w dużych nieselektywna)"], "y": true}, {"t": "cell", "name": "MAO-A i MAO-B", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["mimo że MAO jest w pełni hamowana po kilku dniach, działanie p/depresyjne jest **opóźnione o kilka tygodni** (Lippincott)", "efekt tyraminowy („cheese effect”) – patrz sekcja IMAO"], "y": true}, {"t": "cell", "name": "Zmiany adaptacyjne po wielokrotnym podaniu (wykład, slajd 44)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**β-adrenergiczna „down”-regulacja** (↓ gęstości receptorów β) – m.in. po TLPD", "**α1-adrenergiczna „up”-regulacja** – po inhibitorach wychwytu NA i 5-HT oraz po tianeptynie", "**↓ gęstości receptorów 5-HT2** – TLPD, IMAO, mirtazapina, milnacypran", "**osłabienie wrażliwości receptorów 5-HT1A** – SSRI, IMAO"], "y": true}]}, {"title": "LEKI PRZECIWDEPRESYJNE – CECHY WSPÓLNE", "level": "section", "parent": null, "cards": [{"t": "cell", "name": "Cechy wspólne leków p/depresyjnych", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["bezpośrednio lub pośrednio nasilają działanie NA i/lub 5-HT w mózgu (Lippincott)", "mechanizmy: hamowanie transporterów wychwytu zwrotnego (SERT, NET, DAT), antagonizm receptorów lub hamowanie oksydazy monoaminowej; nowsze – wpływ na GABA (breksanolon#) lub glutaminian (esketamina)"], "y": true}, {"t": "cell", "name": "Cechy wspólne leków p/depresyjnych", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**niejednorodna grupa leków psychotropowych**, stosowana przede wszystkim w leczeniu zaburzeń afektywnych (nastroju), również w zaburzeniach lękowych, związanych ze stresem, w bezsenności oraz innych chorobach (konspekt)", "**efekt poprawy nastroju – po co najmniej 2 tyg. stosowania, pełne działanie p/depresyjne po 12 tyg.** (konspekt, Lippincott ryc. 17.3); wykład: istotny efekt terapeutyczny po 2–4 tyg., brak wyraźnych zmian po ok. 3 tyg. → ↑ dawki; brak efektu po 6–8 tyg. → zmiana leczenia", "od 60 do 80% pacjentów pozytywnie reaguje na leki p/depresyjne; 20–40% wykazuje częściową lub słabą odpowiedź na monoterapię (Lippincott)", "**większość leków p/depresyjnych uważana jest za równie skuteczne** → wybór zależy od profilu DN, chorób współistniejących, historii odpowiedzi pacjenta i obrazu klinicznego (Lippincott, Zastosowanie kliniczne 17.1)"], "y": true}, {"t": "cell", "name": "Cechy wspólne leków p/depresyjnych", "col": "NA CO", "sub": "(wskazania)", "a": ["**depresja** (duże zaburzenie depresyjne) – główne wskazanie", "zaburzenia lękowe: OCD, lęk napadowy, GAD, zespół stresu pourazowego, lęk społeczny (fobia społeczna)", "przedmiesiączkowe zaburzenia dysforyczne; żarłoczność psychiczna (bulimia – tylko fluoksetyna zatwierdzona)", "zespoły bólowe: ból neuropatyczny, fibromialgia, przewlekłe bóle mięśniowo-szkieletowe, profilaktyka migrenowych bólów głowy", "bezsenność (małe dawki doksepiny, trazodon)", "ChAD – depresja dwubiegunowa (w skojarzeniu ze stabilizatorem nastroju)"], "y": true}, {"t": "cell", "name": "Cechy wspólne leków p/depresyjnych", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**wszystkie leki p/depresyjne mogą obniżać próg drgawkowy** (Lippincott)", "**stosowanie u dzieci i młodzieży:** ostrożnie – ↑ ryzyko myśli samobójczych; pacjentów pediatrycznych należy obserwować pod kątem pogorszenia depresji i myśli samobójczych wraz z rozpoczęciem leczenia lub zmianą dawki jakiegokolwiek leku p/depresyjnego (Lippincott)", "**ChAD:** wszystkie leki p/depresyjne stosować ostrożnie u pacjentów z ChAD, nawet w stanie depresji – mogą powodować przejście do zachowań maniakalnych (Lippincott); zbyt długie stosowanie → zmiana epizodu depresyjnego w maniakalny, zbyt krótkie → nawrót epizodu (wykład)", "**zespół odstawienia** – stopniowo zmniejszać dawki (patrz osobny wiersz)", "**zespół serotoninowy** – przy łączeniu leków serotoninergicznych (patrz osobny wiersz)"], "y": true}, {"t": "cell", "name": "Zasady stosowania (wykład, slajd 68)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["stosowanie leków należy poprzedzić **staranną oceną stanu somatycznego i neurologicznego**", "optymalną dawkę należy osiągać **stopniowo** (w okresie 7–10 dni)", "istotny efekt terapeutyczny pojawia się po kilku (**2–4**) tygodniach; brak wyraźnych zmian po ok. 3 tyg. jest wskazaniem do zwiększenia dawkowania; brak efektu terapeutycznego po 6–8 tyg. → zmiana leczenia", "**zbyt wczesne zakończenie** stosowania może spowodować ponowne pojawienie się objawów chorobowych – u chorych z zaburzeniami depresyjnymi nawracającymi zalecane jest kontynuowanie terapii przez dalszych **6 miesięcy**", "przy zamiarze zakończenia leczenia dawki należy zmniejszać **stopniowo** (w okresie kilku, kilkunastu dni)"], "y": true}, {"t": "cell", "name": "Zasady stosowania (wykład, slajd 68)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["nagłe przerwanie może spowodować pojawienie się złego samopoczucia, bezsenności, lęku, nudności, wymiotów, bólów głowy, niepokoju ruchowego", "**chorym leczonym ambulatoryjnie nie należy udostępniać większej ilości leku, zwłaszcza TLPD** – ze względu na ryzyko wykorzystania w zamiarach samobójczych (wykład); Lippincott: pacjenci ze skłonnościami samobójczymi powinni otrzymywać tylko ograniczone ilości TLPD i być ściśle monitorowani"], "y": true}, {"t": "cell", "name": "Zespół serotoninowy", "col": "RECEPTOR", "sub": "(na co działa)", "a": "nadmierne przekaźnictwo serotoninergiczne", "y": true}, {"t": "cell", "name": "Zespół serotoninowy", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["przejaw wzmożonego przekaźnictwa serotoninergicznego, mogący wystąpić przy stosowaniu leków działających serotoninergicznie", "**ryzyko wzrasta przy łącznym stosowaniu** leków wykazujących to działanie – zwłaszcza SSRI/SNRI + IMAO (wykład, Lippincott)"], "y": true}, {"t": "cell", "name": "Zespół serotoninowy", "col": "NA CO", "sub": "(wskazania)", "a": ["**objawy:** zaburzenia świadomości (zmiany stanu psychicznego), niepokój, pobudzenie psychoruchowe, drżenia mięśniowe, mioklonie (kloniczne skurcze mięśni), sztywność mięśni, zaburzenia koordynacji ruchów, dreszcze, zlewne poty, biegunka, **hipertermia**, drgawki, zmiany parametrów życiowych", "**zapobieganie:** okres karencji przy zmianie leku – co najmniej **2 tyg.** między IMAO a innym lekiem p/depresyjnym; **fluoksetynę należy odstawić co najmniej 6 tyg.** przed rozpoczęciem stosowania IMAO (Lippincott)"], "y": true}, {"t": "cell", "name": "Zespół serotoninowy", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**INT:** inhibitorów MAO nie należy łączyć z lekami działającymi na układ serotoninergiczny (SSRI, SNRI) → wysokie ryzyko zespołu serotoninowego (konspekt)", "y": true}, {"t": "cell", "name": "Zespół odstawienia", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["leki p/depresyjne mogą powodować zespół odstawienia, jeśli ich stosowanie zostanie gwałtownie przerwane – **zwłaszcza leki o krótszym T½ i bez aktywnego metabolitu** (Lippincott)", "**najniższe ryzyko: fluoksetyna** – ze względu na długi T½ i aktywny metabolit (Lippincott)"], "y": true}, {"t": "cell", "name": "Zespół odstawienia", "col": "NA CO", "sub": "(wskazania)", "a": "zaleca się stopniowo zmniejszać dawki, aby zapobiec objawom lub je zminimalizować", "y": true}, {"t": "cell", "name": "Zespół odstawienia", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**objawy:** ból głowy, złe samopoczucie i objawy grypopodobne, pobudzenie i drażliwość, nerwowość, zmiany w rytmie snu (Lippincott)", "TLPD – stopniowe odstawianie minimalizuje też **objawy cholinergiczne z odbicia** (Lippincott)"], "y": true}, {"t": "cell", "name": "Zespół antycholinergiczny ośrodkowy (wykład, slajd 49)", "col": "RECEPTOR", "sub": "(na co działa)", "a": "blokada receptorów M w OUN", "y": true}, {"t": "cell", "name": "Zespół antycholinergiczny ośrodkowy (wykład, slajd 49)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["przejaw cholinolitycznego działania leków na OUN, który może się pojawić przy stosowaniu TLPD, **szczególnie w wieku podeszłym**, u osób z organicznymi zmianami w OUN oraz przy łączeniu z innymi lekami o właściwościach cholinolitycznych"], "y": true}, {"t": "cell", "name": "Zespół antycholinergiczny ośrodkowy (wykład, slajd 49)", "col": "NA CO", "sub": "(wskazania)", "a": ["**objawy:** wysychanie błon śluzowych, suchość skóry, zaburzenia akomodacji, utrudnienie oddawania moczu (zatrzymanie moczu), niepokój, zaburzenia snu, upośledzenie koncentracji uwagi, pamięci, precyzji myślenia, przymglenie świadomości, majaczenie"], "y": true}, {"t": "cell", "name": "Zespół antycholinergiczny ośrodkowy (wykład, slajd 49)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**leczenie:** przerwanie stosowania leku; w ciężkich zaburzeniach (majaczenie) – **fizostygmina**", "y": true}]}, {"title": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT – TLPD (TRÓJPIERŚCIENIOWE)", "blocks": [{"h": null, "items": ["Klomipramina", "Amitryptylina", "Doksepina", "Dezypramina", "Imipramina", "Nortryptylina", "Amoksapina #", "Trimipramina", "Protryptylina #"]}], "n": 9}, {"t": "cell", "name": "Cechy wspólne TLPD", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamowanie wychwytu zwrotnego amin biogennych (NA, 5-HT, niektóre DA)", "dodatkowo w różnym stopniu **blokują receptory M, 5-HT (5-HT2A, 5-HT2), H1** oraz **kanały sodowe lub potasowe** → co może implikować określone działania niepożądane (konspekt)"], "y": true}, {"t": "cell", "name": "Cechy wspólne TLPD", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["↑ stężenia neuroprzekaźnika w szczelinie synaptycznej → ↑ pobudzenie układów: noradrenergicznego i serotoninergicznego, ewentualnie dopaminergicznego", "**aminy trzeciorzędowe:** imipramina (lek prototypowy), amitryptylina, klomipramina, doksepina, trimipramina · **aminy drugorzędowe:** dezypramina i nortryptylina (N-demetylowane metabolity imipraminy i amitryptyliny) oraz protryptylina# · **tetracykliczne:** maprotylina i amoksapina# (Lippincott)", "TLPD poprawiają nastrój u **50–70% osób z silną depresją**; początek poprawy powolny – 2 tyg. lub dłużej (Lippincott)", "**PK:** dobrze wchłaniane p.o.; zmienny metabolizm pierwszego przejścia → **niska i niespójna biodostępność**; metabolizm wątrobowy (CYP450) i sprzęganie z kwasem glukuronowym; wydalane w postaci nieaktywnych metabolitów przez nerki (Lippincott)", "wykład: podział na nieselektywne **o działaniu receptorowym** (α1, 5-HT2, ACh, H1) – imipramina, dezypramina, amitryptylina, nortryptylina, klomipramina, amoksapina#, doksepina, trimipramina"], "y": true}, {"t": "cell", "name": "Cechy wspólne TLPD", "col": "NA CO", "sub": "(wskazania)", "a": ["depresja o nasileniu od umiarkowanego do ciężkiego (Lippincott)", "niektórzy pacjenci z zaburzeniami lękowymi również reagują na TLPD", "**imipramina** – alternatywa dla desmopresyny lub niefarmakologicznych środków (alarmy wybudzeniowe) w leczeniu moczenia nocnego u dzieci (Lippincott)", "**amitryptylina** – zapobieganie migrenowym bólom głowy i leczenie przewlekłych zespołów bólowych (np. ból neuropatyczny) w stanach, w których przyczyna bólu nie została wykryta (Lippincott)", "**małe dawki doksepiny** – leczenie bezsenności (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne TLPD", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** sedacja, bóle i zawroty głowy, zaburzenia funkcji seksualnych, zaburzenia widzenia, zaparcia, zatrzymanie moczu, zwiększenie apetytu i przyrost masy ciała → działanie cholinolityczne i p/histaminowe; zaburzenia rytmu serca i drgawki (szczególnie przy przedawkowaniu) → mogą wynikać z blokady kanałów jonowych: sodowych, potasowych", "**blokada M:** niewyraźne widzenie, kserostomia, zatrzymanie moczu, tachykardia zatokowa, zaparcia, nasilenie jaskry z zamkniętym kątem przesączania (Lippincott, ryc. 17.7)", "**blokada α1:** niedociśnienie ortostatyczne, zawroty głowy i odruchowa tachykardia · **blokada H1:** sedacja · przyrost masy ciała – częste DN · zaburzenia seksualne u mniejszości pacjentów (rzadziej niż po SSRI) (Lippincott)", "**serce:** TLPD wpływają na przewodnictwo serca podobnie jak chinidyna – zbyt duża dawka może wywołać zagrażające życiu zaburzenia rytmu serca (Lippincott)", "**P/W:** p/wskazane lub stosowane ze szczególną ostrożnością u pacjentów z chorobami serca (po zawale, z zaburzeniami rytmu serca, ze zwiększonym ryzykiem wydłużenia odstępu QTc) → **kontrola EKG** (konspekt)", "**wąski indeks terapeutyczny** – niebezpieczne w przedawkowaniu; pacjenci ze skłonnościami samobójczymi powinni otrzymywać tylko ograniczone ilości tych leków i być ściśle monitorowani (Lippincott); mogą nasilać łagodny rozrost gruczołu prostaty, padaczkę i istniejące wcześniej zaburzenia rytmu serca", "**objawy psychiczne i neurologiczne po TLPD (wykład, slajd 48):** bezsenność lub senność, lęk, niepokój, podniecenie psychoruchowe, zaburzenia koncentracji uwagi i osłabienie procesów poznawczych, zaostrzenie objawów psychotycznych, **zmiana fazy depresyjnej w maniakalną**, napady padaczkowe i drżenia mięśniowe"], "y": true}, {"t": "cell", "name": "Klomipramina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (słabo) i 5-HT (**bardzo silnie**)", "ANT: M (silnie), 5-HT2, α1, H1"], "y": false}, {"t": "cell", "name": "Klomipramina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjny, p/lękowy i słabo uspokajający", "**lek o zrównoważonym profilu działania psychotropowego**, wykazuje ponadto wyraźne działanie „antyobsesyjne”", "stosunek hamowania NA/5-HT = 13 (nieselektywny, wykład)"], "y": false}, {"t": "cell", "name": "Klomipramina", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia obsesyjno-kompulsyjne** (natrętne myśli, ruminacje, kompulsje – wykład, slajd 67)", "zaburzenia depresyjne, zaburzenia lękowe", "bezsenność, ból neuropatyczny, ból przewlekły", "dawkowanie: 100–250 mg/d"], "y": false}, {"t": "cell", "name": "Klomipramina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – silne; efekt sedacyjny – słaby; efekt niepokoju i bezsenności – słaby; działanie kardiotoksyczne – umiarkowane; spadek ortostatyczny ciśnienia – umiarkowany; N/V – słabe; wzrost masy ciała – umiarkowany; zaburzenia seksualne – umiarkowane; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja · zaburzenia żołądkowo-jelitowe · przyrost masy ciała"], "y": false}, {"t": "cell", "name": "Amitryptylina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (**silnie**) i 5-HT (**silnie**), słabo działa na wychwyt D", "ANT: M (bardzo silnie), H1 (silnie), α1, 5-HT2"], "y": false}, {"t": "cell", "name": "Amitryptylina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne, uspokajające, p/bólowe", "stosunek hamowania NA/5-HT = 0,91 (nieselektywny, wykład)", "wykład (slajd 42): lek o słabszym działaniu p/lękowym i umiarkowanym wpływie na napęd"], "y": false}, {"t": "cell", "name": "Amitryptylina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, zaburzenia lękowe", "**ból neuropatyczny, fibromialgia, przewlekłe bóle (np. głowy), bezsenność**", "zgodnie z aktualnymi wytycznymi klinicznymi amitryptylina zajmuje **kluczowe miejsce w farmakoterapii zespołów bólu przewlekłego i neuropatycznego (25–75 mg/dobę)** oraz profilaktyce pierwotnych bólów głowy (konspekt)", "zapobieganie migrenowym bólom głowy (Lippincott)", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Amitryptylina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – **bardzo silne!!!**; efekt sedacyjny – silny; efekt niepokoju i bezsenności – 0; działanie kardiotoksyczne – silne; spadek ortostatyczny ciśnienia – silny; N/V – 0; wzrost masy ciała – silny; zaburzenia seksualne – słabe; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja · wysokie ryzyko hipotensji ortostatycznej · przyrost masy ciała"], "y": false}, {"t": "cell", "name": "Doksepina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (słabo) i 5-HT (słabo)", "**silne działanie p/histaminowe (H1)**; ANT M"], "y": false}, {"t": "cell", "name": "Doksepina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/lękowe i uspokajające, **słabsze działanie p/depresyjne**", "wykład (slajd 42): lek o wyraźnym działaniu p/lękowym i uspokajającym, bez wyraźniejszego wpływu na napęd psychoruchowy", "**najbardziej uspokajający lek** spośród p/depresyjnych ze względu na działanie blokujące histaminę (Lippincott, pyt. 17.4)"], "y": false}, {"t": "cell", "name": "Doksepina", "col": "NA CO", "sub": "(wskazania)", "a": ["**łagodne zaburzenia depresyjne z lękiem i niepokojem**, depresje i stany lękowe w przebiegu zaburzeń somatycznych, zaburzenia lękowe", "ból neuropatyczny, ból przewlekły, świąd", "**bezsenność** – w małych dawkach; lek najbardziej odpowiedni do leczenia zarówno depresji, jak i bezsenności (Lippincott, pyt. 17.4)", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Doksepina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – silne; efekt sedacyjny – silny; efekt niepokoju i bezsenności – 0; działanie kardiotoksyczne – umiarkowane; spadek ortostatyczny ciśnienia – silny; N/V – 0; wzrost masy ciała – umiarkowany; zaburzenia seksualne – umiarkowane; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja · wysokie ryzyko hipotensji ortostatycznej · przyrost masy ciała"], "y": false}, {"t": "cell", "name": "Dezypramina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje **głównie wychwyt zwrotny NA** (silnie)", "rzadziej niż inne TLPD wywołuje objawy cholinolityczne"], "y": false}, {"t": "cell", "name": "Dezypramina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne i p/lękowe", "**lek o wyraźnym działaniu odhamowującym** → może nasilać lęk, niepokój i powodować bezsenność", "wykład (slajd 42): lek nie wykazujący wyraźniejszego wpływu p/lękowego, podwyższający obniżony napęd psychoruchowy", "stosunek hamowania NA/5-HT = 0,012 (selektywny dla NA, wykład)", "N-demetylowany metabolit imipraminy (Lippincott)"], "y": false}, {"t": "cell", "name": "Dezypramina", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia depresyjne (zwłaszcza z obniżonym napędem psychoruchowym)**", "zespoły bólowe (ból neuropatyczny)", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Dezypramina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – słabe; efekt sedacyjny – 0; efekt niepokoju i bezsenności – umiarkowany; działanie kardiotoksyczne – umiarkowane; spadek ortostatyczny ciśnienia – słabe; N/V – 0; wzrost masy ciała – słabe; zaburzenia seksualne – 0; obniżenie progu drgawkowego – słabe"], "y": false}, {"t": "cell", "name": "Imipramina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (**silnie**) i 5-HT (umiarkowanie)", "ANT: M, α1, H1, 5-HT2"], "y": false}, {"t": "cell", "name": "Imipramina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne i p/lękowe", "**lek prototypowy TLPD** (Lippincott)", "stosunek hamowania NA/5-HT = 0,65 (nieselektywny, wykład); Lippincott (ryc. 17.2): NA +++ / 5-HT ++++", "wykład (slajd 42): lek o słabszym działaniu p/lękowym i umiarkowanym wpływie na napęd"], "y": false}, {"t": "cell", "name": "Imipramina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, zaburzenia lękowe, bezsenność", "ból neuropatyczny, ból przewlekły", "**moczenie nocne u dzieci** – alternatywa dla desmopresyny lub alarmów wybudzeniowych (Lippincott)", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Imipramina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – umiarkowane; efekt sedacyjny – słaby; efekt niepokoju i bezsenności – umiarkowany; działanie kardiotoksyczne – umiarkowane; spadek ortostatyczny ciśnienia – umiarkowany; N/V – 0; wzrost masy ciała – umiarkowany; zaburzenia seksualne – słabe; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja · wysokie ryzyko hipotensji ortostatycznej · przyrost masy ciała", "**wiąże się z wysokim ryzykiem ortostazy u osób w podeszłym wieku i należy jej unikać** ze względu na profil DN i ryzyko upadków (Lippincott, pyt. 17.6)"], "y": false}, {"t": "cell", "name": "Nortryptylina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (**silnie**) i 5-HT (słabo)", "Lippincott (ryc. 17.2): NA ++++ / 5-HT ++"], "y": false}, {"t": "cell", "name": "Nortryptylina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne i p/lękowe", "wykład (slajd 42): lek nie wykazujący wyraźniejszego wpływu p/lękowego, podwyższający obniżony napęd psychoruchowy", "N-demetylowany metabolit amitryptyliny (Lippincott)"], "y": false}, {"t": "cell", "name": "Nortryptylina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, lękowe, bezsenność", "zespoły bólowe (ból neuropatyczny)", "dawkowanie: 75–200 mg/d"], "y": false}, {"t": "cell", "name": "Nortryptylina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – słabe; efekt sedacyjny – słaby; efekt niepokoju i bezsenności – słaby; działanie kardiotoksyczne – słabe; spadek ortostatyczny ciśnienia – słaby; N/V – 0; wzrost masy ciała – słabe; zaburzenia seksualne – słabe; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja"], "y": false}, {"t": "cell", "name": "Amoksapina #", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA (**silnie**) i 5-HT (słabo)", "**ANT rec. 5-HT2A i D2** (konspekt, Lippincott)"], "y": false}, {"t": "cell", "name": "Amoksapina #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne i **p/psychotyczne**", "czynny metabolit loksapiny (patrz tabelka – neuroleptyki)"], "y": false}, {"t": "cell", "name": "Amoksapina #", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, **w tym z zaburzeniami psychotycznymi**", "zaburzenia lękowe, bezsenność, ból neuropatyczny", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Amoksapina #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN:** dodatkowo ze względu na antagonizm D2 → może powodować **objawy parkinsonowskie, akatyzję** (konspekt)", "**DN (konspekt):** działanie cholinolityczne – silne; efekt sedacyjny – 0; efekt niepokoju i bezsenności – umiarkowany; działanie kardiotoksyczne – słabe; spadek ortostatyczny ciśnienia – słaby; N/V – 0; wzrost masy ciała – słaby; zaburzenia seksualne – słabe; obniżenie progu drgawkowego – umiarkowane", "Lippincott (ryc. 17.10): sedacja"], "y": false}, {"t": "cell", "name": "Trimipramina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny NA (słabo) i 5-HT (słabo)", "y": false}, {"t": "cell", "name": "Trimipramina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "stosunek hamowania NA/5-HT = 0,2 (nieselektywny, wykład)", "wykład (slajd 42): lek o wyraźnym działaniu p/lękowym i uspokajającym, bez wyraźniejszego wpływu na napęd psychoruchowy"], "y": false}, {"t": "cell", "name": "Trimipramina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Trimipramina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN (konspekt):** działanie cholinolityczne – umiarkowane; efekt sedacyjny – silny; efekt niepokoju i bezsenności – 0; działanie kardiotoksyczne – umiarkowane; spadek ortostatyczny ciśnienia – umiarkowany; N/V – 0; wzrost masy ciała – umiarkowany; zaburzenia seksualne – słabe; obniżenie progu drgawkowego – słabe", "Lippincott (ryc. 17.10): sedacja · przyrost masy ciała"], "y": false}, {"t": "cell", "name": "Protryptylina #", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny NA (selektywnie)", "y": false}, {"t": "cell", "name": "Protryptylina #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "TLPD – amina drugorzędowa (Lippincott)", "y": false}, {"t": "cell", "name": "Protryptylina #", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia depresyjne", "y": false}, {"t": "cell", "name": "Protryptylina #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "Lippincott (ryc. 17.10): sedacja", "y": false}]}, {"title": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT (SNRI) – BEZ DZIAŁANIA RECEPTOROWEGO", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NA I 5-HT (SNRI) – BEZ DZIAŁANIA RECEPTOROWEGO", "blocks": [{"h": null, "items": ["Duloksetyna", "Milnacypran", "Lewomilnacypran #", "Wenlafaksyna", "Deswenlafaksyna #"]}], "n": 5}, {"t": "cell", "name": "Cechy wspólne SNRI", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamują wychwyt zwrotny zarówno 5-HT, jak i NA (Lippincott, ryc. 17.5)", "**w przeciwieństwie do TLPD nie wykazują wielkiej aktywności na receptorach α-adrenergicznych, muskarynowych lub histaminowych** → wywołują mniej DN (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SNRI", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["dzięki podwójnemu hamowaniu wychwytu zwrotnego 5-HT i NA, zarówno SNRI, jak i TLPD mogą skutecznie **łagodzić ból** (Lippincott)", "depresji często towarzyszy przewlekły ból pleców i mięśni, wobec których SSRI są mało skuteczne – ból ten jest częściowo modulowany przez szlaki 5-HT i NA w OUN (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SNRI", "col": "NA CO", "sub": "(wskazania)", "a": ["depresja; zaburzenia lękowe", "**zespoły bólowe:** obwodowa neuropatia cukrzycowa, neuralgia popółpaścowa, fibromialgia i ból w odcinku lędźwiowo-krzyżowym (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SNRI", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["niektóre DN podobne do tych wywoływanych przez SSRI, w tym **nudności i dysfunkcje seksualne**; mogą również wystąpić **zawroty głowy i diaforeza** (Lippincott)", "**istnieje ryzyko zespołu odstawienia, jeśli podawanie SNRI zostanie nagle przerwane** (Lippincott)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe – duloksetyna, lewomilnacypran#, wenlafaksyna, deswenlafaksyna#"], "y": true}, {"t": "cell", "name": "Duloksetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny NA i 5-HT; **słabo** hamuje zwrotny wychwyt D", "y": false}, {"t": "cell", "name": "Duloksetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "Lippincott (ryc. 17.2): NA ++++ / 5-HT ++++ – hamuje wychwyt w **każdej dawce**", "**PK:** intensywnie metabolizowana w wątrobie do nieaktywnych metabolitów; **nie powinna być ordynowana u pacjentów z zaburzeniami czynności wątroby** (Lippincott)"], "y": false}, {"t": "cell", "name": "Duloksetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, zaburzenia lękowe uogólnione (GAD) i inne zaburzenia lękowe", "**ból neuropatyczny** (np. w obwodowej neuropatii cukrzycowej), przewlekły ból mięśniowo-szkieletowy, fibromialgia", "**wysiłkowe nietrzymanie moczu**", "wskazana w każdym stanie chorobowym: depresja + lęk uogólniony + nerwoból cukrzycowy (Lippincott, pyt. 17.10)"], "y": false}, {"t": "cell", "name": "Duloksetyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["częste DN ze strony przewodu pokarmowego, w tym **nudności i zaparcia**; suchość w ustach, bezsenność, zawroty głowy, ospałość, pocenie się, zaburzenia funkcji seksualnych (Lippincott)", "**może zwiększać ciśnienie krwi lub częstość akcji serca** (Lippincott)", "**INT:** umiarkowany inhibitor CYP2D6 – może zwiększać stężenie leków metabolizowanych przez ten szlak, np. leków przeciwpsychotycznych (Lippincott)"], "y": false}, {"t": "cell", "name": "Milnacypran", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA i 5-HT", "**słaby niekompetencyjny ANT receptora NMDA**"], "y": false}, {"t": "cell", "name": "Milnacypran", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "stosunek hamowania NA/5-HT = 2,0 (nieselektywny, wykład)", "stosowany w zespołach depresyjnych o różnych przyczynach, w tym endogennych (wykład)", "↓ gęstości receptorów 5-HT2 (zmiany adaptacyjne, wykład)"], "y": false}, {"t": "cell", "name": "Milnacypran", "col": "NA CO", "sub": "(wskazania)", "a": ["**ból neuropatyczny, przewlekłe zespoły bólowe, fibromialgia**", "zaburzenia depresyjne", "dawkowanie: 100–200 mg/d"], "y": false}, {"t": "cell", "name": "Milnacypran", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** zawroty i bóle głowy, wzmożona potliwość, nudności, zaparcia, niepokój, zaburzenie oddawania moczu", "**przy przedawkowaniu przeważają objawy serotoninergiczne:** m.in. nudności i wymioty (konspekt)"], "y": false}, {"t": "cell", "name": "Lewomilnacypran #", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny NA i 5-HT", "y": false}, {"t": "cell", "name": "Lewomilnacypran #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**enancjomer milnacypranu** (starszego SNRI stosowanego w leczeniu depresji w Europie i fibromialgii w Stanach Zjednoczonych) (Lippincott)", "**PK:** metabolizowany głównie przez **CYP3A4**"], "y": false}, {"t": "cell", "name": "Lewomilnacypran #", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia depresyjne", "y": false}, {"t": "cell", "name": "Lewomilnacypran #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["profil działań niepożądanych podobny do profilu innych SNRI i obejmuje **mdłości, ból głowy i suchość w ustach** (Lippincott)", "**INT:** induktory lub inhibitory CYP3A4 mogą zmienić jego aktywność (Lippincott)"], "y": false}, {"t": "cell", "name": "Wenlafaksyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny NA i 5-HT; **słaby inhibitor wychwytu zwrotnego D**", "inhibitor wychwytu 5-HT, a **w średnich i większych dawkach** inhibitor wychwytu NA (Lippincott)"], "y": false}, {"t": "cell", "name": "Wenlafaksyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne; **wykazane działanie anksjolityczne** (wykład)", "stosunek hamowania NA/5-HT = 5,38 (nieselektywny, wykład); Lippincott (ryc. 17.2): NA ++ / 5-HT ++++", "**obecnie jeden z najskuteczniejszych leków p/depresyjnych** (konspekt)", "**PK:** w minimalnym stopniu hamuje izoenzymy CYP450 i jest substratem izoenzymu CYP2D6 (Lippincott)"], "y": false}, {"t": "cell", "name": "Wenlafaksyna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne i lękowe (różnego typu zespoły depresyjne oraz lęk uogólniony)", "zespoły bólowe (napięciowe bóle głowy)", "uważana za właściwą w leczeniu depresji u osób starszych – **brak antagonizmu receptora α1**, bardzo niewielki wpływ na obniżenie ciśnienia krwi (Lippincott, pyt. 17.6)", "dawkowanie: 150–300 mg/d"], "y": false}, {"t": "cell", "name": "Wenlafaksyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** zawroty głowy, nadmierna senność lub bezsenność, drżenia mięśniowe, zaparcia, nudności, wymioty, zaburzenia rytmu serca, zaburzenia potencji (konspekt)", "najczęstsze DN wg Lippincotta: mdłości, bóle głowy, zaburzenia seksualne, zawroty głowy, bezsenność, uspokojenie i zaparcia", "**w przypadku dużych dawek może wzrosnąć ciśnienie krwi i częstość akcji serca** – wenlafaksyna częściej powoduje wzrost ciśnienia krwi (nie niedociśnienie) (Lippincott)"], "y": false}, {"t": "cell", "name": "Deswenlafaksyna #", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny NA i 5-HT", "y": false}, {"t": "cell", "name": "Deswenlafaksyna #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**aktywny, demetylowany metabolit wenlafaksyny** (konspekt, Lippincott)", "aktywność kliniczna i profil działań niepożądanych podobne do tych obserwowanych dla wenlafaksyny (Lippincott)"], "y": false}, {"t": "cell", "name": "Deswenlafaksyna #", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia depresyjne", "y": false}, {"t": "cell", "name": "Deswenlafaksyna #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak wenlafaksyna; Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe", "y": false}]}, {"title": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I DOPAMINY", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE NIESELEKTYWNIE WYCHWYT ZWROTNY NA I DOPAMINY", "blocks": [{"h": null, "items": ["Bupropion"]}], "n": 1}, {"t": "cell", "name": "Bupropion", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny **NA i D** (słaby inhibitor obu)", "**nie wpływa na wychwyt 5-HT, nie hamuje MAO oraz nie działa cholinolitycznie** (wykład)"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne; **zmniejszenie objawów zespołu abstynencji po zaprzestaniu palenia**", "skutecznie zmniejsza głód nikotynowy i łagodzi objawy odstawienia nikotyny u pacjentów próbujących rzucić palenie – potencjalnie poprzez zmniejszenie pobudzającego działania nikotyny na nikotynowe receptory acetylocholinowe (Lippincott)", "**PK:** metabolizowany przez **CYP2B6** i obarczony **niewielkim ryzykiem interakcji lek–lek**, mając na uwadze fakt, że istnieje tylko kilka środków, które hamują/indukują ten enzym (Lippincott)"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne", "**uzależnienie od nikotyny**", "zespół nadpobudliwości psychoruchowej z deficytem uwagi (ADHD)", "**zaburzenia seksualne** – rekomendowany u pacjentów aktywnych seksualnie, obawiających się dysfunkcji seksualnych wywoływanych przez inne leki p/depresyjne oraz u pacjentów ze zwiększonym łaknieniem i obawą przed przyrostem masy ciała → sprzyja redukcji masy ciała (konspekt)", "**lek I rzutu** przy obecności określonych fenotypów klinicznych (anhedonia, zahamowanie, ryzyko dysfunkcji seksualnych) (konspekt)", "zahamowanie, apatia, brak motywacji, wycofanie społeczne; depresja atypowa (hipersomnia, hiperfagia); depresja sezonowa (+ fototerapia) (wykład, slajd 67)", "dawkowanie: 300–450 mg/d"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN:** działanie pobudzające – niepokój, pobudzenie, bezsenność; **ryzyko napadów drgawkowych** (zależnie od dawki obniża próg drgawkowy); jadłowstręt (konspekt)", "**bezwzględne P/W u pacjentów z padaczką lub z wywiadem napadów drgawkowych** (konspekt); nie powinno się stosować u pacjentów z ryzykiem wystąpienia drgawek, w tym z zaburzeniami elektrolitowymi lub **z anoreksją lub bulimią w wywiadzie** (Lippincott)", "suchość w ustach, pocenie się, nerwowość, drżenie (Lippincott)", "**dysfunkcje seksualne występują rzadko** (Lippincott)", "wykład: ze względu na wpływ dopaminergiczny może powodować narastanie lęku i niepokoju, podniecenie ruchowe, zaostrzenie objawów psychotycznych", "Lippincott (ryc. 17.10): bezsenność"], "y": false}]}, {"title": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY SEROTONINY (SSRI)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY SEROTONINY (SSRI)", "blocks": [{"h": null, "items": ["Citalopram", "Escitalopram", "Sertralina", "Fluoksetyna", "Fluwoksamina", "Paroksetyna"]}], "n": 6}, {"t": "cell", "name": "Cechy wspólne SSRI", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**blokowanie wychwytu zwrotnego 5-HT przez transporter SERT** na presynaptycznym końcu aksonu → ↑ stężenia 5-HT w przestrzeni synaptycznej → ↑ przekaźnictwa serotoninergicznego", "**hamują funkcję autoreceptorów typu 5-HT1A** → zahamowanie wychwytu doneuronalnego 5-HT i osłabienie funkcji autoreceptorów prowadzi do nasilenia funkcji układu serotoninergicznego (konspekt)", "wykazują **znacznie większą selektywność** w stosunku do transportera 5-HT w porównaniu z selektywnością wobec transportera NA (Lippincott)", "**niewielka aktywność blokująca receptory M, α-adrenergiczne i H1** → nie wykazują wyraźnego działania cholinolitycznego, p/histaminowego i kardiotoksycznego (wykład)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SSRI", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**efekt poprawy nastroju – po co najmniej 2 tyg. stosowania, pełne działanie p/depresyjne po 12 tyg.** (konspekt, Lippincott)", "mechanizm opóźnionego działania (wykład, slajd 54): niski poziom 5-HT → kompensacyjny ↑ liczby receptorów 5-HT → po podaniu SSRI blokada wychwytu → ↑ poziomu 5-HT → kompensacyjne ↓ liczby i desensytyzacja autoreceptorów 5-HT1A → ↑ uwalniania 5-HT z aksonów → ↓ liczby receptorów postsynaptycznych → zmniejszają się działania niepożądane", "**SSRI zastąpiły TLPD i IMAO jako leki z wyboru w leczeniu depresji**, m.in. dlatego że są stosunkowo bezpieczne, jeśli zostaną podane w nadmiernej dawce (Lippincott)", "**PK:** wszystkie dobrze wchłaniane p.o., Tmax 2–8 h; pokarm ma niewielki wpływ na wchłanianie (z wyjątkiem **sertraliny**, u której pokarm zwiększa wchłanianie); T½ 16–36 h; metabolizm CYP450", "**fluoksetyna** różni się znacznie dłuższym T½ (50 h), a T½ jej aktywnego metabolitu S-norfluoksetyny wynosi średnio 10 dni (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SSRI", "col": "NA CO", "sub": "(wskazania)", "a": ["**depresja – główne wskazanie**", "skuteczne w leczeniu wielu innych zaburzeń psychicznych: zaburzenie obsesyjno-kompulsyjne, zespół lęku napadowego, zespół lęku uogólnionego, zespół stresu pourazowego, zespół lęku społecznego, zespół dysforyczny przedmiesiączkowy i **żarłoczność psychiczna (bulimia – tylko fluoksetyna jest zatwierdzona)** (Lippincott)", "**chorzy z objawami zespołu niedoboru serotoniny** (depresja skojarzona z lękiem, lękiem napadowym, fobią, zespołem stresu pourazowego, natręctwami, czynnościami przymusowymi, zaburzeniami odżywiania) mogą lepiej zareagować na antydepresanty serotoninergiczne (wykład, slajd 55)", "**fluoksetyna, sertralina i fluwoksamina** są zatwierdzone do stosowania u dzieci w leczeniu zaburzeń obsesyjno-kompulsyjnych; **fluoksetyna i escitalopram**, wraz z niektórymi TLPD, są zatwierdzone do leczenia depresji u pacjentów pediatrycznych (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne SSRI", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN (konspekt):** zaburzenia żołądkowo-jelitowe (nudności, wymioty, biegunki, niestrawność, zaburzenia połykania, zmiana smaku); niepokój, pobudzenie, bezsenność, lęk; bóle i zawroty głowy, senność; **zaburzenia funkcji seksualnych** (osłabienie popędu płciowego, opóźnienie lub brak ejakulacji, brak orgazmu); zmniejszenie apetytu oraz anoreksja", "wykład (slajd 57): spadek łaknienia – spadek masy ciała, akatyzja, zmęczenie, wysypki skórne", "Lippincott: bóle głowy, pocenie się, **hiponatremia**, osłabienie i zmęczenie, zmiany masy ciała, zaburzenia snu oraz **wydłużenie odstępu QT**", "**zaburzenia snu:** paroksetyna i fluwoksamina działają raczej uspokajająco i mogą pomóc pacjentom, którzy mają trudności z zasypianiem; pacjenci zmęczeni lub skarżący się na nadmierną senność mogą odnieść korzyści, stosując bardziej aktywujące SSRI – **fluoksetynę lub sertralinę** (Lippincott)", "**zaburzenia seksualne:** utrata libido, opóźniony wytrysk i anorgazmia występują **często**; [SSRI są uważane za strategię pierwszego rzutu w leczeniu przedwczesnego wytrysku] (Lippincott)", "**przedawkowanie:** zwykle nie powoduje zaburzeń rytmu serca, **z wyjątkiem citalopramu**, który może powodować wydłużenie odstępu QT; mogą wystąpić drgawki (Lippincott)", "**zespół odstawienia** – zwłaszcza leki o krótszym T½ i aktywnym metabolicie; najniższe ryzyko – fluoksetyna", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe – wszystkie SSRI; sedacja – fluwoksamina, paroksetyna; bezsenność – fluoksetyna, sertralina"], "y": true}, {"t": "cell", "name": "Citalopram", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**słaby ANT rec. histaminowych H1**"], "y": false}, {"t": "cell", "name": "Citalopram", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "**lek o zrównoważonym profilu działania p/depresyjnego** (wykład)", "**może wzmagać lęk i niepokój**; stosowany w depresjach bez objawów psychotycznych o nasileniu łagodnym i umiarkowanym (wykład)", "stosunek hamowania NA/5-HT = 1500 – **najbardziej selektywny dla 5-HT** (wykład)"], "y": false}, {"t": "cell", "name": "Citalopram", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, przedmiesiączkowe zaburzenia dysforyczne, zaburzenia obsesyjno-kompulsyjne", "lęk paniczny, agorafobia, zaburzenia lękowe uogólnione, zespół stresu pourazowego, lęk społeczny (fobia społeczna)", "dawkowanie: 20–40 mg/d"], "y": false}, {"t": "cell", "name": "Citalopram", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** zależnie od dawki **wydłuża odstęp QT w EKG** → **P/W** u pacjentów ze stwierdzonym wrodzonym lub nabytym wydłużeniem odstępu QT oraz w połączeniu z innymi lekami wydłużającymi QT (konspekt)", "citalopram częściej powoduje wydłużenie odstępu QT w porównaniu z innymi SSRI → pacjenci, którzy nie tolerują jednego inhibitora, mogą tolerować inny (Lippincott)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe"], "y": false}, {"t": "cell", "name": "Escitalopram", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamuje wychwyt zwrotny 5-HT", "y": false}, {"t": "cell", "name": "Escitalopram", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne – **podobnie jak citalopram**", "**czysty S-enancjomer citalopramu** (Lippincott)"], "y": false}, {"t": "cell", "name": "Escitalopram", "col": "NA CO", "sub": "(wskazania)", "a": ["jak citalopram: zaburzenia depresyjne, przedmiesiączkowe zaburzenia dysforyczne, OCD, lęk paniczny, agorafobia, GAD, zespół stresu pourazowego, fobia społeczna", "**zatwierdzony do stosowania u młodzieży** – lek I wyboru u nastolatki z dużą depresją i próbami samobójczymi w wywiadzie, pod ścisłą obserwacją (Lippincott, pyt. 17.7)", "uważany za właściwy w leczeniu depresji u osób starszych – brak antagonizmu rec. α1 (Lippincott)", "dawkowanie: 20–40 mg/d"], "y": false}, {"t": "cell", "name": "Escitalopram", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** jak citalopram – zależnie od dawki **wydłuża odstęp QT w EKG**; **P/W** u pacjentów z wydłużeniem odstępu QT oraz w połączeniu z innymi lekami wydłużającymi QT (konspekt)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe"], "y": false}, {"t": "cell", "name": "Sertralina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**wiązanie z receptorami sigma 1 (σ1)**"], "y": false}, {"t": "cell", "name": "Sertralina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "**lek o zrównoważonym profilu działania** – stosowany w depresjach bez objawów psychotycznych o łagodnym nasileniu (wykład)", "**SSRI bez znaczącego częściowego agonizmu 5-HT1A** (Lippincott, pyt. 17.3)", "jeden z bardziej **aktywujących** SSRI – korzystny u pacjentów zmęczonych lub z nadmierną sennością (Lippincott)", "**PK:** pokarm zwiększa jej wchłanianie (jedyny SSRI) (Lippincott)"], "y": false}, {"t": "cell", "name": "Sertralina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, zaburzenia lękowe", "zatwierdzona do stosowania u dzieci w leczeniu OCD (Lippincott)", "dawkowanie: 50–200 mg/d"], "y": false}, {"t": "cell", "name": "Sertralina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa; dysfunkcje seksualne występują często (Lippincott, pyt. 17.1)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe · bezsenność"], "y": false}, {"t": "cell", "name": "Fluoksetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**ANT rec. 5-HT2C**"], "y": false}, {"t": "cell", "name": "Fluoksetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "**lek prototypowy SSRI** (Lippincott)", "**może nasilać lęk i niepokój, zwłaszcza na początku leczenia; może powodować również akatyzję** → stosowany głównie w depresjach bez lęku i niepokoju (wykład)", "**PK: najdłuższy T½ – 50 h**, a aktywnego metabolitu S-norfluoksetyny średnio **10 dni**; silny inhibitor **CYP2D6** i **CYP2C19** (Lippincott)", "Lippincott (ryc. 17.2): NA 0 / 5-HT ++++"], "y": false}, {"t": "cell", "name": "Fluoksetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, przedmiesiączkowe zaburzenia dysforyczne, OCD, lęk paniczny, agorafobia, GAD, zespół stresu pourazowego, fobia społeczna", "**bulimia – jedyny SSRI zatwierdzony w tym wskazaniu** (konspekt, Lippincott)", "zatwierdzona u dzieci w OCD i depresji (Lippincott)", "**terapia skojarzona z olanzapiną – zatwierdzona w depresji lekoopornej i dwubiegunowej** (Lippincott)", "dawkowanie: 20–40 mg/d"], "y": false}, {"t": "cell", "name": "Fluoksetyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa; **najniższe ryzyko zespołu odstawienia** ze względu na długi T½ i aktywny metabolit (Lippincott)", "**INT:** silny inhibitor CYP2D6 i CYP2C19; **należy odstawić co najmniej 6 tyg. przed rozpoczęciem stosowania IMAO** (pozostałe SSRI – 2 tyg.) (Lippincott)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe · bezsenność"], "y": false}, {"t": "cell", "name": "Fluwoksamina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**wiązanie z receptorami sigma 1 (σ1)**"], "y": false}, {"t": "cell", "name": "Fluwoksamina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "**lek wykazujący działanie anksjolityczno-sedatywne** – stosowany w terapii depresji z lękiem i niepokojem (wykład)", "wykład (slajd 42): lek o wyraźnym działaniu p/lękowym i uspokajającym, bez wyraźniejszego wpływu na napęd psychoruchowy", "**PK:** silny inhibitor **CYP1A2** i umiarkowany inhibitor **CYP3A4** (Lippincott)"], "y": false}, {"t": "cell", "name": "Fluwoksamina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia obsesyjno-kompulsyjne, lęk społeczny, zaburzenia depresyjne, lęk paniczny, uogólnione zaburzenia lękowe, zespół stresu pourazowego", "zatwierdzona u dzieci w leczeniu OCD (Lippincott)", "dawkowanie: 100–300 mg/d"], "y": false}, {"t": "cell", "name": "Fluwoksamina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa; działa raczej uspokajająco → może pomóc pacjentom z trudnościami w zasypianiu (Lippincott)", "**INT:** silny inhibitor CYP1A2 i umiarkowany CYP3A4 → ↑ stężenia leków metabolizowanych tymi szlakami (Lippincott)", "Lippincott (ryc. 17.10): sedacja · zaburzenia żołądkowo-jelitowe"], "y": false}, {"t": "cell", "name": "Paroksetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**słabe działanie cholinolityczne** i **hamujące wychwyt zwrotny NA**"], "y": false}, {"t": "cell", "name": "Paroksetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "**lek mogący wykazywać u części leczonych działanie anksjolityczno-sedatywne** – stosowany głównie w depresjach bez objawów psychotycznych (wykład)", "wykład (slajd 42): lek o wyraźnym działaniu p/lękowym i uspokajającym, bez wyraźniejszego wpływu na napęd psychoruchowy", "**PK:** silny inhibitor **CYP2D6** (Lippincott)"], "y": false}, {"t": "cell", "name": "Paroksetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, OCD, lęk paniczny, fobia społeczna, zespół stresu pourazowego, zespół lęku uogólnionego, przedmiesiączkowe zaburzenia dysforyczne", "**zatwierdzona w leczeniu OCD** – SSRI są szczególnie skuteczne w leczeniu zaburzeń obsesyjno-kompulsyjnych (Lippincott, pyt. 17.2)", "dawkowanie: 20–50 mg/d"], "y": false}, {"t": "cell", "name": "Paroksetyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["jak cała grupa; działa raczej uspokajająco (Lippincott)", "**INT:** silny inhibitor CYP2D6", "Lippincott (ryc. 17.10): sedacja · zaburzenia żołądkowo-jelitowe"], "y": false}]}, {"title": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NORADRENALINY (NRI)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT ZWROTNY NORADRENALINY (NRI)", "blocks": [{"h": null, "items": ["Reboksetyna"]}], "n": 1}, {"t": "cell", "name": "Reboksetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje **selektywnie** wychwyt zwrotny NA", "**nie wykazuje powinowactwa do receptorów** (wykład)"], "y": false}, {"t": "cell", "name": "Reboksetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne", "stosunek hamowania NA/5-HT = 0,007 – **najbardziej selektywna dla NA** (wykład)"], "y": false}, {"t": "cell", "name": "Reboksetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, paniczne; **zespoły depresyjne o różnej etiologii** (wykład)", "zespół nadpobudliwości psychoruchowej z deficytem uwagi (ADHD)", "zahamowanie, apatia, brak motywacji, wycofanie społeczne (wykład, slajd 67)", "dawkowanie: 8–12 mg/d"], "y": false}, {"t": "cell", "name": "Reboksetyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN:** niepokój, pobudzenie, bezsenność (konspekt)", "DN **dużo słabsze** niż leków wykazujących działania receptorowe: zaparcia, bezsenność, tachykardia, drżenia mięśniowe, impotencja, zaburzenia oddawania moczu (wykład)"], "y": false}]}, {"title": "LEKI HAMUJĄCE WYCHWYT SEROTONINY I BLOKUJĄCE RECEPTORY SEROTONINERGICZNE (5-HT2)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE WYCHWYT SEROTONINY I BLOKUJĄCE RECEPTORY SEROTONINERGICZNE (5-HT2)", "blocks": [{"h": null, "items": ["Trazodon", "Nefazodon #"]}], "n": 2}, {"t": "cell", "name": "Trazodon", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT (słabo)", "**ANT: 5-HT2A, α1** (konspekt); silne właściwości blokujące **H1** (Lippincott)"], "y": false}, {"t": "cell", "name": "Trazodon", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie **p/depresyjne i p/lękowe**, uspokajające", "**zależność od dawki (konspekt):** w dawkach **25–100 mg/dobę** (dawka nasenna/sedatywna) → przeważa antagonizm do rec. 5-HT2A oraz H1 i α1-adrenergicznych; **brak istotnego hamowania wychwytu zwrotnego 5-HT**; w dawkach **150–300 mg/dobę** (dawka p/depresyjna) → pojawia się blokada transportera 5-HT (SERT) warunkująca pełne działanie p/depresyjne", "powszechnie stosowany **poza wskazaniami** do leczenia bezsenności (Lippincott)"], "y": false}, {"t": "cell", "name": "Trazodon", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, zaburzenia lękowe, **bezsenność**", "**rekomendowany jako lek p/depresyjny I rzutu**, ze szczególnym uwzględnieniem pacjentów, u których dominują: bezsenność, lęk lub anhedonia, a także u osób doświadczających dysfunkcji seksualnych po SSRI; dawka terapeutyczna 75–300 mg/dobę (konspekt)", "**w niskich dawkach (zwykle 25–100 mg na noc)** – zalecany w leczeniu bezsenności przewlekłej, szczególnie z zaburzeniami utrzymania snu (zmniejsza liczbę nocnych wybudzeń i wydłuża sen głęboki/wolnofalowy) **bez istotnego potencjału uzależniającego** (konspekt)", "agitacja, niepokój; zespoły bólowe; zaburzenia funkcji seksualnych (wykład, slajd 67)", "dawkowanie: 75–300 mg/d"], "y": false}, {"t": "cell", "name": "Trazodon", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN:** sedacja, hipotonia, **priapizm**, zależne od dawki wydłużenie odstępu QT (konspekt)", "**INT:** zespół serotoninowy przy stosowaniu z innymi lekami o działaniu serotoninergicznym (np. SSRI, inhibitory MAO) (konspekt)", "**PK:** metabolizowany przez **CYP3A4** – trazodon i nefazodon# wchodzą we wzajemne interakcje (Lippincott)", "łagodny do umiarkowanego antagonizm receptora α1 → ortostaza i zawroty głowy; mdłości i suchość w ustach (Lippincott)", "Lippincott (ryc. 17.10): sedacja"], "y": false}, {"t": "cell", "name": "Nefazodon #", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["słaby inhibitor wychwytu zwrotnego 5-HT i NA", "**ANT postsynaptycznego rec. 5-HT2A**; łagodny do umiarkowanego **ANT α1**", "wykład: nie wykazuje istotnego działania na receptory α2 i β-adrenergiczne, dopaminergiczne, histaminowe, cholinergiczne i 5-HT1A; słaby wpływ blokujący receptory α1"], "y": false}, {"t": "cell", "name": "Nefazodon #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działa uspokajająco, prawdopodobnie ze względu na silne właściwości blokujące receptor histaminowy H1 (Lippincott)"], "y": false}, {"t": "cell", "name": "Nefazodon #", "col": "NA CO", "sub": "(wskazania)", "a": "zaburzenia depresyjne", "y": false}, {"t": "cell", "name": "Nefazodon #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**ryzyko hepatotoksyczności** (Lippincott)", "ortostaza i zawroty głowy, mdłości, suchość w ustach", "**INT: silny inhibitor CYP3A4** – wchodzi we wzajemne interakcje z trazodonem (Lippincott)", "Lippincott (ryc. 17.10): sedacja · zaburzenia żołądkowo-jelitowe"], "y": false}]}, {"title": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT SEROTONINY I MODULUJĄCE RECEPTORY SEROTONINERGICZNE", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE SELEKTYWNIE WYCHWYT SEROTONINY I MODULUJĄCE RECEPTORY SEROTONINERGICZNE", "blocks": [{"h": null, "items": ["Wortioksetyna", "Wilazodon #"]}], "n": 2}, {"t": "cell", "name": "Wortioksetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**blokowanie pompy wychwytu zwrotnego 5-HT (SERT)**", "**pełny AGO 5-HT1A** · **cz. AGO 5-HT1B** · **ANT 5-HT1D, 5-HT3, 5-HT7**"], "y": false}, {"t": "cell", "name": "Wortioksetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zwiększa uwalnianie neuroprzekaźników – 5-HT, NA, DA, histaminy, glutaminianu, acetylocholiny; zmniejsza uwalnianie kwasu γ-aminomasłowego (GABA)", "**AGO 5-HT1A:** presynaptycznie – działanie p/depresyjne; postsynaptycznie – **obniża dysfunkcje seksualne**", "**cz. AGO 5-HT1B:** nasila uwalnianie 5-HT, acetylocholiny i histaminy · **ANT 5-HT1D:** nasila działanie prokognitywne", "**ANT 5-HT3:** nasila aktywność noradrenergiczną, acetylocholinergiczną i glutaminianergiczną, prokognitywne i p/depresyjne działanie, **redukuje nudności i wymioty** spowodowane hamowaniem wychwytu zwrotnego 5-HT · **ANT 5-HT7:** zmniejsza bezsenność, działanie p/depresyjne i prokognitywne", "**PK:** metabolizowana głównie przez **CYP2D6** (Lippincott)"], "y": false}, {"t": "cell", "name": "Wortioksetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**ogólne efekty farmakologiczne:** p/depresyjne, p/lękowe, **poprawa funkcji poznawczych, uczenia się i pamięci**", "zaburzenia depresyjne, zaburzenia lękowe uogólnione (GAD), **zaburzenia funkcji poznawczych w depresji**", "zaburzenia funkcji seksualnych (wykład, slajd 67)"], "y": false}, {"t": "cell", "name": "Wortioksetyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** nudności, zaparcia i dysfunkcje seksualne, które mogą być związane z mechanizmami serotoninergicznymi (Lippincott)", "**INT:** zaleca się zmniejszenie dawki, gdy jest podawana jednocześnie z silnymi inhibitorami CYP2D6 (Lippincott)", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe"], "y": false}, {"t": "cell", "name": "Wilazodon #", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamuje wychwyt zwrotny 5-HT", "**cz. AGO rec. 5-HT1A**"], "y": false}, {"t": "cell", "name": "Wilazodon #", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne – oprócz hamowania wychwytu zwrotnego 5-HT działanie może być związane z agonizmem receptora 5-HT1A (Lippincott, pyt. 17.3)", "**PK:** metabolizowany przez **CYP3A4** (Lippincott)"], "y": false}, {"t": "cell", "name": "Wilazodon #", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne", "**nie jest zatwierdzony do stosowania u młodzieży** (Lippincott, pyt. 17.7)"], "y": false}, {"t": "cell", "name": "Wilazodon #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["spektrum DN podobne do tego generowanego przez SSRI: **mdłości, biegunka, dysfunkcje seksualne i zawroty głowy** (Lippincott)", "**ryzyko wystąpienia zespołu odstawienia**, gdy terapia zostanie nagle przerwana (Lippincott)", "**INT:** silne inhibitory lub induktory CYP3A4 mogą znacząco zwiększać lub zmniejszać jego stężenie", "Lippincott (ryc. 17.10): zaburzenia żołądkowo-jelitowe"], "y": false}]}, {"title": "LEKI HAMUJĄCE WYCHWYT NA I BLOKUJĄCE RECEPTORY ADRENERGICZNE", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI HAMUJĄCE WYCHWYT NA I BLOKUJĄCE RECEPTORY ADRENERGICZNE", "blocks": [{"h": null, "items": ["Maprotylina"]}], "n": 1}, {"t": "cell", "name": "Maprotylina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamowanie wychwytu zwrotnego NA", "**blokowanie rec. α1 i α2**; duże powinowactwo do rec. α1 i α2, zaś **słaby wpływ na receptory histaminowe i cholinergiczne** (wykład)"], "y": false}, {"t": "cell", "name": "Maprotylina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie p/depresyjne, **wzrost napędu psychoruchowego**, działanie uspokajające", "działanie „odhamowujące” i p/depresyjne **podobne do imipraminy** (wykład)", "stosunek hamowania NA/5-HT = 0,01 – selektywna dla NA (wykład)", "lek tetracykliczny, zaliczany do ogólnej grupy TCA (Lippincott)", "**stosunkowo selektywna w hamowaniu wychwytu zwrotnego NA i nie wykazuje znaczącego częściowego agonizmu 5-HT1A** (Lippincott, pyt. 17.3)"], "y": false}, {"t": "cell", "name": "Maprotylina", "col": "NA CO", "sub": "(wskazania)", "a": ["**epizody ciężkiej depresji**, zaburzenia afektywne dwubiegunowe, zaburzenia depresyjne z obniżonym napędem psychoruchowym", "**stany depresyjne endogenne bez nasilonych cech lęku** (wykład)", "dawkowanie: 100–150 mg/d"], "y": false}, {"t": "cell", "name": "Maprotylina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["DN **rzadsze od TLPD** (wykład)", "Lippincott (ryc. 17.10): sedacja"], "y": false}]}, {"title": "LEKI O DZIAŁANIU RECEPTOROWYM", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI O DZIAŁANIU RECEPTOROWYM", "blocks": [{"h": null, "items": ["Agomelatyna", "Mianseryna", "Mirtazapina"]}], "n": 3}, {"t": "cell", "name": "Agomelatyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**ANT rec. 5-HT2C**", "**AGO rec. melatoninowych MT1 i MT2**"], "y": false}, {"t": "cell", "name": "Agomelatyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["antagonizm 5-HT2C → **wzrost przekaźnictwa NA i D**", "agonizm MT1/MT2 → regulacja rytmu okołodobowego, poprawa snu", "działanie p/depresyjne"], "y": false}, {"t": "cell", "name": "Agomelatyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**epizody ciężkiej depresji z lękiem i zaburzeniami snu**", "zaburzenia lękowe (lęk uogólniony, lęk napadowy, mieszane stany lękowe); bezsenność (wykład, slajd 67)"], "y": false}, {"t": "cell", "name": "Mianseryna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**ANT α2** → nasilenie przekaźnictwa noradrenergicznego", "**nasila przekaźnictwo serotoninergiczne** poprzez receptory α1 w neuronach serotoninergicznych", "**ANT: 5-HT2A, 5-HT2C, 5-HT3, H1** (konspekt); postsynaptyczne 5-HT2, 5-HT1C i 5-HT3 oraz H1 (wykład)"], "y": false}, {"t": "cell", "name": "Mianseryna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie **p/depresyjne, p/lękowe i uspokajające**, poprawa jakości snu", "blokada presynaptycznych rec. α2 → wzmożenie przekaźnictwa noradrenergicznego (wykład)", "**nie wykazuje wyraźniejszego działania cholinolitycznego** (konspekt, wykład)", "↓ gęstości receptorów 5-HT2 (zmiany adaptacyjne, wykład)"], "y": false}, {"t": "cell", "name": "Mianseryna", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, lękowe, **bezsenność**", "**epizody depresyjne o różnych przyczynach** (wykład)", "agitacja, niepokój; bezsenność (wykład, slajd 67)", "dawkowanie: 60–90 mg/d"], "y": false}, {"t": "cell", "name": "Mianseryna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN:** sedacja, wzrost apetytu, przyrost masy ciała, hipotonia (konspekt)", "wykład: senność, hipotonia, **bóle stawów**, przyrost masy ciała, **napady drgawkowe**"], "y": false}, {"t": "cell", "name": "Mirtazapina", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**ANT presynaptycznych rec. α2** (także α2 na neuronach 5-HT)", "**ANT: 5-HT2A, 5-HT2C, 5-HT3, H1**; wzmaga neurotransmisję poprzez **5-HT1A**", "**słaby wpływ na receptory cholinergiczne i histaminowe** (wykład) / silne właściwości antyhistaminowe (Lippincott)"], "y": false}, {"t": "cell", "name": "Mirtazapina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["nasila przekaźnictwo noradrenergiczne i serotoninergiczne za pośrednictwem rec. 5-HT1A → poprzez hamowanie ośrodkowych autoreceptorów i heteroreceptorów α2-adrenergicznych oraz postsynaptycznego blokowania rec. 5-HT2A, 5-HT2C i 5-HT3, H1 (konspekt)", "działanie **sedatywne, p/lękowe, nasenne** (wykład)", "**nie powoduje przeciwmuskarynowych skutków ubocznych, jak TCA, ani nie zaburza funkcji seksualnych, jak SSRI** (Lippincott)", "↓ gęstości receptorów 5-HT2 (zmiany adaptacyjne, wykład)"], "y": false}, {"t": "cell", "name": "Mirtazapina", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, paniczne, zaburzenia lękowe uogólnione (GAD), zespół stresu pourazowego (PTSD)", "**zespoły depresyjne o różnej etiologii, w tym typu melancholicznego** (wykład)", "agitacja, niepokój; bezsenność; zespoły bólowe (napięciowe bóle głowy) (wykład, slajd 67)", "**przydatna u pacjenta z dysfunkcjami seksualnymi po SSRI** – ma niskie ryzyko zaburzeń seksualnych (Lippincott, pyt. 17.1)", "dawkowanie: 15–45 mg/d"], "y": false}, {"t": "cell", "name": "Mirtazapina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN:** nadmierna sedacja, senność, zaparcia, **zwiększenie apetytu i masy ciała**, męczliwość, pobudzenie ruchowe (konspekt, wykład)", "Lippincott (ryc. 17.6): przyrost masy ciała, ospałość, wzmożony apetyt", "Lippincott (ryc. 17.10): sedacja · zaburzenia żołądkowo-jelitowe · przyrost masy ciała"], "y": false}]}, {"title": "INHIBITORY MONOAMINOOKSYDAZY (IMAO)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "INHIBITORY MONOAMINOOKSYDAZY (IMAO)", "blocks": [{"h": null, "items": ["Moklobemid", "Fenelzyna, Tranylcypromina #", "Izokarboksazyd #", "Selegilina"]}], "n": 4}, {"t": "cell", "name": "Cechy wspólne IMAO", "col": "RECEPTOR", "sub": "(na co działa)", "a": "hamowanie aktywności oksydazy monoaminowej (MAO-A i/lub MAO-B)", "y": true}, {"t": "cell", "name": "Cechy wspólne IMAO", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**hamują aktywność oksydazy monoaminowej, zapobiegając rozpadowi neuroprzekaźników: NA i 5-HT** → wzrost przekaźnictwa noradrenergicznego i serotoninergicznego → efekt p/depresyjny (konspekt)", "większość IMAO, takich jak fenelzyna#, tworzy **stabilne kompleksy z enzymem, powodując jego nieodwracalną inaktywację** (Lippincott)", "**chociaż MAO jest w pełni hamowana po kilku dniach leczenia, działanie p/depresyjne IMAO, podobnie jak SSRI, SNRI i TCA, jest opóźnione o kilka tygodni** (Lippincott)", "**selegilina i tranylcypromina# mają działanie pobudzające podobne do amfetaminy** i mogą powodować pobudzenie lub bezsenność (Lippincott)", "**PK:** dobrze wchłaniane p.o.; czas potrzebny do regeneracji enzymu MAO po nieodwracalnej inaktywacji jest różny, ale zwykle następuje **kilka tygodni po zakończeniu** podawania leku (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne IMAO", "col": "NA CO", "sub": "(wskazania)", "a": ["**IMAO są wskazane dla pacjentów z depresją, którzy nie reagują na leczenie lub nie tolerują innych leków p/depresyjnych** (Lippincott)", "**ze względu na ryzyko interakcji między lekami i żywnością, IMAO są uważane za leki ostatniego rzutu** w wielu sytuacjach terapeutycznych (Lippincott)", "zaburzenia depresyjne (atypowa depresja, depresja oporna na leczenie), zaburzenia paniczne i fobia społeczna (konspekt)", "[selegilina jest również stosowana w leczeniu choroby Parkinsona; jest to **jedyny lek p/depresyjny dostępny w systemie transdermalnym**] (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne IMAO", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**efekt tyraminowy („cheese effect”):** tyramina zawarta w dojrzałych serach, mięsach, wątrobie, marynowanych lub wędzonych rybach i czerwonym winie jest normalnie inaktywowana przez MAO-A w jelitach; osoby otrzymujące nieselektywne IMAO nie są w stanie jej rozkładać → tyramina powoduje uwalnianie dużych ilości zmagazynowanych katecholamin → **przełom nadciśnieniowy**: ból głowy w okolicy potylicznej, sztywność karku, tachykardia, mdłości, nadciśnienie, zaburzenia rytmu serca, drgawki i prawdopodobnie udar → pacjentów należy poinstruować, aby unikali pokarmów zawierających tyraminę (Lippincott)", "wykład: pokarmy zawierające aminy o działaniu hipertensyjnym – tyraminę, fenyloetyloaminę (sery żółte, wina czerwone, owoce cytrusowe, soja) mogły wywołać gwałtowny wzrost ciśnienia z niebezpiecznymi następstwami krążeniowymi i mózgowymi", "inne DN: senność, niedociśnienie ortostatyczne, niewyraźne widzenie, suchość w ustach i zaparcia (Lippincott)", "**INT: SSRI nie powinny być podawane jednocześnie z IMAO ze względu na ryzyko wystąpienia zespołu serotoninowego**; zarówno SSRI, jak i IMAO wymagają co najmniej **2-tygodniowego okresu karencji** przed podaniem drugiego typu leku, **z wyjątkiem fluoksetyny, którą należy odstawić co najmniej 6 tyg. przed rozpoczęciem stosowania IMAO** (Lippincott)", "jednoczesne stosowanie IMAO i bezpośrednich lub pośrednich sympatykomimetyków, takich jak **pseudoefedryna**, może wywołać wysokie nadciśnienie (Lippincott)", "Lippincott (ryc. 17.10): wysokie ryzyko hipotensji ortostatycznej – fenelzyna#, tranylcypromina#; bezsenność – selegilina, tranylcypromina#"], "y": true}, {"t": "cell", "name": "Moklobemid", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalny, selektywny inhibitor MAO-A**", "y": false}, {"t": "cell", "name": "Moklobemid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wzrost NA, 5-HT i D → działanie p/depresyjne", "wykład (slajd 42): lek o słabszym działaniu p/lękowym i umiarkowanym wpływie na napęd psychoruchowy"], "y": false}, {"t": "cell", "name": "Moklobemid", "col": "NA CO", "sub": "(wskazania)", "a": ["zaburzenia depresyjne, **fobia społeczna**", "zahamowanie, apatia, brak motywacji, wycofanie społeczne; zaburzenia lękowe; depresja atypowa (hipersomnia, hiperfagia) (wykład, slajd 67)"], "y": false}, {"t": "cell", "name": "Moklobemid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**przewaga selektywnych IMAO nad nieselektywnymi (wykład, slajd 60):** odwracalne blokowanie MAO (efekt krótkotrwały) · blokowanie jednego izoenzymu (rozkładanie tyraminy możliwe) · mniejsza hepatotoksyczność · słabsze inter
