tość blaszek amyloidu beta, **jednak nie ma pewności, czy spowalnia postęp choroby** (Lippincott)"], "y": false}, {"t": "cell", "name": "Adukanumab #", "col": "NA CO", "sub": "(wskazania)", "a": "**w chorobie Alzheimera – podawany dożylnie** (konspekt)", "y": false}, {"t": "cell", "name": "Adukanumab #", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN p/ciał ⇒ ryzyko obrzęku mózgu i krwawienia wewnątrzczaszkowego, bóle głowy, biegunka** (konspekt)", "do objawów ubocznych zaliczają się związane z amyloidem nieprawidłowości w obrazowaniu (ang. **amyloid-related imaging abnormalities, ARIA**), takie jak obrzęk mózgu czy mikrokrwotoki, ponadto bóle głowy i biegunka (Lippincott)"], "y": false}, {"t": "cell", "name": "Lekanemab, Donanemab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**przeciwciała monoklonalne zmniejszające odkładanie β-amyloidu**", "y": false}, {"t": "cell", "name": "Lekanemab, Donanemab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["podobne działanie do adukanumabu – **w trakcie badań klinicznych i oceny bezpieczeństwa** (konspekt)", "**lekanemab** – powoduje umiarkowane spowolnienie postępu zaburzeń poznawczych i zmniejsza ilość amyloidu-beta w mózgu – **spowalnia rozwój choroby Alzheimera o 27%** (wykład)", "wykład wymienia też **gantanerumab**"], "y": false}, {"t": "cell", "name": "Lekanemab, Donanemab", "col": "NA CO", "sub": "(wskazania)", "a": "choroba Alzheimera", "y": false}, {"t": "cell", "name": "Lekanemab, Donanemab", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**najistotniejsze DN p/ciał ⇒ ryzyko obrzęku mózgu i krwawienia wewnątrzczaszkowego, bóle głowy, biegunka** (konspekt)", "y": false}, {"t": "cell", "name": "Leczenie objawów niekognitywnych (wykład, slajd 44)", "col": "NA CO", "sub": "(wskazania)", "a": ["**agresja – karbamazepina**", "**agresja + depresja – citalopram, sertralina** (TLPD p/wskazane)", "**objawy psychotyczne – risperidon, amisulpryd**", "**lęk, bezsenność – BDZ** (ale przymglenie, zab. pamięci), **zolpidem, zaleplon**"], "y": true}, {"t": "cell", "name": "Leczenie objawów niekognitywnych (wykład, slajd 44)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "patrz tabelki – neuroleptyki oraz leki nasenne i przeciwlękowe", "y": true}, {"t": "cell", "name": "Potencjalne leki i profilaktyka (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**potencjalne leki działające przyczynowo (w badaniach klinicznych):** leki przeciwzapalne (IBUPROFEN, INDOMETACYNA) · leki neuroprotekcyjne, czynniki wzrostu neuronów (PROPENTOFILINA – stymuluje uwalnianie NGF, zapobiega degeneracji cholinergicznych neuronów) · leki blokujące kanały Ca (NIMODYPINA) · leki stabilizujące poziom wapnia komórkowego (KARBAMAZEPINA, HYDANTOINA, WALPROINIAN)", "**statyny** – wysoki poziom cholesterolu faworyzuje obróbkę APP przez amyloidogenną β-sekretazę → leki zapobiegające rozwojowi AD", "**antyoksydanty** – wolne rodniki (GLUT, MAO, stan zapalny) uszkadzają neurony → α-TOKOFEROL (witamina E), KWAS ASKORBINOWY (witamina C), inhibitory MAO-B, SELEGILINA", "**estrogeny** – stymulują wzrost neuronów, hamują aktywację kaspaz, działają antyoksydacyjnie, stabilizują homeostazę Ca, nasilają aktywność układu cholinergicznego, hamują patologiczną aktywację rec. NMDA"], "y": true}, {"t": "cell", "name": "Potencjalne leki i profilaktyka (wykład)", "col": "NA CO", "sub": "(wskazania)", "a": ["**profilaktyka (wykład):** zmniejszyć pobieranie kalorii, krótkie głodówki (↑ czynników troficznych, plastyczności neuronów) · aktywność fizyczna · aktywność umysłowa · kawa, czerwone wino, zielona herbata, czosnek", "**„używając intensywnie mózg chronimy go przed chorobami neurodegeneracyjnymi!!!”** (wykład)"], "y": true}]}, {"title": "LEKI STOSOWANE W CHOROBIE HUNTINGTONA", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI STOSOWANE W CHOROBIE HUNTINGTONA", "blocks": [{"h": null, "items": ["Tetrabenazyna, Walbenazyna, Deutetrabenazyna"]}], "n": 1}, {"t": "cell", "name": "Tetrabenazyna, Walbenazyna, Deutetrabenazyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**odwracalne hamowanie pęcherzykowego transportera monoamin typu 2 (VMAT2)**", "y": false}, {"t": "cell", "name": "Tetrabenazyna, Walbenazyna, Deutetrabenazyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["odwracalne hamowanie VMAT2 → **zmniejszenie stężenia neuroprzekaźników (dopamina, noradrenalina, serotonina) w zakończeniach nerwowych i szczelinie synaptycznej** ⇒ hipokineza i zmniejszenie pląsawicy (konspekt, wykład)"], "y": false}, {"t": "cell", "name": "Tetrabenazyna, Walbenazyna, Deutetrabenazyna", "col": "NA CO", "sub": "(wskazania)", "a": "**leczenie choroby Huntingtona** (konspekt)", "y": false}, {"t": "cell", "name": "Tetrabenazyna, Walbenazyna, Deutetrabenazyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**najistotniejsze DN ⇒ głównie wynikające z obniżenia neuroprzekaźników** → depresja, senność, lęk, dezorientacja, parkinsonizm, zmiany zachowania; **obwodowe** – niedociśnienie, zaburzenia przełykania, nudności, wymioty, biegunka lub zaparcia (konspekt, wykład)"], "y": false}]}, {"title": "LEKI NOOTROPOWE I STOSOWANE W ZABURZENIACH KRĄŻENIA MÓZGOWEGO", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI NOOTROPOWE I STOSOWANE W ZABURZENIACH KRĄŻENIA MÓZGOWEGO", "blocks": [{"h": null, "items": ["Piracetam", "Winpocetyna", "Nicergolina", "Pentoksyfilina"]}], "n": 4}, {"t": "cell", "name": "Piracetam", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**działanie metaboliczne w OUN** (pochodna 2-pirolidynonu)", "y": false}, {"t": "cell", "name": "Piracetam", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wpływa na przemiany energetyczne w komórkach OUN, zwiększa wykorzystanie tlenu i glukozy, ułatwia syntezę związków wysokoenergetycznych, zwiększa rezerwę energetyczną, przyspiesza syntezę neuroprzekaźników, nasila metabolizm w neuronach OUN, zwłaszcza w stanach zmniejszonej aktywności, poprawa czynności błon neuronalnych ⇒ **działanie neuroprotekcyjne, działanie p/agregacyjne, poprawa przepływu krwi w naczyniach mózgowych, poprawa funkcji poznawczych (działanie prokognitywne)** (konspekt)"], "y": false}, {"t": "cell", "name": "Piracetam", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia procesów poznawczych (pamięć, myślenie, orientacja, rozumienie, liczenie, zdolność uczenia się, funkcje językowe, zdolność do oceny) wywołanych chorobami mózgu**; zaburzenia dyslektyczne u dzieci → zwiększa szybkość czytania i poprawia proces zapamiętywania; **mioklonia pochodzenia korowego**; zawroty głowy; w leczeniu ostrego udaru niedokrwiennego mózgu, szczególnie u osób z afazją (konspekt)", "**w chorobie Alzheimera → brak skuteczności** (konspekt)"], "y": false}, {"t": "cell", "name": "Piracetam", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**małe ryzyko DN** ⇒ najczęściej wzmożona pobudliwość ruchowa, nerwowość i zwiększenie masy ciała, senność, depresja, osłabienie; przyjmowany w godzinach wieczornych może utrudniać zasypianie (konspekt)"], "y": false}, {"t": "cell", "name": "Winpocetyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**hamowanie (wybiórczy inhibitor) izoenzymu fosfodiesterazy typu 1 (PDE-1)**", "hamowanie wychwytu adenozyny, blokowanie kanałów sodowych, wapniowych oraz rec. **NMDA i AMPA**"], "y": false}, {"t": "cell", "name": "Winpocetyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["poprawa metabolizmu mózgowego → zwiększenie zużycia glukozy i tlenu przez tkankę mózgową, zwiększenie tolerancji komórek mózgu na hipoksję, zwiększenie transportu glukozy; zwiększenie przepływu krwi w mózgu, naczyniach siatkówki, w uchu wewnętrznym; poprawa właściwości reologicznych krwi, hamowanie agregacji płytek krwi, **działanie neuroprotekcyjne i przeciwutleniające** (konspekt)"], "y": false}, {"t": "cell", "name": "Winpocetyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia krążenia mózgowego (np. po udarze niedokrwiennym), przewlekłe zaburzenia krążenia w naczyniówce i siatkówce oka, osłabienie słuchu pochodzenia naczyniowego, choroba Meniere'a i szumy uszne** (konspekt)", "wykład zalicza ją do **alkaloidów barwinka** (winkamina, winpocetyna, winburnina)"], "y": false}, {"t": "cell", "name": "Nicergolina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie (słaby ANT) rec. α-adrenergicznych**", "y": false}, {"t": "cell", "name": "Nicergolina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["rozszerzenie naczyń krwionośnych, głównie mózgowych → poprawa procesów metabolicznych w OUN, dodatkowo **hamowanie agregacji płytek krwi** (konspekt)", "wykład: α-adrenolityk, agonista rec. D, hamuje agregację płytek; zaliczana do **alkaloidów sporyszu** (obok dihydroergotoksyny, dihydroergokryptyny, dihydroergokorniny)"], "y": false}, {"t": "cell", "name": "Nicergolina", "col": "NA CO", "sub": "(wskazania)", "a": "**głównie zaburzenia krążenia mózgowego, otępienie** (konspekt)", "y": false}, {"t": "cell", "name": "Pentoksyfilina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**zmniejszenie stężenia fibrynogenu, hamowanie syntezy tromboksanu i stymulowanie syntezy prostacykliny**", "y": false}, {"t": "cell", "name": "Pentoksyfilina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie agregacji płytek krwi, poprawa właściwości reologicznych krwi → zmniejszenie zdolności erytrocytów do adhezji i agregacji, zwiększenie elastyczności ich ściany, ułatwienie przepływu krwinek przez naczynia włosowate → **ograniczenie obszaru niedotlenienia tkanek** (konspekt)"], "y": false}, {"t": "cell", "name": "Pentoksyfilina", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia krążenia obwodowego i w obrębie gałki ocznej, zaburzenia czynności ucha wewnętrznego, stany niedokrwienia mózgu** (konspekt)"], "y": false}, {"t": "cell", "name": "Inne leki poprawiające krążenie i metabolizm mózgowy (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**leki nootropowe** → wpływają pozytywnie na funkcje mózgu, zwłaszcza na mechanizmy aktywacyjne, stan czuwania i korowe procesy integracyjne, poprawiają procesy uczenia i pamięci oraz ogólną aktywność psychoruchową", "**pochodne 2-pirolidynonu:** PIRACETAM, ANIRACETAM, PRAMIRACETAM, OKSYRACETAM, NEBRACETAM", "**CEREBROLIZYNA** · **CYTYKOLINA** – zwiększa synaptyczne stężenie acetylocholiny · leki o różnej budowie: **DEANOL, MEKLOFENOKSAT, PYRITINOL**", "**leki poprawiające krążenie mózgowe** – usprawniają funkcjonowanie mózgu poprzez zwiększenie ukrwienia, a tym samym poprawę dostarczania tlenu i produktów odżywczych dla neuronów: alkaloidy sporyszu (DIHYDROERGOTOKSYNA, DIHYDROERGOKRYPTYNA, DIHYDROERGOKORNINA), NICERGOLINA, alkaloidy barwinka (WINKAMINA, WINPOCETYNA, WINBURNINA), antagoniści kanałów wapniowych (CYNARYZYNA, FLUNARYZYNA, NIMODYPINA), **Ginkgo biloba**"], "y": true}]}, {"title": "LEKI STOSOWANE W ZAWROTACH GŁOWY", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI STOSOWANE W ZAWROTACH GŁOWY", "blocks": [{"h": null, "items": ["Betahistyna", "Cynaryzyna", "Flunaryzyna", "Metoklopramid", "Dimenhydrynat"]}], "n": 5}, {"t": "cell", "name": "Betahistyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokuje (ANT) histaminowe rec. presynaptyczne H₃**", "y": false}, {"t": "cell", "name": "Betahistyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["nasilenie wydzielania histaminy w zakończeniach nerwowych → rozkurczenie prekapilarnych zwieraczy w mikrokrążeniu ucha wewnętrznego → **poprawa ukrwienia błędnika i przepływu krwi w mózgu** (konspekt)"], "y": false}, {"t": "cell", "name": "Betahistyna", "col": "NA CO", "sub": "(wskazania)", "a": "**choroba Ménière'a, zawroty głowy** (konspekt)", "y": false}, {"t": "cell", "name": "Cynaryzyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**nieswoiste blokowanie kanałów wapniowych (ANT kanałów wapniowych)**", "słabe działanie: p/histaminowe, cholinolityczne, uspokajające, p/wymiotne"], "y": false}, {"t": "cell", "name": "Cynaryzyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["rozszerzenie naczynia krwionośnych → zwiększenia przepływu krwi, **zwłaszcza w naczyniach ucha wewnętrznego, siatkówki oraz w naczyniach obwodowych** (konspekt)"], "y": false}, {"t": "cell", "name": "Cynaryzyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia krążenia mózgowego na tle miażdżycy, zaburzenia błędnikowe, choroba Ménière'a, choroba lokomocyjna, zaburzenia krążenia obwodowego** (konspekt)"], "y": false}, {"t": "cell", "name": "Cynaryzyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**uwaga:** cynaryzyna i flunaryzyna blokują rec. D₂ → mogą nasilać objawy parkinsonowskie (wykład)", "y": false}, {"t": "cell", "name": "Flunaryzyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**nieswoiste blokowanie kanałów wapniowych (ANT kanałów wapniowych)**", "blokowanie (ANT) rec. histaminowych"], "y": false}, {"t": "cell", "name": "Flunaryzyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["rozkurcz mięśni gładkich drobnych naczyń, hamowanie agregacji płytek krwi, działanie uspokajające, p/wymiotne, **zmniejszenie pobudliwości układu przedsionka w uchu środkowym** (konspekt)"], "y": false}, {"t": "cell", "name": "Flunaryzyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**zaburzenia krążenia mózgowego i obwodowego, choroba Ménière'a, profilaktyka migreny, zawroty głowy** (konspekt)"], "y": false}, {"t": "cell", "name": "Flunaryzyna", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**uwaga:** blokuje rec. D₂ → może nasilać objawy parkinsonowskie (wykład)", "y": false}, {"t": "cell", "name": "Leki hamujące na układ przedsionkowy (konspekt, wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**anksjolityki – benzodiazepiny** (diazepam, klonazepam, lorazepam, alprazolam, midazolam) ⇒ wywierają efekty uspokajający i sedatywny, co ma ważny udział w leczeniu zawrotów głowy, ponieważ zwykle towarzyszą im uczucie lęku oraz nasilone objawy autonomiczne", "**neuroleptyki** – chloropromazyna, promazyna, prochlorperazyna, tietylperazyna", "**leki p/histaminowe I generacji** – hydroksyzyna, prometazyna · **cholinolityki** – hioscyna"], "y": true}, {"t": "cell", "name": "Leki hamujące na układ przedsionkowy (konspekt, wykład)", "col": "NA CO", "sub": "(wskazania)", "a": "zawroty głowy – leki o innych wskazaniach, również wykorzystywane w leczeniu zawrotów głowy i chorób błędnika (konspekt)", "y": true}, {"t": "cell", "name": "Leki hamujące na układ przedsionkowy (konspekt, wykład)", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "**DN (BDZ)** ⇒ nie mogą być przewlekle stosowane ⇒ duży potencjał wywoływania uzależnienia (konspekt)", "y": true}, {"t": "cell", "name": "Metoklopramid", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**blokowanie (ANT) rec. dopaminowych D₂ i rec. 5-HT₃**", "słabo pobudza zwoje, blokuje presynaptyczne rec. dopaminowe", "pobudza rec. muskarynowe **M₂** w komórkach mięśni gładkich przewodu pokarmowego"], "y": false}, {"t": "cell", "name": "Metoklopramid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["ułatwienie uwalniania acetylocholiny z neuronów, która działa na rec. muskarynowe M₂ w komórkach mięśni gładkich przewodu pokarmowego ⇒ **poprawa perystaltyki przewodu pokarmowego**; w OUN blokowanie rec. dopaminowego → **działanie uspokajające, p/wymiotne, hamujące nudności towarzyszące zawrotom głowy** (konspekt)"], "y": false}, {"t": "cell", "name": "Metoklopramid", "col": "NA CO", "sub": "(wskazania)", "a": "**nudności i wymioty w tym towarzyszące zawrotom głowy** (konspekt)", "y": false}, {"t": "cell", "name": "Metoklopramid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**DN ⇒ neuroleptyki i leki blokujące ośrodkowo rec. dopaminowe mogą powodować objawy niepożądane ze strony układu pozapiramidowego – dystonie, dyskinezy → NIE ZALECANE DO PRZEWLEKŁEGO STOSOWANIA W ZAWROTACH GŁOWY** (konspekt)"], "y": false}, {"t": "cell", "name": "Dimenhydrynat", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie rec. H₁ i M**", "y": false}, {"t": "cell", "name": "Dimenhydrynat", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["silne hamowanie ośrodka wymiotnego w rdzeniu przedłużonym i odruchów błędnikowych + działanie parasympatykolityczne (zahamowanie czynności wydzielniczej ślinianek, osłabienie czynności wydzielniczej żołądka, zmniejszenie napięcia mięśni gładkich i perystaltyki przewodu pokarmowego) (konspekt)"], "y": false}, {"t": "cell", "name": "Dimenhydrynat", "col": "NA CO", "sub": "(wskazania)", "a": ["**zawroty głowy, choroba lokomocyjna, nudności i wymioty** (konspekt)", "**dimenhydrynat (40 mg) + cynaryzyna (20 mg)** → skojarzone działanie naczynioaktywne (cynaryzyna) oraz p/histaminowe i parasympatykolityczne (dimenhydrynat) → **podwójny mechanizm działania** wynikający z blokowania kanałów wapniowych (cynaryzyna) z wpływem na obwodową część układu przedsionkowego oraz z efektem p/histaminowym (dimenhydrynat) → **potencjalizacja efektu terapeutycznego u pacjentów z różnymi typami ośrodkowych, obwodowych oraz mieszanych zaburzeń układu przedsionkowego** (konspekt)"], "y": false}]}, {"title": "LEKI W CHOROBACH RUCHOWYCH NEUROLOGICZNYCH – SMA (RDZENIOWY ZANIK MIĘŚNI)", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI W CHOROBACH RUCHOWYCH NEUROLOGICZNYCH – SMA (RDZENIOWY ZANIK MIĘŚNI)", "blocks": [{"h": null, "items": ["Nusinersen", "Risdyplam", "Onasemnogen abeparwowek"]}], "n": 3}, {"t": "cell", "name": "Strategie terapeutyczne w SMA (wykład)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**strategie zależne od SMN:** terapia genowa (zastępuje brakujący gen SMN1 dzięki wektorowi wirusowemu) · aktywacja promotora SMN2 (sprawia, że gen SMN2 jest częściej „włączany” i wytwarza więcej w pełni funkcjonalnego białka) · modulacja splicingu SMN2 (przekierowuje splicing SMN2, aby uzyskać więcej pełnej długości transkryptów zawierających ekson 7)", "**strategie niezależne od SMN:** neuroprotekcja (chroni przed uszkodzeniem lub degradacją neuronów) · wzmocnienie mięśni (zapobiega utracie i przywraca funkcje motoryczne) · czynność neuronów (wzmacnia transmisję neuronalną)"], "y": true}, {"t": "cell", "name": "Nusinersen", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**antysensowny oligonukleotyd**", "y": false}, {"t": "cell", "name": "Nusinersen", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zmienia aktywność homologicznego **genu SMN2** ⇒ **zmieniony produkt zaczyna zachowywać się funkcjonalnie jak gen SMN1** (konspekt)"], "y": false}, {"t": "cell", "name": "Nusinersen", "col": "NA CO", "sub": "(wskazania)", "a": ["**rdzeniowy zanik mięśni – podawany bezpośrednio do ośrodkowego układu nerwowego, we wstrzyknięciach dokanałowych co 4 miesiące** (konspekt)"], "y": false}, {"t": "cell", "name": "Risdyplam", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**antysensowny oligonukleotyd**", "y": false}, {"t": "cell", "name": "Risdyplam", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "działa podobnie jak nusinersen (konspekt)", "y": false}, {"t": "cell", "name": "Risdyplam", "col": "NA CO", "sub": "(wskazania)", "a": "**rdzeniowy zanik mięśni – może być podawany doustnie** (konspekt)", "y": false}, {"t": "cell", "name": "Onasemnogen abeparwowek", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**wektor (adenowirusy) niosący prawidłowy gen SMN1**", "y": false}, {"t": "cell", "name": "Onasemnogen abeparwowek", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": "terapia genowa – zastępuje brakujący gen SMN1 (konspekt, wykład)", "y": false}, {"t": "cell", "name": "Onasemnogen abeparwowek", "col": "NA CO", "sub": "(wskazania)", "a": ["**rdzeniowy zanik mięśni – podawany w jednorazowym wstrzyknięciu → w kilkadziesiąt godzin dochodzi do wzrostu ekspresji SMN1** (konspekt)"], "y": false}]}, {"title": "ALS – STWARDNIENIE ZANIKOWE BOCZNE", "level": "section", "parent": null, "cards": [{"t": "list", "q": "ALS – STWARDNIENIE ZANIKOWE BOCZNE", "blocks": [{"h": null, "items": ["Ryluzol", "Edarawon", "Tofersen", "Fenylomaślan sodu + Taurursodiol"]}], "n": 4}, {"t": "cell", "name": "Ryluzol", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["hamowanie presynaptycznego uwalniania aminokwasów pobudzających (asparaginianu, glutaminianu), kwasu γ-aminomasłowego (GABA), glicyny", "hamowanie wychwytu neuronalnego dopaminy, GABA i glutaminianu", "**blokowanie (ANT) postsynaptycznych rec. glutaminowych NMDA oraz kwasu kainowego**", "inaktywacja zależnych od napięcia kanałów Na"], "y": false}, {"t": "cell", "name": "Ryluzol", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zmniejszenie efektów stymulacji rec. dla aminokwasów pobudzających → **działanie neuroprotekcyjne, rozluźnienie mięśni, sedacja, działanie p/drgawkowe** (konspekt)", "ryluzol to **modulator glutaminergiczny**, który uważa się, że działa przez hamowanie uwalniania glutaminianu i zablokowanie kanałów sodowych (Lippincott)"], "y": false}, {"t": "cell", "name": "Ryluzol", "col": "NA CO", "sub": "(wskazania)", "a": ["**stwardnienie zanikowe boczne – wydłużenie życia chorych** (konspekt)", "**lek ten może poprawiać czas przeżycia u pacjentów cierpiących z powodu ALS**; stosowany jest celem opóźniania progresji choroby i konieczności wspomaganego oddechu, jak to ma miejsce w zaawansowanym stadium choroby (Lippincott, pyt. 15.5)"], "y": false}, {"t": "cell", "name": "Ryluzol", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["działania niepożądane mogą obejmować **nudności, zawroty głowy, osłabienie i podwyższenie stężeń enzymów wątrobowych** (Lippincott)"], "y": false}, {"t": "cell", "name": "Edarawon", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**działanie antyoksydacyjne** – wymiatacz wolnych rodników", "y": false}, {"t": "cell", "name": "Edarawon", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["efekt neuroprotekcyjny (konspekt)", "edarawon to podawany dożylnie wymiatacz wolnych rodników i antyoksydant, **który może spowalniać progresję choroby** (Lippincott)"], "y": false}, {"t": "cell", "name": "Edarawon", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie zanikowe boczne** (konspekt)", "y": false}, {"t": "cell", "name": "Edarawon", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["możliwe efekty uboczne tego leku to **zaburzenia chodu, tendencja do siniaczenia się i bóle głowy** (Lippincott)", "**skuteczność nie do końca potwierdzona, udar niedokrwienny mózgu** (konspekt)"], "y": false}, {"t": "cell", "name": "Tofersen", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**antysensowny oligonukleotyd**", "y": false}, {"t": "cell", "name": "Tofersen", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["wiązanie się z mRNA **genu SOD1** (dysmutazy ponadtlenkowej 1) ⇒ **zmniejszenie produkcji wadliwego białka SOD1** (konspekt)"], "y": false}, {"t": "cell", "name": "Tofersen", "col": "NA CO", "sub": "(wskazania)", "a": ["**stwardnienie zanikowe boczne, skuteczność u pacjentów z potwierdzoną mutacją w genie SOD1** (konspekt)"], "y": false}, {"t": "cell", "name": "Fenylomaślan sodu + Taurursodiol", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["**fenylomaślan sodu** – hamowanie deacetylazy histonowej", "**taurursodiol** – działanie neuroprotekcyjne"], "y": false}, {"t": "cell", "name": "Fenylomaślan sodu + Taurursodiol", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**fenylomaślan sodu** ⇒ ochrona białka przed przyjęciem nieprawidłowej struktury przestrzennej; hamowanie apoptozy ⇒ co nie pozwala na aktywację układu kaspaz w sytuacjach stresu komórkowego", "**taurursodiol** ⇒ działanie neuroprotekcyjne, spowolnienie degeneracji neuronów (konspekt)"], "y": false}, {"t": "cell", "name": "Fenylomaślan sodu + Taurursodiol", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie zanikowe boczne – wydłużenie życia chorych** (konspekt)", "y": false}]}, {"title": "SM – STWARDNIENIE ROZSIANE", "level": "section", "parent": null, "cards": [{"t": "list", "q": "SM – STWARDNIENIE ROZSIANE", "blocks": [{"h": null, "items": ["Famprydyna (Dalfamprydyna)", "Octan Glatirameru", "Interferon beta", "Teryflunomid", "Natalizumab", "Alemtuzumab", "Okrelizumab", "Ublituksymab, Ofatumumab", "Fumaran Dimetylu", "Daklizumab", "Fingolimod", "Siponimod", "Ozanimod", "Ponesimod", "Kladrybina"]}], "n": 15}, {"t": "cell", "name": "Cechy wspólne i strategia leczenia SM", "col": "RECEPTOR", "sub": "(na co działa)", "a": "układ immunologiczny – limfocyty T i B, leukocyty", "y": true}, {"t": "cell", "name": "Cechy wspólne i strategia leczenia SM", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["**stwardnienie rozsiane (MS) to autoimmunologiczna, zapalna, demielinizacyjna choroba OUN o niejednolitym przebiegu**; w niektórych przypadkach może dochodzić do jednego lub dwóch zaostrzeń z ostrymi objawami neurologicznymi; u innych pacjentów choroba ma postać przewlekłą, nawrotową lub postępującą, o czasie trwania od 10 do 20 lat (Lippincott)", "**leki modyfikujące przebieg choroby ⇒ immunomodulujące i immunosupresyjne** (wykład): **immunomodulatory** zmieniają pracę układu immunologicznego przywracając jego prawidłowe funkcje; **immunosupresanty** – również należą do grupy immunomodulatorów, ale ich działanie jest bardziej specyficznie określone → polega na wytłumieniu systemu immunologicznego", "głównym celem tych leków jest modyfikacja odpowiedzi immunologicznej przez hamowanie mediowanego za pomocą białych krwinek procesu zapalnego, prowadzącego do uszkadzania osłonek mielinowych i zmniejszonej lub nieodpowiedniej komunikacji aksonalnej między neuronami (Lippincott)", "**strategia leczenia (wykład):** **terapia eskalacyjna** – polega na początkowym stosowaniu leków o bardziej bezpiecznym profilu, a w razie niesatysfakcjonujących efektów terapii zmianie ich na leki z II linii; **leki I linii: interferony beta (IFN β), octan glatirameru, fumaran dimetylu, teryflunomid**; w przypadku braku skuteczności leczenia w następnej kolejności: **fingolimod, natalizumab, alemtuzumab, okrelizumab**; **terapia indukcyjna** – rozpoczęcie leczenia silnymi immunomodulatorami, następnie podtrzymywaniu uzyskanego efektu lekami o bardziej bezpiecznym profilu", "do leczenia zaostrzeń od dawna stosuje się **glikokortykosteroidy** (deksametazon, metylprednizolon i prednizon), podobnie jak chemioterapeutyki, takie jak cyklofosfamid czy azatiopryna (Lippincott)"], "y": true}, {"t": "cell", "name": "Cechy wspólne i strategia leczenia SM", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie objawowe (Lippincott):** wiele różnych grup leków znajduje zastosowanie w terapii objawów MS, takich jak spastyczność mięśni, zaparcia, zaburzenia odpływu moczu i depresja"], "y": true}, {"t": "cell", "name": "Cechy wspólne i strategia leczenia SM", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**ryzyko infekcji (Lippincott, Zastosowanie kliniczne 15.3):** większość leków stosowanych w leczeniu MS, aby kontrolować i spowalniać progresję choroby, działa poprzez modulowanie bądź hamowanie określonych reakcji immunologicznych → **w rezultacie wiele z tych substancji zwiększa ryzyko zakażeń oportunistycznych** (na przykład PML, cytomegalowirus, kryptokokowe zapalenie opon mózgowych) lub zapobiega rozwojowi pełnej odpowiedzi immunologicznej w razie wystąpienia infekcji", "**istnieje szeroka gama leków opracowanych w celu leczenia i kontrolowania przebiegu zaostrzeń MS; jednakże wiele z nich podawane jest w formie wlewów dożylnych, które wymagają podania i nadzoru przez wykwalifikowany personel** (Lippincott, podsumowanie)"], "y": true}, {"t": "cell", "name": "Famprydyna (Dalfamprydyna)", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokada kanałów potasowych**", "y": false}, {"t": "cell", "name": "Famprydyna (Dalfamprydyna)", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["przedłużenie okresu repolaryzacji i wzmocnienie powstawania potencjałów czynnościowych w aksonach pozbawionych osłonek mielinowych ⇒ **wzmocnienie czynności motorycznych – chodu** (konspekt)", "**dalfamprydyna**, doustny bloker kanału potasowego, **poprawia szybkość chodu u pacjentów z rozpoznaniem MS; jest pierwszą substancją zarejestrowaną w tym wskazaniu** (Lippincott)"], "y": false}, {"t": "cell", "name": "Famprydyna (Dalfamprydyna)", "col": "NA CO", "sub": "(wskazania)", "a": "**zaburzenia chodu u osób ze stwardnieniem rozsianym z niewydolnością ruchową** (konspekt)", "y": false}, {"t": "cell", "name": "Octan Glatirameru", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**wiązanie z antygenem zgodności tkankowej MHC klasy II**", "y": false}, {"t": "cell", "name": "Octan Glatirameru", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["indukcja swoistych limfocytów T supresorowych i hamowanie swoistych limfocytów T efektorowych ⇒ **efekt immunomodulujący, ochrona białek mieliny** → hamowanie postępu stwardnienia rozsianego (konspekt)", "**glatiramer** to syntetyczny polipeptyd przypominający białko osłonek mielinowych, mogący stanowić zastępczy cel do ataku dla limfocytów (Lippincott)"], "y": false}, {"t": "cell", "name": "Octan Glatirameru", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane** – lek I linii (konspekt, wykład)", "y": false}, {"t": "cell", "name": "Octan Glatirameru", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["niektórzy pacjenci doświadczają reakcji poiniekcyjnych, takich jak **zaczerwienienie, ból w klatce piersiowej, świąd, lęk**; powyższe objawy mają zwykle charakter samoograniczający się (Lippincott)"], "y": false}, {"t": "cell", "name": "Interferon beta", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**działanie immunomodulujące, p/wirusowe, antyproliferacyjne**", "y": false}, {"t": "cell", "name": "Interferon beta", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zmniejszenie liczby komórek prozapalnych → zmniejszenie częstości występowania rzutów choroby, zmniejszenie nasilenia objawów klinicznych i hamowanie rozwoju upośledzenia fizycznego (konspekt)", "**interferon beta-1a i interferon beta-1b** – działanie immunomodulujące interferonu podawanego w iniekcjach pomaga zmniejszyć reakcję zapalną prowadzącą do demielinizacji osłonek aksonalnych (Lippincott)"], "y": false}, {"t": "cell", "name": "Interferon beta", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane** – lek I linii (konspekt, wykład)", "y": false}, {"t": "cell", "name": "Interferon beta", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["działania uboczne powyższych leków mogą obejmować **zaburzenia depresyjne, odczyny poiniekcyjne w miejscu podania, wzrost enzymów wątrobowych i objawy grypopodobne** (Lippincott)"], "y": false}, {"t": "cell", "name": "Teryflunomid", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**hamowanie (inhibitor) aktywności dehydrogenazy dihydroorotanowej**", "y": false}, {"t": "cell", "name": "Teryflunomid", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["blokada syntezy pirymidyn, dodatkowo hamowanie czynnika transkrypcyjnego **NF-κB** ⇒ hamowanie proliferacji szybko dzielących się komórek, w tym aktywowanych limfocytów T → **efekt immunomodulacyjny** ⇒ stwardnienie rozsiane – modyfikacja przebiegu choroby (konspekt)", "**metabolit leflunomidu** (konspekt); inhibitor syntezy pirymidyny, podawany doustnie, który prowadzi do spadku nagromadzenia aktywnych limfocytów w OUN (Lippincott)"], "y": false}, {"t": "cell", "name": "Teryflunomid", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane** – lek I linii (konspekt, wykład)", "y": false}, {"t": "cell", "name": "Teryflunomid", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["lek ten może powodować **podwyższenie stężeń enzymów wątrobowych**, ponadto **należy unikać jego stosowania w trakcie ciąży** – działanie teratogenne (Lippincott)"], "y": false}, {"t": "cell", "name": "Natalizumab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**humanizowane p/ciało skierowane przeciwko molekule adhezyjnej, integrynie α4**", "y": false}, {"t": "cell", "name": "Natalizumab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie przenikania limfocytów przez śródbłonek do zapalnej tkanki śródmiąższowej, osłabienie zdolności komórek zapalnych do przechodzenia przez barierę krew–mózg → hamowanie procesu zapalnego w miejscu objętym chorobą oraz hamowanie dalszej rekrutacji komórek zapalnych w tkance objętej zapaleniem (konspekt)", "natalizumab jest rekombinowanym, monoklonalnym przeciwciałem, które może być stosowane w ramach monoterapii nawracających form MS; **blokuje wiązanie się integryny z receptorami na komórkach śródbłonka naczyń, by ograniczyć możliwość adhezji i diapedezy leukocytów**; lek ten jest podawany we wlewach dożylnych (Lippincott)"], "y": false}, {"t": "cell", "name": "Natalizumab", "col": "NA CO", "sub": "(wskazania)", "a": ["**stwardnienie rozsiane oraz w chorobie Leśniowskiego-Crohna** (konspekt, Lippincott)"], "y": false}, {"t": "cell", "name": "Natalizumab", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["działania niepożądane mogą obejmować **reakcje okołoinfuzyjne, bóle stawów, zaburzenia żołądkowo-jelitowe, wysypkę i zwiększone ryzyko infekcji**; **ze względu na zwiększone ryzyko wystąpienia PML, omawiana substancja dostępna jest tylko w ramach programu lekowego** (Lippincott)"], "y": false}, {"t": "cell", "name": "Alemtuzumab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**humanizowane p/ciało monoklonalne skierowane przeciwko molekule CD52** na dojrzałych limfocytach", "y": false}, {"t": "cell", "name": "Alemtuzumab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["liza limfocytów na skutek aktywacji układu dopełniacza oraz mechanizmów cytotoksycznych, w których pośredniczą przeciwciała → zmniejszenie liczebności i odtworzenia populacji limfocytów ⇒ stwardnienie rozsiane – modyfikacja przebiegu choroby (konspekt)", "**alemtuzumab to monoklonalne przeciwciało anty-CD52, wywołujące deplecję limfocytów T, limfocytów B, komórek NK i monocytów**, na których powierzchni dochodzi do ekspresji białka CD52 (Lippincott)"], "y": false}, {"t": "cell", "name": "Alemtuzumab", "col": "NA CO", "sub": "(wskazania)", "a": ["**stwardnienie rozsiane** (konspekt)", "lek ten może być stosowany w rzutowych postaciach MS, ale **w związku z ryzykiem wywołania poważnych efektów ubocznych zarezerwowany jest do leczenia przypadków o ciężkim przebiegu**, które mogą nie odpowiedzieć na inne rodzaje terapii (Lippincott)"], "y": false}, {"t": "cell", "name": "Alemtuzumab", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["wśród działań niepożądanych można wymienić **bóle głowy, wysypkę, zaburzenia żołądkowo-jelitowe**; natomiast poważne efekty uboczne mogą obejmować **reakcje autoimmunologiczne, okołoinfuzyjne, pojawienie się nowych zmian nowotworowych i wystąpienie udaru** → **alemtuzumab dostępny jest tylko w ramach leczenia o ograniczonej dostępności** (Lippincott)"], "y": false}, {"t": "cell", "name": "Okrelizumab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**humanizowane p/ciało monoklonalne anty-CD20** na powierzchni limfocytów B", "y": false}, {"t": "cell", "name": "Okrelizumab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["immunomodulacja poprzez zmniejszenie liczby i osłabienia funkcjonowania limfocytów B z ekspresją antygenu CD20 → usuwanie limfocytów na drodze: fagocytozy komórkowej zależnej od przeciwciał, cytotoksyczności komórkowej zależnej od przeciwciał, cytotoksyczności zależnej od dopełniacza i apoptozy (konspekt)", "**okrelizumab ma być pierwszą substancją dopuszczoną do leczenia pierwotnie postępujących postaci choroby** (Lippincott)"], "y": false}, {"t": "cell", "name": "Okrelizumab", "col": "NA CO", "sub": "(wskazania)", "a": ["**stwardnienie rozsiane – hamowanie postępu choroby związanego z toczącą się reakcją autoimmunologiczną** (konspekt)", "lek ten może być stosowany w terapii zarówno rzutowych, jak i pierwotnie postępujących postaci MS; podawany jest we wlewach dożylnych (Lippincott)"], "y": false}, {"t": "cell", "name": "Okrelizumab", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["działania niepożądane mogą obejmować **reakcje okołoinfuzyjne oraz zwiększone ryzyko infekcji, zwłaszcza skóry i dróg oddechowych** (Lippincott)"], "y": false}, {"t": "cell", "name": "Ublituksymab, Ofatumumab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**humanizowane p/ciała monoklonalne anty-CD20**", "y": false}, {"t": "cell", "name": "Ublituksymab, Ofatumumab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["celem działania p/ciała są limfocyty B, które giną w efekcie cytotoksyczności zależnej od przeciwciał → **działanie podobnie jak Okrelizumab** (konspekt)", "**ofatumumab** to również przeciwciało monoklonalne anty-CD20, które prowadzi do zmniejszenia liczby limfocytów B w sposób selektywny (Lippincott)"], "y": false}, {"t": "cell", "name": "Ublituksymab, Ofatumumab", "col": "NA CO", "sub": "(wskazania)", "a": ["stwardnienie rozsiane; ofatumumab wskazany jest w leczeniu nawracających postaci MS i może być podawany w formie wlewów dożylnych lub iniekcji podskórnych (Lippincott)"], "y": false}, {"t": "cell", "name": "Ublituksymab, Ofatumumab", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["możliwe objawy uboczne ofatumumabu to **bóle głowy, wysypka, reakcje okołoinfuzyjne lub w miejscu podania oraz zwiększone ryzyko infekcji górnych dróg oddechowych** (Lippincott)"], "y": false}, {"t": "cell", "name": "Fumaran Dimetylu", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**aktywacja czynnika transkrypcyjnego Nrf2**, pobudzenie (AGO) rec. **nikotynowych**", "y": false}, {"t": "cell", "name": "Fumaran Dimetylu", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["działanie immunomodulujące ⇒ **rzutowo-remisyjna postać stwardnienia rozsianego** (konspekt, wykład)", "**fumaran dimetylu, fumaran diroksymelu i fumaran metylu** to substancje stosowane doustnie, działające poprzez aktywację białka Nrf2, biorącego udział w aktywacji odpowiedzi antyoksydacyjnej; w tym mechanizmie może dochodzić do zmiany odpowiedzi komórkowej na stres oksydacyjny i zwolnienia tempa postępu MS (Lippincott)"], "y": false}, {"t": "cell", "name": "Fumaran Dimetylu", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane** – lek I linii (konspekt, wykład)", "y": false}, {"t": "cell", "name": "Fumaran Dimetylu", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**zaczerwienienie, ból brzucha, biegunka i nudności stanowią najczęstsze działania niepożądane** omawianego leczenia; należy również zwrócić szczególną uwagę na **zwiększone ryzyko występowania zakażeń oportunistycznych, w tym PML i uszkodzenia wątroby** (Lippincott)"], "y": false}, {"t": "cell", "name": "Daklizumab", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**humanizowane p/ciało monoklonalne skierowane przeciwko CD25** – podjednostce α receptora dla IL-2 na limfocytach T", "y": false}, {"t": "cell", "name": "Daklizumab", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie wiązania IL-2 z receptorem → hamowanie działania IL-2 → wpływ hamujący na proliferację limfocytów T i ograniczenie reakcji autoimmunologicznej (konspekt)"], "y": false}, {"t": "cell", "name": "Daklizumab", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane – modyfikacja przebiegu choroby** (konspekt)", "y": false}, {"t": "cell", "name": "Fingolimod", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**modulator rec. dla sfingozyno-1-fosforanu (S1P)** zlokalizowanych na limfocytach T i B oraz na komórkach nerwowych OUN", "y": false}, {"t": "cell", "name": "Fingolimod", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie działania limfocytów → hamowanie reakcji autoimmunologicznej ⇒ **stwardnienie rozsiane – hamowanie postępu choroby** (konspekt)", "**fingolimod, ozanimod, ponesimod i siponimod** to doustne leki wpływające na migrację limfocytów przez modulację receptora S1P; w ten sposób dochodzi do zmniejszenia liczby limfocytów w OUN (Lippincott)"], "y": false}, {"t": "cell", "name": "Fingolimod", "col": "NA CO", "sub": "(wskazania)", "a": "stwardnienie rozsiane – lek II linii (wykład)", "y": false}, {"t": "cell", "name": "Fingolimod", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**fingolimod może wywoływać bradykardię w ramach efektu pierwszej dawki, przez co pacjenci wymagają co najmniej sześciu godzin obserwacji po pierwszym podaniu tego leku** (Lippincott)", "stosowanie fingolimodu i innych modulatorów receptora S1P związane jest ze **zwiększonym ryzykiem wystąpienia obrzęku plamki żółtej**, jak również **zakażeń oportunistycznych i postępującej wieloogniskowej leukoencefalopatii (PML)** – rzadkiej, ale agresywnej i potencjalnie śmiertelnej choroby mózgu (Lippincott)"], "y": false}, {"t": "cell", "name": "Siponimod", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie (ANT) rec. dla sfingozyno-1-fosforanu**", "y": false}, {"t": "cell", "name": "Siponimod", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie przemieszczania limfocytów z węzłów chłonnych do mózgu i rdzenia kręgowego → hamowanie procesu autoimmunologicznego w tkance nerwowej (konspekt)"], "y": false}, {"t": "cell", "name": "Siponimod", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane – hamowanie postępu choroby – podawany doustnie** (konspekt)", "y": false}, {"t": "cell", "name": "Siponimod", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**badanie genetyczne polimorfizmów CYP2C9 wymagane jest do dopasowania dawkowania siponimodu**, gdyż jest to główny enzym biorący udział w biotransformacji tego leku; **ekspresja genotypu CYP2C9\\*3/\\*3 stanowi przeciwwskazanie do omawianej terapii** ze względu na ryzyko wystąpienia istotnie podwyższonych stężeń siponimodu (Lippincott)"], "y": false}, {"t": "cell", "name": "Ozanimod", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie (wybiórczy ANT) rec. 1 i 5** dla sfingozyno-1-fosforanu (zlokalizowanych na komórkach układu odpornościowego i OUN)", "y": false}, {"t": "cell", "name": "Ozanimod", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie przemieszczania limfocytów z węzłów chłonnych do mózgu i rdzenia kręgowego → hamowanie procesu autoimmunologicznego w tkance nerwowej (konspekt)"], "y": false}, {"t": "cell", "name": "Ozanimod", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane – hamowanie atrofii mózgu i postępów choroby** (konspekt)", "y": false}, {"t": "cell", "name": "Ozanimod", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**ozanimod jest substratem CYP2C8, wobec czego równoległe podawanie z silnymi induktorami lub inhibitorami tego izoenzymu nie jest zalecane** (Lippincott)"], "y": false}, {"t": "cell", "name": "Ponesimod", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokowanie (wybiórczy ANT) rec. 1** dla sfingozyno-1-fosforanu", "y": false}, {"t": "cell", "name": "Ponesimod", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie przemieszczania limfocytów z węzłów chłonnych do mózgu i rdzenia kręgowego → hamowanie procesu autoimmunologicznego w tkance nerwowej (konspekt)"], "y": false}, {"t": "cell", "name": "Ponesimod", "col": "NA CO", "sub": "(wskazania)", "a": "**stwardnienie rozsiane – hamowanie postępu choroby** (konspekt)", "y": false}, {"t": "cell", "name": "Ponesimod", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": "jak grupa modulatorów S1P", "y": false}, {"t": "cell", "name": "Kladrybina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**analog puryny, działający jak antymetabolit**", "y": false}, {"t": "cell", "name": "Kladrybina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["lek zaburza prawidłowe działanie enzymów koniecznych do syntezy DNA i wywołuje cytotoksyczne działania na limfocyty B i T, prowadząc do zmniejszenia ich liczby (Lippincott)"], "y": false}, {"t": "cell", "name": "Kladrybina", "col": "NA CO", "sub": "(wskazania)", "a": "stwardnienie rozsiane (Lippincott, ryc. 15.14)", "y": false}, {"t": "cell", "name": "Kladrybina", "col": "DZIAŁANIA NIEPOŻĄDANE", "sub": "(+ P/W, interakcje, uwagi)", "a": ["**kladrybina może powodować uszkodzenie wątroby i zwiększoną podatność na infekcje**; nowotwory i działanie teratogenne sprawiają, że w trakcie stosowania tej substancji należy zachować szczególną ostrożność i unikać jej stosowania w ciąży (Lippincott)"], "y": false}]}, {"title": "LEKI W UZALEŻNIENIU ALKOHOLOWYM", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI W UZALEŻNIENIU ALKOHOLOWYM", "blocks": [{"h": null, "items": ["Akamprozat", "Disulfiram", "Naltrekson", "Nalmefen"]}], "n": 4}, {"t": "cell", "name": "Akamprozat", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**hamowanie (ANT) aminokwasów działających pobudzająco na OUN** (przede wszystkim kwasu glutaminowego)", "y": false}, {"t": "cell", "name": "Akamprozat", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["stymulacja neurotransmisji w układzie GABA-ergicznym, zwiększenie stężenia serotoniny w mózgu i krwi, nasilenie neuronalnego wychwytu GABA w hipokampie i wzgórzu ⇒ **zmniejszenie odczucia głodu alkoholowego** (konspekt, wykład)"], "y": false}, {"t": "cell", "name": "Akamprozat", "col": "NA CO", "sub": "(wskazania)", "a": "**uzależnienie od alkoholu** (konspekt)", "y": false}, {"t": "cell", "name": "Disulfiram", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**hamuje (inhibitor) dehydrogenazę aldehydową**, przekształcającą aldehyd octowy do kwasu octowego", "y": false}, {"t": "cell", "name": "Disulfiram", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["aldehyd octowy jest głównym metabolitem alkoholu etylowego ⇒ **wypicie alkoholu w czasie leczenia prowadzi do znacznego wzrostu stężenia aldehydu octowego w organizmie i wystąpienia objawów zatrucia: nudności, wymioty, tachykardia, niedociśnienie, zawroty głowy, nagłe zaczerwienienie twarzy z uczuciem gorąca** (konspekt)", "wykład (slajd 66): alkohol etylowy → (dehydrogenaza alkoholowa) → aldehyd octowy → (dehydrogenaza aldehydowa, **blokowana przez DISULFIRAM**) → kwas octowy; nagromadzenie aldehydu ⇒ **efekt disulfiramowy**; analogicznie **FOMEPIZOL** blokuje dehydrogenazę alkoholową przy zatruciu alkoholem metylowym (formaldehyd, kwas mrówkowy → efekt toksyczny)"], "y": false}, {"t": "cell", "name": "Disulfiram", "col": "NA CO", "sub": "(wskazania)", "a": "**uzależnienie od alkoholu** (konspekt)", "y": false}, {"t": "cell", "name": "Naltrekson", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokada (ANT) rec. opioidowego**, wykazuje minimalne właściwości agonistyczne", "y": false}, {"t": "cell", "name": "Naltrekson", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["zmniejszenie potrzeby picia alkoholu w czasie abstynencji i po spożyciu jego niewielkich ilości oraz zmniejszenie ryzyka nawrotu niekontrolowanych epizodów upijania (konspekt)"], "y": false}, {"t": "cell", "name": "Naltrekson", "col": "NA CO", "sub": "(wskazania)", "a": ["**w zapobieganiu nawrotom uzależnienia u osób, które wcześniej nadużywały heroiny lub morfiny, oraz w leczeniu uzależnień od alkoholu** (konspekt)"], "y": false}, {"t": "cell", "name": "Nalmefen", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**blokada (ANT) rec. opioidowych μ i δ, pobudzenie (częściowy AGO) rec. opioidowych κ**", "y": false}, {"t": "cell", "name": "Nalmefen", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["ograniczenie spożycia alkoholu prawdopodobnie poprzez modulowanie czynności układu opioidowego w obszarze mezolimbiczno-korowym (konspekt)"], "y": false}, {"t": "cell", "name": "Nalmefen", "col": "NA CO", "sub": "(wskazania)", "a": "**uzależnienie od alkoholu** (konspekt)", "y": false}]}, {"title": "LEKI W UZALEŻNIENIU OD NIKOTYNY", "level": "section", "parent": null, "cards": [{"t": "list", "q": "LEKI W UZALEŻNIENIU OD NIKOTYNY", "blocks": [{"h": null, "items": ["Cytyzyna", "Nikotyna", "Wareniklina", "Bupropion"]}], "n": 4}, {"t": "cell", "name": "Cytyzyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**selektywne pobudzenie (AGO) rec. nikotynowych α4β2**", "y": false}, {"t": "cell", "name": "Cytyzyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["stymulacja wydzielania dopaminy ⇒ pobudzenie ośrodka oddechowego i naczynioruchowego, zwiększenie wydzielania adrenaliny → podwyższenie ciśnienia tętniczego, **znoszenie objawów występujących w okresie po odstawieniu nikotyny** (konspekt)"], "y": false}, {"t": "cell", "name": "Cytyzyna", "col": "NA CO", "sub": "(wskazania)", "a": "**leczenie uzależnienia od nikotyny** (konspekt)", "y": false}, {"t": "cell", "name": "Nikotyna", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**pobudza rec. nikotynowe N**", "y": false}, {"t": "cell", "name": "Nikotyna", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["pobudzenie OUN (szczególnie **„punkt nagrody” w układzie limbicznym**), rozkurcz obwodowych naczyń krwionośnych, zwiększenie częstotliwości rytmu serca, zwiększenie ciśnienia tętniczego, zmniejszenie napięcia mięśni poprzecznie prążkowanych, przyspieszenie perystaltyki i pobudzenie wydzielania gruczołów przewodu pokarmowego (konspekt)"], "y": false}, {"t": "cell", "name": "Nikotyna", "col": "NA CO", "sub": "(wskazania)", "a": ["**w postaci plastrów naskórnych, tabletek podjęzykowych, gum do żucia, sprayu donosowego ⇒ znoszenie objawów odstawienia palenia papierosów** (konspekt)"], "y": false}, {"t": "cell", "name": "Wareniklina", "col": "RECEPTOR", "sub": "(na co działa)", "a": "**pobudza (częściowy AGO) rec. nikotynowego (N) α4β2**", "y": false}, {"t": "cell", "name": "Wareniklina", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["hamowanie wpływu podawanej egzogennie podczas palenia nikotyny, zmniejszenie przyjemności płynącej z nałogu, łagodzenie objawów niedoboru nikotyny (konspekt)"], "y": false}, {"t": "cell", "name": "Wareniklina", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie uzależnienia od nikotyny – terapię rozpoczyna się na tydzień przed rzuceniem palenia i kontynuuje przez 3–6 miesięcy** (konspekt)"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "RECEPTOR", "sub": "(na co działa)", "a": ["lek p/depresyjny – **hamuje wychwyt zwrotny NA i DA**", "**ANT rec. nikotynowych w OUN**"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "MECHANIZM", "sub": "(działanie / efekty)", "a": ["przerywa błędne koło konieczności ciągłego pobudzania rec. N, zmniejsza objawy zespołu odstawiennego i zapobiega nawrotom palenia (konspekt)"], "y": false}, {"t": "cell", "name": "Bupropion", "col": "NA CO", "sub": "(wskazania)", "a": ["**leczenie uzależnienia od nikotyny – podaje się 1–2 tyg. przed zaprzestaniem palenia i później jeszcze przez kilka tygodni** (konspekt)", "patrz też tabelka – leki przeciwdepresyjne"], "y": false}]}, {"title": "PODAJ LEK — CECHA CHARAKTERYSTYCZNA", "level": "section", "parent": null, "quiz": true, "cards": [{"t": "rev", "q": "Który inhibitor AChE jest jedynym dopuszczonym do leczenia otępienia w chorobie Parkinsona i jedynym dostępnym w postaci transdermalnej?", "a": "Rywastygmina", "src": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA › inhibitory acetylocholinoesterazy · MECHANIZM"}, {"t": "rev", "q": "Który inhibitor AChE – pierwszy stosowany w chorobie Alzheimera – jest dziś praktycznie niestosowany z powodu hepatotoksyczności?", "a": "Takryna", "src": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA › inhibitory acetylocholinoesterazy · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek stosowany w chorobie Alzheimera jest selektywnym, niekompetycyjnym antagonistą receptora NMDA?", "a": "Memantyna", "src": "LEKI STOSOWANE W CHOROBIE ALZHEIMERA › inne leki · RECEPTOR"}, {"t": "rev", "q": "Który agonista dopaminergiczny jest podawany podskórnie, w leczeniu fluktuacji ruchowych (zespół on-off)?", "a": "Apomorfina", "src": "LEKI W CHOROBIE PARKINSONA › agoniści receptorów dopaminergicznych · NA CO"}, {"t": "rev", "q": "Który agonista receptorów dopaminergicznych jest podawany raz dziennie w plastrze transdermalnym?", "a": "Rotygotyna", "src": "LEKI W CHOROBIE PARKINSONA › agoniści receptorów dopaminergicznych · MECHANIZM"}, {"t": "rev", "q": "Który agonista dopaminergiczny – jako pochodna ergotaminy – grozi zwłóknieniem przestrzeni zaotrzewnowej i płuc?", "a": "Bromokryptyna", "src": "LEKI W CHOROBIE PARKINSONA › agoniści receptorów dopaminergicznych · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który inhibitor COMT jest obciążony ryzykiem hepatotoksyczności?", "a": "Tolkapon", "src": "LEKI W CHOROBIE PARKINSONA › inhibitory COMT · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek p/parkinsonowski jest antagonistą NMDA i nasila uwalnianie dopaminy, a dodatkowo hamuje replikację wirusów grypy A?", "a": "Amantadyna", "src": "LEKI W CHOROBIE PARKINSONA › leki o innym mechanizmie – amantadyna · RECEPTOR"}, {"t": "rev", "q": "Które leki wspomagające leczenie choroby Parkinsona są selektywnymi antagonistami receptora adenozynowego A2A?", "a": "Istradefilina, Preladenant", "src": "LEKI W CHOROBIE PARKINSONA › antagoniści receptora adenozynowego · RECEPTOR"}, {"t": "rev", "q": "Które leki hamują pęcherzykowy transporter monoamin typu 2 (VMAT2) i są stosowane w chorobie Huntingtona?", "a": "Tetrabenazyna, Walbenazyna, Deutetrabenazyna", "src": "LEKI STOSOWANE W CHOROBIE HUNTINGTONA · RECEPTOR"}, {"t": "rev", "q": "Który lek w rdzeniowym zaniku mięśni podaje się bezpośrednio do OUN, we wstrzyknięciach dokanałowych co 4 miesiące?", "a": "Nusinersen", "src": "LEKI W CHOROBACH RUCHOWYCH NEUROLOGICZNYCH – SMA (RDZENIOWY ZANIK MIĘŚNI) · NA CO"}, {"t": "rev", "q": "Który lek w rdzeniowym zaniku mięśni jest terapią genową podawaną w jednorazowym wstrzyknięciu?", "a": "Onasemnogen abeparwowek", "src": "LEKI W CHOROBACH RUCHOWYCH NEUROLOGICZNYCH – SMA (RDZENIOWY ZANIK MIĘŚNI) · NA CO"}, {"t": "rev", "q": "Który lek stosowany w ALS jest modulatorem glutaminergicznym – hamuje uwalnianie glutaminianu i blokuje kanały sodowe?", "a": "Ryluzol", "src": "ALS – STWARDNIENIE ZANIKOWE BOCZNE · MECHANIZM"}, {"t": "rev", "q": "Który lek stosowany w ALS jest podawanym dożylnie wymiataczem wolnych rodników i antyoksydantem?", "a": "Edarawon", "src": "ALS – STWARDNIENIE ZANIKOWE BOCZNE · RECEPTOR"}, {"t": "rev", "q": "Który lek w stwardnieniu rozsianym – przeciwciało przeciw integrynie α4 – ze względu na ryzyko PML jest dostępny tylko w ramach programu lekowego?", "a": "Natalizumab", "src": "SM – STWARDNIENIE ROZSIANE · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek w stwardnieniu rozsianym wywołuje bradykardię jako efekt pierwszej dawki i wymaga co najmniej 6 godzin obserwacji po pierwszym podaniu?", "a": "Fingolimod", "src": "SM – STWARDNIENIE ROZSIANE · DZIAŁANIA NIEPOŻĄDANE"}, {"t": "rev", "q": "Który lek w stwardnieniu rozsianym blokuje kanały potasowe i poprawia szybkość chodu?", "a": "Famprydyna (Dalfamprydyna)", "src": "SM – STWARDNIENIE ROZSIANE · RECEPTOR"}, {"t": "rev", "q": "Który lek stosowany w uzależnieniu od alkoholu hamuje dehydrogenazę aldehydową, tak że wypicie alkoholu wywołuje objawy zatrucia aldehydem octowym?", "a": "Disulfiram", "src": "LEKI W UZALEŻNIENIU ALKOHOLOWYM · RECEPTOR"}, {"t": "rev", "q": "Który lek stosowany w zawrotach głowy i chorobie Ménière'a blokuje presynaptyczne receptory histaminowe H₃?", "a": "Betahistyna", "src": "LEKI STOSOWANE W ZAWROTACH GŁOWY · RECEPTOR"}, {"t": "rev", "q": "Które leki stosowane w zawrotach głowy blokują receptory D₂ i mogą nasilać objawy parkinsonowskie?", "a": "Cynaryzyna i Flunaryzyna", "src": "LEKI STOSOWANE W ZAWROTACH GŁOWY · DZIAŁANIA NIEPOŻĄDANE"}]}]}]
</script>
<script>
(function(){
  const DECKS = JSON.parse(document.getElementById('data').textContent);
  const view=document.getElementById('view'), crumb=document.getElementById('crumb'),
        foot=document.getElementById('foot'), backBtn=document.getElementById('back');

  // phase: null (deck list) | 'groups' | 'start' | 'study' | 'done'
  let st={d:null,g:null,phase:null,shuffle:false,order:null,i:0,shown:false,grades:[]};

  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md=s=>esc(s).replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>')
                    .replace(/__([\s\S]+?)__/g,'<u>$1</u>');
  // explains the yellow bar on the group list; only shown when the deck has subgroups
  function legend(d){
    const s=d.groups.find(g=>g.level==='sub');
    if(!s) return '';
    return '<p class="legend"><span class="ybar"></span>Żółty pasek przy nazwie oznacza '+
      '<strong>podgrupę</strong> — mniejszą kategorię wewnątrz sekcji wypisanej nad nią '+
      '(np. <em>'+esc(s.title)+'</em> należy do <em>'+esc(s.parent)+'</em>). '+
      'Konkretne leki siedzą wtedy w podgrupach, a w samej sekcji zostaje teoria '+
      'i cechy wspólne — dlatego bywa w niej mało fiszek.</p>';
  }
  function cellHTML(c){
    if(typeof c==='string') return '<p>'+md(c)+'</p>';
    if(c.length===1) return '<p>'+md(c[0])+'</p>';
    return '<ul>'+c.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>';
  }
  const setTitle=()=> st.g==='all' ? 'Cała talia' : DECKS[st.d].groups[st.g].title;
  function pile(){
    const d=DECKS[st.d];
    return st.g==='all' ? d.groups.flatMap(g=>g.cards.map(c=>({c,g})))
                        : d.groups[st.g].cards.map(c=>({c,g:d.groups[st.g]}));
  }
  function buildOrder(){
    const n=pile().length;
    st.order=[...Array(n).keys()];
    if(st.shuffle) for(let k=n-1;k>0;k--){const j=Math.random()*(k+1)|0;
      [st.order[k],st.order[j]]=[st.order[j],st.order[k]];}
    st.grades=new Array(n).fill(null); st.i=0; st.shown=false;
  }
  const score=()=>({good:st.grades.filter(x=>x==='good').length,
                    bad: st.grades.filter(x=>x==='bad').length});
  function syncChrome(){
    const r=document.documentElement;
    r.style.setProperty('--bar',document.getElementById('bar').offsetHeight+'px');
    r.style.setProperty('--foot',(st.phase==='study'||st.phase==='done')?foot.offsetHeight+'px':'0px');
  }
  function setCrumb(){
    const p=[{l:'Fiszki',go:()=>nav({d:null})}];
    if(st.d!==null){
      p.push({l:DECKS[st.d].label,go:()=>nav({d:st.d,phase:'groups'})});
      if(st.g!==null) p.push({l:setTitle(),go:st.phase==='start'?null:()=>nav({d:st.d,g:st.g,phase:'start'})});
    }
    crumb.innerHTML=p.map((x,i)=>(i?'<span class="sep">›</span>':'')+
      (x.go?'<a class="c" data-i="'+i+'">'+esc(x.l)+'</a>':'<span class="cur">'+esc(x.l)+'</span>')).join(' ');
    crumb.querySelectorAll('.c').forEach(a=>a.onclick=()=>p[+a.dataset.i].go());
    backBtn.disabled=(st.d===null);
  }

  function render(){
    document.body.classList.toggle('study',st.phase==='study'||st.phase==='done');
    setCrumb(); foot.innerHTML=''; window.scrollTo(0,0);

    // ---------- 1. decks ----------
    if(st.d===null){
      view.innerHTML='<h1>Fiszki — farmakologia</h1>'+
        '<div class="eyebrow">Talie</div>'+
        DECKS.map((d,i)=>{const n=d.groups.reduce((s,g)=>s+g.cards.length,0);
          return '<button class="item deck" data-d="'+i+'"><span class="nm">'+esc(d.label)+
                 '</span><span class="meta">'+n+' fiszek</span><span class="arr">›</span></button>';}).join('');
      view.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>nav({d:+b.dataset.d,phase:'groups'}));
      syncChrome(); return;
    }
    const d=DECKS[st.d];

    // ---------- 2. groups ----------
    if(st.phase==='groups'){
      const tot=d.groups.reduce((s,g)=>s+g.cards.length,0);
      view.innerHTML='<h2>'+esc(d.title)+'</h2>'+
        '<button class="item all" data-g="all"><span class="nm">Cała talia — po kolei</span>'+
        '<span class="meta">'+tot+'</span><span class="arr">›</span></button>'+
        '<div class="eyebrow">Grupy</div>'+
        d.groups.map((g,i)=>'<button class="item'+(g.level==='sub'?' sub':'')+(g.quiz?' quiz':'')+'" data-g="'+i+'">'+
          '<span class="nm">'+esc(g.title)+'</span><span class="meta">'+g.cards.length+'</span>'+
          '<span class="arr">›</span></button>').join('')+legend(d);
      view.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>
        nav({d:st.d,g:(b.dataset.g==='all'?'all':+b.dataset.g),phase:'start'}));
      syncChrome(); return;
    }

    // ---------- 3. start screen: title + order choice + Start ----------
    if(st.phase==='start'){
      const n=pile().length;
      view.innerHTML=
        '<div class="startbox">'+
          '<div class="eyebrow" style="margin-top:0">Zestaw fiszek</div>'+
          '<h1 class="settitle">'+esc(setTitle())+'</h1>'+
          '<p class="sub">'+n+' fiszek</p>'+
          '<div class="eyebrow">Kolejność</div>'+
          '<button class="opt" data-sh="0" aria-pressed="'+(!st.shuffle)+'">'+
            '<span class="o1">Po kolei</span><span class="o2">tak jak w tabelce</span></button>'+
          '<button class="opt" data-sh="1" aria-pressed="'+st.shuffle+'">'+
            '<span class="o1">Losowo</span><span class="o2">fiszki w losowej kolejności</span></button>'+
          '<button class="startbtn" data-act="start">Start</button>'+
        '</div>';
      view.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{
        st.shuffle=(b.dataset.sh==='1'); render(); });
      view.querySelector('[data-act="start"]').onclick=()=>{
        buildOrder(); st.phase='study'; render(); };
      syncChrome(); return;
    }

    const list=pile(), ord=st.order, s=score();

    // ---------- 5. done ----------
    if(st.phase==='done'){
      const pct=ord.length?Math.round(s.good/ord.length*100):0;
      view.innerHTML='<div class="done"><h3>Koniec 🎉</h3>'+
        '<p>'+esc(setTitle())+'</p>'+
        '<div class="scorebig"><span class="sg">'+s.good+'</span><span class="ss">/</span>'+
          '<span class="st">'+ord.length+'</span></div>'+
        '<p class="pct">'+pct+'% dobrych odpowiedzi</p>'+
        '<div class="tally"><span class="good">✓ dobrze: '+s.good+'</span>'+
          '<span class="bad">✗ źle: '+s.bad+'</span></div></div>';
      foot.innerHTML='<button data-act="restart" class="w1 main">Jeszcze raz</button>'+
                     '<button data-act="groups" class="w1">Inny zestaw</button>';
    }else{
    // ---------- 4. study ----------
      const {c,g}=list[ord[st.i]];
      let q,cls='',kind='';
      // the group is already in the header above, so it is only repeated on the card
      // during a whole-deck run, where the header just says "Cała talia"
      if(c.t==='list'){ cls=' listq';
        q='<p class="q">'+esc(c.q)+'<span class="col">WYMIEŃ LEKI Z GRUPY</span></p>'; }
      else if(c.t==='rev'){ cls=' rev';
        q='<p class="q">'+esc(c.q)+'<span class="col">PODAJ LEK</span></p>'; }
      else{ cls=c.y?' theory':'';
        if(st.g==='all') kind='<div class="kind">'+
          esc((g.level==='sub'?g.parent+' › ':'')+g.title)+'</div>';
        q='<p class="q">'+esc(c.name)+'<span class="col">'+esc(c.col)+'</span>'+
          '<span class="colsub">'+esc(c.sub)+'</span></p>'; }
      const ans=st.shown ? '<div class="ans">'+(
            c.t==='list'
          ? c.blocks.map(b=>(b.h?'<div class="blkh">'+esc(b.h)+'</div>':'')+
              '<ol>'+b.items.map(x=>'<li>'+md(x)+'</li>').join('')+'</ol>').join('')
          : c.t==='rev'
          ? '<p class="revans">'+esc(c.a)+'</p><div class="revsrc">'+esc(c.src)+'</div>'
          : cellHTML(c.a))+'</div>' : '';
      view.innerHTML=
        '<div class="prog"><div class="bar"><i style="width:'+
          Math.round((st.i+1)/ord.length*100)+'%"></i></div>'+
          '<span class="cnt">'+(st.i+1)+' / '+ord.length+'</span></div>'+
        '<div class="tally small"><span class="good">✓ '+s.good+'</span>'+
          '<span class="bad">✗ '+s.bad+'</span></div>'+
        '<div class="fc'+cls+'" id="fc">'+kind+q+
          (st.shown?ans:'<div class="flip">Dotknij, żeby zobaczyć odpowiedź</div>')+'</div>';
      const atStart=(st.i===0 && !st.shown);
      foot.innerHTML= st.shown
        ? '<button data-act="back" class="w1">‹ Wstecz</button>'+
          '<button data-act="bad"  class="w1 bad">✗ Źle</button>'+
          '<button data-act="good" class="w1 good">✓ Dobrze</button>'
        : '<button data-act="back" class="w1"'+(atStart?' disabled':'')+'>‹ Wstecz</button>'+
          '<button data-act="reveal" class="w2 main">Odpowiedź</button>';
      // tapping the card only reveals, so a stray tap can't hide what you are reading
      document.getElementById('fc').onclick=()=>{ if(!st.shown){ st.shown=true; render(); } };
    }

    const act=e=>{
      const a=e.currentTarget.dataset.act;
      if(a==='reveal'){ st.shown=true; }
      else if(a==='back'){
        if(st.shown) st.shown=false;            // 1st press: hide the answer again
        else if(st.i>0){ st.i--; st.shown=false; // 2nd press: previous card, face down
          st.grades[st.i]=null;                 // its old grade is undone, so the tally goes back too
        }
      }
      else if(a==='good'||a==='bad'){
        st.grades[st.i]=(a==='good'?'good':'bad');
        if(st.i===st.order.length-1){ st.phase='done'; }
        else { st.i++; st.shown=false; }
      }
      else if(a==='restart'){ st.phase='start'; }
      else if(a==='groups'){ return nav({d:st.d,phase:'groups'}); }
      render();
    };
    view.querySelectorAll('[data-act]').forEach(b=>b.onclick=act);
    foot.querySelectorAll('[data-act]').forEach(b=>b.onclick=act);
    syncChrome();
  }

  function nav(n){
    st={...st, d:(n.d===undefined?st.d:n.d), g:(n.g===undefined?null:n.g),
        phase:(n.phase===undefined?null:n.phase), order:null, i:0, shown:false, grades:[]};
    render();
  }
  function goBack(){
    if(st.phase==='study'||st.phase==='done') nav({d:st.d,g:st.g,phase:'start'});
    else if(st.phase==='start') nav({d:st.d,phase:'groups'});
    else if(st.d!==null) nav({d:null});
  }
  backBtn.onclick=goBack;

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') return goBack();
    if(st.phase!=='study') return;
    if(e.key===' '||e.key==='Enter'){ e.preventDefault();
      if(!st.shown){ st.shown=true; render(); } return; }
    if(e.key==='ArrowLeft'){ const b=foot.querySelector('[data-act="back"]'); if(b&&!b.disabled) b.click(); }
    if(st.shown){
      if(e.key==='1') foot.querySelector('[data-act="bad"]').click();
      if(e.key==='2') foot.querySelector('[data-act="good"]').click();
    }
  });

  window.addEventListener('resize',syncChrome);
  window.addEventListener('orientationchange',()=>setTimeout(syncChrome,250));
  if(window.visualViewport) window.visualViewport.addEventListener('resize',syncChrome);
  render(); setTimeout(syncChrome,60);
})();
</script>
</body>
</html>
